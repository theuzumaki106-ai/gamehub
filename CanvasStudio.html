<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanvasStudio</title>
  <link rel="stylesheet" href="cs.css">
</head>
<body>

  <!-- TOP MENU BAR -->
  <header class="top-bar">
    <div class="menu-group">
      <div class="app-title">🎨 CanvasStudio Pro</div>
      
      <div class="dropdown">
        <button class="menu-btn">File</button>
        <div class="dropdown-content">
          <button id="menu-new">New Canvas...</button>
          <button id="menu-open">Open Image...</button>
          <button id="menu-save">Save Project State</button>
          <button id="menu-export">Export Image... <span class="shortcut">PNG/JPG</span></button>
          <button id="menu-print">Print Canvas</button>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn">Edit</button>
        <div class="dropdown-content">
          <button id="menu-undo">Undo <span class="shortcut">Ctrl+Z</span></button>
          <button id="menu-redo">Redo <span class="shortcut">Ctrl+Y</span></button>
          <button id="menu-cut">Cut <span class="shortcut">Ctrl+X</span></button>
          <button id="menu-copy">Copy <span class="shortcut">Ctrl+C</span></button>
          <button id="menu-paste">Paste <span class="shortcut">Ctrl+V</span></button>
          <button id="menu-resize" style="border-top: 1px solid var(--border-color);">Resize Canvas...</button>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn">View <span id="zoom-indicator"></span></button>
        <div class="dropdown-content">
          <button id="menu-zoom-in">Zoom In <span class="shortcut">Ctrl++</span></button>
          <button id="menu-zoom-out">Zoom Out <span class="shortcut">Ctrl+-</span></button>
          <button id="menu-zoom-reset">Reset Zoom <span class="shortcut">Ctrl+0</span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="workspace">

    <!-- LEFT TOOLBAR -->
    <nav class="left-toolbar">
      <button class="tool-btn active" id="tool-brush" title="Brush Tool (B)">🖌️</button>
      <button class="tool-btn" id="tool-eraser" title="Eraser Tool (E)">🧹</button>
      <button class="tool-btn" id="tool-shape" title="Shapes Tool (S)">🟩</button>
      <button class="tool-btn" id="tool-eyedropper" title="Eyedropper Tool (I)">🧪</button>
      <button class="tool-btn" id="tool-transform" title="Transform Layer (T)">📐</button>
    </nav>

    <!-- CENTER CANVAS WORKSPACE -->
    <main class="canvas-container" id="canvas-container">
      <div class="canvas-viewport" id="canvas-viewport">
        <!-- Canvas layers & preview canvas will be dynamically injected here -->
      </div>
    </main>

    <!-- RIGHT CONTROL PANELS -->
    <aside class="right-sidebar">

      <!-- TOOL OPTIONS PANEL -->
      <section class="panel">
        <div class="panel-title">Tool Options</div>
        
        <!-- BRUSH OPTIONS -->
        <div id="panel-brush-options">
          <div class="control-group">
            <label>Brush Type</label>
            <select id="brush-type">
              <option value="pencil">Pencil (Hard)</option>
              <option value="marker">Marker (Semi-transparent)</option>
              <option value="airbrush">Airbrush (Soft)</option>
              <option value="watercolor">Watercolor (Dynamic)</option>
            </select>
          </div>

          <div class="control-group">
            <label>Size <span id="val-size">10px</span></label>
            <input type="range" id="brush-size" min="1" max="100" value="10">
          </div>

          <div class="control-group">
            <label>Opacity / Flow <span id="val-opacity">100%</span></label>
            <input type="range" id="brush-opacity" min="1" max="100" value="100">
          </div>
        </div>

        <!-- ERASER OPTIONS -->
        <div id="panel-eraser-options" style="display:none;">
          <div class="control-group">
            <label>Size <span id="val-eraser-size">10px</span></label>
            <input type="range" id="eraser-size" min="1" max="100" value="10">
          </div>
          <div class="control-group">
            <label>Hardness / Feather <span id="val-hardness">80%</span></label>
            <input type="range" id="eraser-hardness" min="0" max="100" value="80">
          </div>
        </div>

        <!-- SHAPE OPTIONS -->
        <div id="panel-shape-options" style="display:none;">
          <div class="control-group">
            <label>Shape Type</label>
            <select id="shape-type">
              <option value="rectangle">Rectangle</option>
              <option value="circle">Circle / Ellipse</option>
              <option value="line">Line</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>

          <div class="control-group">
            <label class="checkbox-group">
              <input type="checkbox" id="shape-fill-enable" checked> Enable Fill
            </label>
          </div>

          <div class="control-group">
            <label class="checkbox-group">
              <input type="checkbox" id="shape-border-enable" checked> Enable Border
            </label>
          </div>

          <div class="control-group">
            <label>Border Width <span id="val-border-width">4px</span></label>
            <input type="range" id="shape-border-width" min="1" max="50" value="4">
          </div>

          <div class="control-group">
            <label>Opacity <span id="val-shape-opacity">100%</span></label>
            <input type="range" id="shape-opacity" min="1" max="100" value="100">
          </div>
        </div>
      </section>

      <!-- COLOR PALETTE & CANVAS BACKGROUND -->
      <section class="panel">
        <div class="panel-title">Colors & Canvas BG</div>
        <div class="color-picker-wrapper">
          <div class="color-picker-item">
            <label>Primary</label>
            <input type="color" id="color-picker" value="#007acc">
          </div>
          <div class="color-picker-item">
            <label>Border/Sec</label>
            <input type="color" id="color-border-picker" value="#ffffff">
          </div>
          <div class="color-picker-item">
            <label>Canvas BG</label>
            <input type="color" id="canvas-bg-picker" value="#ffffff">
          </div>
        </div>

        <div class="control-group">
          <label class="checkbox-group" style="margin-bottom:8px;">
            <input type="checkbox" id="canvas-transparent-toggle"> Transparent Canvas BG
          </label>
        </div>

        <div class="swatches" id="swatches"></div>
      </section>

      <!-- LAYERS PANEL -->
      <section class="panel" style="flex:1;">
        <div class="panel-title">Layers</div>
        <div class="layer-controls">
          <button class="btn-small" id="btn-add-layer" title="Add Layer">+ New</button>
          <button class="btn-small" id="btn-dup-layer" title="Duplicate Layer">Duplicate</button>
          <button class="btn-small" id="btn-merge-layer" title="Merge Down">Merge Down</button>
          <button class="btn-small" id="btn-del-layer" title="Delete Layer">Delete</button>
        </div>
        <div class="layer-controls">
          <button class="btn-small" id="btn-layer-up">Move Up</button>
          <button class="btn-small" id="btn-layer-down">Move Down</button>
        </div>
        <div class="layers-list" id="layers-list"></div>
      </section>

    </aside>
  </div>

  <input type="file" id="file-input" accept="image/*">

  <script>
    /**
     * CanvasStudio Engine Core Implementation
     */
    class DrawingApp {
      constructor() {
        // App State
        this.width = 800;
        this.height = 600;
        this.zoomLevel = 1.0; // Added Zoom State
        this.activeTool = 'brush'; // 'brush', 'eraser', 'shape', 'eyedropper', 'transform'
        this.activeBrushType = 'pencil';
        this.brushSize = 10;
        this.brushOpacity = 1.0;
        this.eraserHardness = 0.8;
        
        // Primary, Secondary, Background Colors
        this.primaryColor = '#007acc';
        this.borderColor = '#ffffff';
        this.canvasBgColor = '#ffffff';
        this.isCanvasTransparent = false;

        // Shape Properties
        this.activeShapeType = 'rectangle';
        this.shapeFillEnable = true;
        this.shapeBorderEnable = true;
        this.shapeBorderWidth = 4;
        this.shapeOpacity = 1.0;

        // Layers Stack
        this.layers = [];
        this.activeLayerIndex = -1;
        this.layerCounter = 0;

        // Clipboard
        this.clipboardData = null;

        // History State Stack
        this.history = [];
        this.historyStep = -1;
        this.maxHistory = 20;

        // Input Handling & Canvas Mechanics
        this.isDrawing = false;
        this.lastPoint = null;
        this.shapeStartPoint = null;

        // Transform Tool Mechanics
        this.isTransforming = false;
        this.transformStart = { x: 0, y: 0 };

        // DOM Elements
        this.viewport = document.getElementById('canvas-viewport');
        this.layersListEl = document.getElementById('layers-list');
        this.fileInput = document.getElementById('file-input');
        this.zoomIndicator = document.getElementById('zoom-indicator');

        // Preview Canvas initialization (for vector shapes live drawing)
        this.previewCanvas = document.createElement('canvas');
        this.previewCanvas.id = 'preview-canvas';
        this.previewCanvas.className = 'layer-canvas';
        this.previewCtx = this.previewCanvas.getContext('2d');

        this.initUI();
        this.initCanvasViewport(this.width, this.height);
        this.addLayer("Layer 1", false);
        this.saveHistoryState();
      }

      /* --- INITIALIZATION & UI SETUP --- */
      initUI() {
        // Tool Buttons Navigation
        ['brush', 'eraser', 'shape', 'eyedropper', 'transform'].forEach(tool => {
          document.getElementById(`tool-${tool}`).addEventListener('click', () => this.setTool(tool));
        });

        this.updateToolOptionsPanels();

        // Brush Settings Controls
        document.getElementById('brush-type').addEventListener('change', (e) => this.activeBrushType = e.target.value);
        
        const sizeInput = document.getElementById('brush-size');
        sizeInput.addEventListener('input', (e) => {
          this.brushSize = parseInt(e.target.value, 10);
          document.getElementById('val-size').innerText = `${this.brushSize}px`;
        });

        const opacityInput = document.getElementById('brush-opacity');
        opacityInput.addEventListener('input', (e) => {
          this.brushOpacity = parseInt(e.target.value, 10) / 100;
          document.getElementById('val-opacity').innerText = `${e.target.value}%`;
        });

        // Eraser Controls
        const eraserSizeInput = document.getElementById('eraser-size');
        eraserSizeInput.addEventListener('input', (e) => {
          this.brushSize = parseInt(e.target.value, 10);
          document.getElementById('val-eraser-size').innerText = `${this.brushSize}px`;
        });

        const hardnessInput = document.getElementById('eraser-hardness');
        hardnessInput.addEventListener('input', (e) => {
          this.eraserHardness = parseInt(e.target.value, 10) / 100;
          document.getElementById('val-hardness').innerText = `${e.target.value}%`;
        });

        // Shape Controls Setup
        document.getElementById('shape-type').addEventListener('change', (e) => this.activeShapeType = e.target.value);
        document.getElementById('shape-fill-enable').addEventListener('change', (e) => this.shapeFillEnable = e.target.checked);
        document.getElementById('shape-border-enable').addEventListener('change', (e) => this.shapeBorderEnable = e.target.checked);

        const borderWidthInput = document.getElementById('shape-border-width');
        borderWidthInput.addEventListener('input', (e) => {
          this.shapeBorderWidth = parseInt(e.target.value, 10);
          document.getElementById('val-border-width').innerText = `${this.shapeBorderWidth}px`;
        });

        const shapeOpacityInput = document.getElementById('shape-opacity');
        shapeOpacityInput.addEventListener('input', (e) => {
          this.shapeOpacity = parseInt(e.target.value, 10) / 100;
          document.getElementById('val-shape-opacity').innerText = `${e.target.value}%`;
        });

        // Color Pickers Setup
        const colorPicker = document.getElementById('color-picker');
        const colorBorderPicker = document.getElementById('color-border-picker');
        const canvasBgPicker = document.getElementById('canvas-bg-picker');
        const transparentToggle = document.getElementById('canvas-transparent-toggle');

        colorPicker.addEventListener('input', (e) => this.primaryColor = e.target.value);
        colorBorderPicker.addEventListener('input', (e) => this.borderColor = e.target.value);

        canvasBgPicker.addEventListener('input', (e) => {
          this.canvasBgColor = e.target.value;
          this.updateCanvasBackground();
        });

        transparentToggle.addEventListener('change', (e) => {
          this.isCanvasTransparent = e.target.checked;
          this.updateCanvasBackground();
        });

        const swatchColors = ['#000000', '#ffffff', '#7f7f7f', '#c3c3c3', '#880015', '#ed1c24', 
                              '#ff7f27', '#fff200', '#22b14c', '#00a2e8', '#3f48cc', '#a349a4'];
        const swatchesContainer = document.getElementById('swatches');
        swatchColors.forEach(color => {
          const el = document.createElement('div');
          el.className = 'swatch';
          el.style.backgroundColor = color;
          el.addEventListener('click', () => {
            this.primaryColor = color;
            colorPicker.value = color;
          });
          swatchesContainer.appendChild(el);
        });

        // Layer Action Controls
        document.getElementById('btn-add-layer').addEventListener('click', () => this.addLayer());
        document.getElementById('btn-dup-layer').addEventListener('click', () => this.duplicateActiveLayer());
        document.getElementById('btn-del-layer').addEventListener('click', () => this.deleteActiveLayer());
        document.getElementById('btn-merge-layer').addEventListener('click', () => this.mergeLayerDown());
        document.getElementById('btn-layer-up').addEventListener('click', () => this.moveLayerOrder(-1));
        document.getElementById('btn-layer-down').addEventListener('click', () => this.moveLayerOrder(1));

        // Top Bar Dropdowns Menu Actions
        document.getElementById('menu-new').addEventListener('click', () => this.promptNewCanvas());
        document.getElementById('menu-open').addEventListener('click', () => this.fileInput.click());
        document.getElementById('menu-save').addEventListener('click', () => this.saveProjectState());
        document.getElementById('menu-export').addEventListener('click', () => this.exportImage());
        document.getElementById('menu-print').addEventListener('click', () => this.printCanvas());

        // Edit Actions including Resize
        document.getElementById('menu-undo').addEventListener('click', () => this.undo());
        document.getElementById('menu-redo').addEventListener('click', () => this.redo());
        document.getElementById('menu-cut').addEventListener('click', () => this.cut());
        document.getElementById('menu-copy').addEventListener('click', () => this.copy());
        document.getElementById('menu-paste').addEventListener('click', () => this.paste());
        document.getElementById('menu-resize').addEventListener('click', () => this.promptResizeCanvas());

        // View Actions for Zoom
        document.getElementById('menu-zoom-in').addEventListener('click', () => this.zoomIn());
        document.getElementById('menu-zoom-out').addEventListener('click', () => this.zoomOut());
        document.getElementById('menu-zoom-reset').addEventListener('click', () => this.resetZoom());

        this.fileInput.addEventListener('change', (e) => this.handleFileOpen(e));

        // Keyboard Shortcuts Handler
        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            e.shiftKey ? this.redo() : this.undo();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
            e.preventDefault();
            this.redo();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
            e.preventDefault();
            this.cut();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
            e.preventDefault();
            this.copy();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
            e.preventDefault();
            this.paste();
          } else if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
            e.preventDefault();
            this.zoomIn();
          } else if ((e.ctrlKey || e.metaKey) && e.key === '-') {
            e.preventDefault();
            this.zoomOut();
          } else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
            e.preventDefault();
            this.resetZoom();
          } else if (e.key.toLowerCase() === 'b') {
            this.setTool('brush');
          } else if (e.key.toLowerCase() === 'e') {
            this.setTool('eraser');
          } else if (e.key.toLowerCase() === 's') {
            this.setTool('shape');
          } else if (e.key.toLowerCase() === 'i') {
            this.setTool('eyedropper');
          } else if (e.key.toLowerCase() === 't') {
            this.setTool('transform');
          }
        });

        // Pointer Events setup
        this.viewport.addEventListener('mousedown', (e) => this.handlePointerDown(e));
        window.addEventListener('mousemove', (e) => this.handlePointerMove(e));
        window.addEventListener('mouseup', () => this.handlePointerUp());

        this.viewport.addEventListener('touchstart', (e) => this.handlePointerDown(e.touches[0]), {passive: false});
        window.addEventListener('touchmove', (e) => this.handlePointerMove(e.touches[0]), {passive: false});
        window.addEventListener('touchend', () => this.handlePointerUp());
      }

      initCanvasViewport(w, h) {
        this.width = w;
        this.height = h;
        this.viewport.style.width = `${w}px`;
        this.viewport.style.height = `${h}px`;
        
        this.previewCanvas.width = w;
        this.previewCanvas.height = h;

        this.resetZoom();
        this.updateCanvasBackground();
      }

      updateCanvasBackground() {
        if (this.isCanvasTransparent) {
          this.viewport.classList.add('checkerboard');
          this.viewport.style.backgroundColor = 'transparent';
        } else {
          this.viewport.classList.remove('checkerboard');
          this.viewport.style.backgroundColor = this.canvasBgColor;
        }
      }

      setTool(tool) {
        this.activeTool = tool;
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tool-${tool}`).classList.add('active');
        this.updateToolOptionsPanels();
      }

      updateToolOptionsPanels() {
        document.getElementById('panel-brush-options').style.display = this.activeTool === 'brush' ? 'block' : 'none';
        document.getElementById('panel-eraser-options').style.display = this.activeTool === 'eraser' ? 'block' : 'none';
        document.getElementById('panel-shape-options').style.display = this.activeTool === 'shape' ? 'block' : 'none';
      }

      /* --- ZOOM & RESIZE MANAGEMENT --- */
      zoomIn() { this.setZoom(this.zoomLevel + 0.2); }
      zoomOut() { this.setZoom(this.zoomLevel - 0.2); }
      resetZoom() { this.setZoom(1.0); }

      setZoom(level) {
        this.zoomLevel = Math.max(0.2, Math.min(level, 5.0)); // Boundary 20% to 500%
        this.viewport.style.transform = `scale(${this.zoomLevel})`;
        this.zoomIndicator.innerText = `(${Math.round(this.zoomLevel * 100)}%)`;
      }

      promptResizeCanvas() {
        const w = prompt("Enter new canvas width (px):", this.width);
        const h = prompt("Enter new canvas height (px):", this.height);
        
        if (w && h) {
          const newW = parseInt(w, 10);
          const newH = parseInt(h, 10);
          if (newW > 0 && newH > 0) {
            this.resizeCanvas(newW, newH);
          }
        }
      }

      resizeCanvas(newW, newH) {
        this.width = newW;
        this.height = newH;
        this.viewport.style.width = `${newW}px`;
        this.viewport.style.height = `${newH}px`;
        
        this.previewCanvas.width = newW;
        this.previewCanvas.height = newH;

        // Iterate through all layers, backing up content and drawing it onto newly resized canvas
        this.layers.forEach(layer => {
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = layer.canvas.width;
          tempCanvas.height = layer.canvas.height;
          tempCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);

          layer.canvas.width = newW;
          layer.canvas.height = newH;
          layer.ctx.drawImage(tempCanvas, 0, 0);
        });

        this.saveHistoryState();
      }

      /* --- LAYER MANAGEMENT SYSTEM --- */
      addLayer(name = null, fillWhite = false) {
        this.layerCounter++;
        const layerName = name || `Layer ${this.layerCounter}`;
        
        const canvas = document.createElement('canvas');
        canvas.width = this.width;
        canvas.height = this.height;
        canvas.className = 'layer-canvas';
        
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        if (fillWhite) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, this.width, this.height);
        }

        const layer = {
          id: Date.now() + Math.random(),
          name: layerName,
          canvas: canvas,
          ctx: ctx,
          visible: true,
          locked: false
        };

        const insertIndex = this.activeLayerIndex >= 0 ? this.activeLayerIndex + 1 : this.layers.length;
        this.layers.splice(insertIndex, 0, layer);
        this.activeLayerIndex = insertIndex;

        this.renderLayerStack();
        this.updateLayersUI();
        return layer;
      }

      renderLayerStack() {
        this.viewport.innerHTML = '';
        this.layers.forEach(layer => {
          layer.canvas.style.display = layer.visible ? 'block' : 'none';
          this.viewport.appendChild(layer.canvas);
        });
        // Always append vector preview canvas on top
        this.viewport.appendChild(this.previewCanvas);
      }

      updateLayersUI() {
        this.layersListEl.innerHTML = '';
        
        [...this.layers].reverse().forEach((layer, revIdx) => {
          const actualIndex = this.layers.length - 1 - revIdx;
          
          const item = document.createElement('div');
          item.className = `layer-item ${actualIndex === this.activeLayerIndex ? 'active' : ''}`;
          
          const visBtn = document.createElement('button');
          visBtn.className = `layer-icon-btn ${layer.visible ? 'active' : ''}`;
          visBtn.innerText = layer.visible ? '👁️' : '🙈';
          visBtn.onclick = (e) => {
            e.stopPropagation();
            layer.visible = !layer.visible;
            this.renderLayerStack();
            this.updateLayersUI();
          };

          const lockBtn = document.createElement('button');
          lockBtn.className = `layer-icon-btn ${layer.locked ? 'active' : ''}`;
          lockBtn.innerText = layer.locked ? '🔒' : '🔓';
          lockBtn.onclick = (e) => {
            e.stopPropagation();
            layer.locked = !layer.locked;
            this.updateLayersUI();
          };

          const nameEl = document.createElement('span');
          nameEl.className = 'layer-name';
          nameEl.innerText = layer.name;

          item.appendChild(visBtn);
          item.appendChild(lockBtn);
          item.appendChild(nameEl);

          item.onclick = () => {
            this.activeLayerIndex = actualIndex;
            this.updateLayersUI();
          };

          this.layersListEl.appendChild(item);
        });
      }

      getActiveLayer() {
        if (this.activeLayerIndex < 0 || this.activeLayerIndex >= this.layers.length) return null;
        return this.layers[this.activeLayerIndex];
      }

      deleteActiveLayer() {
        if (this.layers.length <= 1) return;
        this.layers.splice(this.activeLayerIndex, 1);
        this.activeLayerIndex = Math.max(0, this.activeLayerIndex - 1);
        this.renderLayerStack();
        this.updateLayersUI();
        this.saveHistoryState();
      }

      duplicateActiveLayer() {
        const active = this.getActiveLayer();
        if (!active) return;
        
        const newLayer = this.addLayer(`${active.name} Copy`);
        newLayer.ctx.drawImage(active.canvas, 0, 0);
        this.saveHistoryState();
      }

      mergeLayerDown() {
        if (this.activeLayerIndex <= 0) return;
        
        const currentLayer = this.layers[this.activeLayerIndex];
        const targetLayer = this.layers[this.activeLayerIndex - 1];

        targetLayer.ctx.drawImage(currentLayer.canvas, 0, 0);
        this.layers.splice(this.activeLayerIndex, 1);
        this.activeLayerIndex--;
        
        this.renderLayerStack();
        this.updateLayersUI();
        this.saveHistoryState();
      }

      moveLayerOrder(direction) {
        const targetIdx = this.activeLayerIndex + direction;
        if (targetIdx < 0 || targetIdx >= this.layers.length) return;

        const temp = this.layers[this.activeLayerIndex];
        this.layers[this.activeLayerIndex] = this.layers[targetIdx];
        this.layers[targetIdx] = temp;
        
        this.activeLayerIndex = targetIdx;
        this.renderLayerStack();
        this.updateLayersUI();
        this.saveHistoryState();
      }

      /* --- INPUT DRAWING & SHAPE ENGINE --- */
      getCanvasCoordinates(e) {
        const rect = this.viewport.getBoundingClientRect();
        // Uses width ratio to interpret coordinates accurately even while zoomed
        const scaleX = this.width / rect.width;
        const scaleY = this.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }

      handlePointerDown(e) {
        const activeLayer = this.getActiveLayer();
        if (!activeLayer || !activeLayer.visible || activeLayer.locked) return;

        const pos = this.getCanvasCoordinates(e);

        if (this.activeTool === 'eyedropper') {
          this.pickColor(pos.x, pos.y);
          return;
        }

        if (this.activeTool === 'transform') {
          this.isTransforming = true;
          this.transformStart = pos;
          return;
        }

        this.isDrawing = true;
        this.lastPoint = pos;
        this.shapeStartPoint = pos;

        if (this.activeTool === 'brush' || this.activeTool === 'eraser') {
          this.drawStroke(pos, pos);
        }
      }

      handlePointerMove(e) {
        const pos = this.getCanvasCoordinates(e);

        if (this.isTransforming) {
          const dx = pos.x - this.transformStart.x;
          const dy = pos.y - this.transformStart.y;
          this.transformLayer(dx, dy);
          this.transformStart = pos;
          return;
        }

        if (!this.isDrawing) return;

        if (this.activeTool === 'brush' || this.activeTool === 'eraser') {
          this.drawStroke(this.lastPoint, pos);
          this.lastPoint = pos;
        } else if (this.activeTool === 'shape') {
          // Render dynamic preview of the vector shape on top
          this.previewCtx.clearRect(0, 0, this.width, this.height);
          this.renderShape(this.previewCtx, this.shapeStartPoint, pos);
        }
      }

      handlePointerUp(e) {
        if (!this.isDrawing && !this.isTransforming) return;

        if (this.activeTool === 'shape' && this.isDrawing) {
          const activeLayer = this.getActiveLayer();
          if (activeLayer && this.lastPoint) {
            // Commit shape from preview onto active layer context
            this.renderShape(activeLayer.ctx, this.shapeStartPoint, this.lastPoint);
            this.previewCtx.clearRect(0, 0, this.width, this.height);
          }
        }

        this.isDrawing = false;
        this.isTransforming = false;
        this.saveHistoryState();
      }

      drawStroke(start, end) {
        const layer = this.getActiveLayer();
        if (!layer) return;
        const ctx = layer.ctx;

        ctx.save();
        if (this.activeTool === 'eraser') {
          this.applyEraserStroke(ctx, start, end);
        } else if (this.activeTool === 'brush') {
          this.applyBrushStroke(ctx, start, end);
        }
        ctx.restore();
      }

      applyBrushStroke(ctx, start, end) {
        ctx.globalAlpha = this.brushOpacity;
        ctx.fillStyle = this.primaryColor;
        ctx.strokeStyle = this.primaryColor;

        switch (this.activeBrushType) {
          case 'pencil':
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = this.brushSize;
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
            break;

          case 'marker':
            ctx.globalAlpha = this.brushOpacity * 0.4;
            ctx.lineCap = 'square';
            ctx.lineWidth = this.brushSize;
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
            break;

          case 'airbrush':
            const dist = Math.hypot(end.x - start.x, end.y - start.y);
            const steps = Math.max(1, Math.floor(dist / 2));
            const radius = this.brushSize;

            for (let i = 0; i < steps; i++) {
              const lx = start.x + (end.x - start.x) * (i / steps);
              const ly = start.y + (end.y - start.y) * (i / steps);
              
              const grad = ctx.createRadialGradient(lx, ly, 0, lx, ly, radius);
              grad.addColorStop(0, this.primaryColor);
              grad.addColorStop(1, 'transparent');
              
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(lx, ly, radius, 0, Math.PI * 2);
              ctx.fill();
            }
            break;

          case 'watercolor':
            ctx.globalAlpha = this.brushOpacity * 0.15;
            ctx.lineCap = 'round';
            ctx.lineWidth = this.brushSize;

            for (let i = 0; i < 3; i++) {
              const offsetX = (Math.random() - 0.5) * (this.brushSize * 0.2);
              const offsetY = (Math.random() - 0.5) * (this.brushSize * 0.2);
              ctx.beginPath();
              ctx.moveTo(start.x + offsetX, start.y + offsetY);
              ctx.lineTo(end.x + offsetX, end.y + offsetY);
              ctx.stroke();
            }
            break;
        }
      }

      applyEraserStroke(ctx, start, end) {
        ctx.globalCompositeOperation = 'destination-out';
        
        const dist = Math.hypot(end.x - start.x, end.y - start.y);
        const steps = Math.max(1, Math.floor(dist / 2));
        const radius = this.brushSize / 2;

        for (let i = 0; i <= steps; i++) {
          const x = start.x + (end.x - start.x) * (i / steps);
          const y = start.y + (end.y - start.y) * (i / steps);

          const grad = ctx.createRadialGradient(x, y, radius * this.eraserHardness, x, y, radius);
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      /* --- SHAPE RENDERING ENGINE --- */
      renderShape(ctx, start, current) {
        ctx.save();
        ctx.globalAlpha = this.shapeOpacity;
        ctx.fillStyle = this.primaryColor;
        ctx.strokeStyle = this.borderColor;
        ctx.lineWidth = this.shapeBorderWidth;

        const x = Math.min(start.x, current.x);
        const y = Math.min(start.y, current.y);
        const w = Math.abs(current.x - start.x);
        const h = Math.abs(current.y - start.y);

        ctx.beginPath();

        switch (this.activeShapeType) {
          case 'rectangle':
            ctx.rect(x, y, w, h);
            break;

          case 'circle':
            const rx = w / 2;
            const ry = h / 2;
            const cx = x + rx;
            const cy = y + ry;
            ctx.ellipse(cx, cy, Math.max(0, rx), Math.max(0, ry), 0, 0, 2 * Math.PI);
            break;

          case 'line':
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(current.x, current.y);
            break;

          case 'triangle':
            ctx.moveTo(x + w / 2, y);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.closePath();
            break;
        }

        if (this.activeShapeType !== 'line' && this.shapeFillEnable) {
          ctx.fill();
        }

        if (this.shapeBorderEnable || this.activeShapeType === 'line') {
          ctx.stroke();
        }

        ctx.restore();
      }

      /* --- COLOR PICKER / EYEDROPPER --- */
      pickColor(x, y) {
        const compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = this.width;
        compositeCanvas.height = this.height;
        const compCtx = compositeCanvas.getContext('2d');

        if (!this.isCanvasTransparent) {
          compCtx.fillStyle = this.canvasBgColor;
          compCtx.fillRect(0, 0, this.width, this.height);
        }

        this.layers.forEach(l => {
          if (l.visible) compCtx.drawImage(l.canvas, 0, 0);
        });

        const pixel = compCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
        const hex = `#${((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1)}`;
        
        this.primaryColor = hex;
        document.getElementById('color-picker').value = hex;
      }

      /* --- TRANSFORM TOOL --- */
      transformLayer(dx, dy) {
        const layer = this.getActiveLayer();
        if (!layer) return;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = this.width;
        tempCanvas.height = this.height;
        const tempCtx = tempCanvas.getContext('2d');

        tempCtx.drawImage(layer.canvas, 0, 0);
        layer.ctx.clearRect(0, 0, this.width, this.height);
        layer.ctx.drawImage(tempCanvas, dx, dy);
      }

      /* --- EDIT / CLIPBOARD OPERATIONS --- */
      cut() {
        this.copy();
        const layer = this.getActiveLayer();
        if (layer) {
          layer.ctx.clearRect(0, 0, this.width, this.height);
          this.saveHistoryState();
        }
      }

      copy() {
        const layer = this.getActiveLayer();
        if (!layer) return;
        this.clipboardData = layer.ctx.getImageData(0, 0, this.width, this.height);
      }

      paste() {
        if (!this.clipboardData) return;
        const newLayer = this.addLayer("Pasted Layer");
        newLayer.ctx.putImageData(this.clipboardData, 0, 0);
        this.saveHistoryState();
      }

      /* --- UNDO / REDO HISTORY SYSTEM --- */
      saveHistoryState() {
        if (this.historyStep < this.history.length - 1) {
          this.history = this.history.slice(0, this.historyStep + 1);
        }

        const snapshot = this.layers.map(layer => {
          const canvasCopy = document.createElement('canvas');
          canvasCopy.width = this.width;
          canvasCopy.height = this.height;
          canvasCopy.getContext('2d').drawImage(layer.canvas, 0, 0);

          return {
            id: layer.id,
            name: layer.name,
            visible: layer.visible,
            locked: layer.locked,
            canvasCopy: canvasCopy
          };
        });

        this.history.push({
          activeLayerIndex: this.activeLayerIndex,
          canvasBgColor: this.canvasBgColor,
          isCanvasTransparent: this.isCanvasTransparent,
          snapshot: snapshot
        });

        if (this.history.length > this.maxHistory) {
          this.history.shift();
        } else {
          this.historyStep++;
        }
      }

      restoreHistoryState(state) {
        this.canvasBgColor = state.canvasBgColor;
        this.isCanvasTransparent = state.isCanvasTransparent;
        document.getElementById('canvas-bg-picker').value = this.canvasBgColor;
        document.getElementById('canvas-transparent-toggle').checked = this.isCanvasTransparent;
        this.updateCanvasBackground();

        this.layers = state.snapshot.map(item => {
          const canvas = document.createElement('canvas');
          canvas.width = this.width;
          canvas.height = this.height;
          canvas.className = 'layer-canvas';
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(item.canvasCopy, 0, 0);

          return {
            id: item.id,
            name: item.name,
            canvas: canvas,
            ctx: ctx,
            visible: item.visible,
            locked: item.locked
          };
        });

        this.activeLayerIndex = Math.min(state.activeLayerIndex, this.layers.length - 1);
        this.renderLayerStack();
        this.updateLayersUI();
      }

      undo() {
        if (this.historyStep > 0) {
          this.historyStep--;
          this.restoreHistoryState(this.history[this.historyStep]);
        }
      }

      redo() {
        if (this.historyStep < this.history.length - 1) {
          this.historyStep++;
          this.restoreHistoryState(this.history[this.historyStep]);
        }
      }

      /* --- FILE OPERATIONS --- */
      promptNewCanvas() {
        const w = prompt("Enter canvas width (px):", this.width);
        const h = prompt("Enter canvas height (px):", this.height);
        
        if (w && h) {
          this.layers = [];
          this.history = [];
          this.historyStep = -1;
          this.initCanvasViewport(parseInt(w, 10), parseInt(h, 10));
          this.addLayer("Background", false);
          this.saveHistoryState();
        }
      }

      handleFileOpen(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const layer = this.addLayer(file.name.split('.')[0]);
            layer.ctx.drawImage(img, 0, 0, this.width, this.height);
            this.saveHistoryState();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }

      exportImage() {
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = this.width;
        exportCanvas.height = this.height;
        const expCtx = exportCanvas.getContext('2d');

        if (!this.isCanvasTransparent) {
          expCtx.fillStyle = this.canvasBgColor;
          expCtx.fillRect(0, 0, this.width, this.height);
        }

        this.layers.forEach(layer => {
          if (layer.visible) expCtx.drawImage(layer.canvas, 0, 0);
        });

        const link = document.createElement('a');
        link.download = `artwork-${Date.now()}.png`;
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
      }

      saveProjectState() {
        const projectData = {
          width: this.width,
          height: this.height,
          canvasBgColor: this.canvasBgColor,
          isCanvasTransparent: this.isCanvasTransparent,
          layers: this.layers.map(l => ({
            name: l.name,
            visible: l.visible,
            locked: l.locked,
            dataURL: l.canvas.toDataURL()
          }))
        };

        const blob = new Blob([JSON.stringify(projectData)], { type: 'application/json' });
        const link = document.createElement('a');
        link.download = `project-${Date.now()}.studio`;
        link.href = URL.createObjectURL(blob);
        link.click();
      }

      printCanvas() {
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = this.width;
        exportCanvas.height = this.height;
        const expCtx = exportCanvas.getContext('2d');

        if (!this.isCanvasTransparent) {
          expCtx.fillStyle = this.canvasBgColor;
          expCtx.fillRect(0, 0, this.width, this.height);
        }

        this.layers.forEach(layer => {
          if (layer.visible) expCtx.drawImage(layer.canvas, 0, 0);
        });

        const windowContent = `<img src="${exportCanvas.toDataURL()}" style="max-width:100%;"/>`;
        const printWin = window.open('', '', 'width=800,height=600');
        printWin.document.open();
        printWin.document.write(`<html><body onload="window.print();window.close()">${windowContent}</body></html>`);
        printWin.document.close();
      }
    }

    // Initialize application when DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      window.app = new DrawingApp();
    });
  </script>
</body>
</html>
