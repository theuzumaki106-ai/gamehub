<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="100%" stop-color="#16223d"/>
    </linearGradient>
    <filter id="glow-cs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#bg-cs)"/>
  <!-- Digital Tablet Outline -->
  <rect x="40" y="25" width="320" height="150" rx="12" fill="#0b1326" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cs)"/>
  <!-- Canvas Artwork Waves -->
  <path d="M 60 120 Q 120 40 200 110 T 340 70" fill="none" stroke="#ff007f" stroke-width="6" stroke-linecap="round"/>
  <path d="M 60 140 Q 140 80 220 140 T 340 100" fill="none" stroke="#ffe600" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 100 Q 110 150 190 90 T 340 130" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Palette Dots -->
  <circle cx="90" cy="50" r="10" fill="#ff007f"/>
  <circle cx="120" cy="50" r="10" fill="#00f0ff"/>
  <circle cx="150" cy="50" r="10" fill="#39ff14"/>
  <circle cx="180" cy="50" r="10" fill="#ffe600"/>
  <!-- Layers Icon -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" transform="translate(295, 38)">
    <polygon points="15,0 30,8 15,16 0,8"/>
    <polygon points="15,8 30,16 15,24 0,16"/>
  </g>
  <text x="200" y="205" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#00f0ff" letter-spacing="4">CANVAS STUDIO PRO</text>
</svg>