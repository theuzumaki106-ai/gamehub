<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dots" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="100%" stop-color="#141a38"/>
    </linearGradient>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#bg-dots)"/>
  <!-- Captured Boxes -->
  <rect x="130" y="50" width="70" height="60" fill="rgba(0, 240, 255, 0.22)" stroke="#00f0ff" stroke-width="3" filter="url(#glow-p)"/>
  <text x="165" y="86" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="16" fill="#00f0ff">P1</text>
  <rect x="200" y="110" width="70" height="60" fill="rgba(255, 0, 127, 0.22)" stroke="#ff007f" stroke-width="3" filter="url(#glow-p)"/>
  <text x="235" y="146" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="16" fill="#ff007f">CPU</text>
  <!-- Connecting lines -->
  <line x1="60" y1="50" x2="130" y2="50" stroke="#00f0ff" stroke-width="3"/>
  <line x1="200" y1="50" x2="270" y2="50" stroke="#44426b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="270" y1="50" x2="340" y2="50" stroke="#44426b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="130" y1="110" x2="200" y2="110" stroke="#ff007f" stroke-width="3"/>
  <line x1="200" y1="110" x2="270" y2="110" stroke="#ff007f" stroke-width="3"/>
  <line x1="200" y1="50" x2="200" y2="110" stroke="#00f0ff" stroke-width="3"/>
  <line x1="270" y1="110" x2="270" y2="170" stroke="#ff007f" stroke-width="3"/>
  <line x1="200" y1="170" x2="270" y2="170" stroke="#ff007f" stroke-width="3"/>
  <!-- Matrix Dots -->
  <g fill="#39ff14" filter="url(#glow-p)">
    <circle cx="60" cy="50" r="5"/>  <circle cx="130" cy="50" r="6"/> <circle cx="200" cy="50" r="6"/> <circle cx="270" cy="50" r="5"/> <circle cx="340" cy="50" r="5"/>
    <circle cx="60" cy="110" r="5"/> <circle cx="130" cy="110" r="6"/> <circle cx="200" cy="110" r="6"/> <circle cx="270" cy="110" r="6"/> <circle cx="340" cy="110" r="5"/>
    <circle cx="60" cy="170" r="5"/> <circle cx="130" cy="170" r="5"/> <circle cx="200" cy="170" r="6"/> <circle cx="270" cy="170" r="6"/> <circle cx="340" cy="170" r="5"/>
  </g>
  <text x="200" y="205" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#39ff14" letter-spacing="4">DOTS &amp; BOXES CYBER</text>
</svg>