<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080a"/>
      <stop offset="100%" stop-color="#281118"/>
    </linearGradient>
    <filter id="glow-mt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#bg-mt)"/>
  <!-- Calculator Display -->
  <rect x="50" y="25" width="300" height="45" rx="8" fill="#000000" stroke="#ffe600" stroke-width="2"/>
  <text x="330" y="58" text-anchor="end" font-family="'VT323', monospace" font-size="34" fill="#ffe600" letter-spacing="3" filter="url(#glow-mt)">3.14159265</text>
  <!-- Multi-tool 3 Badges: Calc, Clock, Calendar -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="80" height="70" rx="8" fill="#1b1220" stroke="#00f0ff" stroke-width="2"/>
    <text x="40" y="32" text-anchor="middle" font-size="20">🧮</text>
    <text x="40" y="56" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="9" fill="#00f0ff">CALC</text>
  </g>
  <g transform="translate(160, 85)">
    <rect x="0" y="0" width="80" height="70" rx="8" fill="#1b1220" stroke="#ff007f" stroke-width="2"/>
    <text x="40" y="32" text-anchor="middle" font-size="20">⏱️</text>
    <text x="40" y="56" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="9" fill="#ff007f">CLOCK</text>
  </g>
  <g transform="translate(260, 85)">
    <rect x="0" y="0" width="80" height="70" rx="8" fill="#1b1220" stroke="#39ff14" stroke-width="2"/>
    <text x="40" y="32" text-anchor="middle" font-size="20">📅</text>
    <text x="40" y="56" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="9" fill="#39ff14">CALENDAR</text>
  </g>
  <text x="200" y="205" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#ffe600" letter-spacing="4">RETRO MULTI-TOOL SUITE</text>
</svg>