<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ttt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0820"/>
      <stop offset="100%" stop-color="#181340"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#bg-ttt)"/>
  <!-- Perspective Grid lines -->
  <g opacity="0.25" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="195" x2="400" y2="195"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="50" y1="180" x2="20" y2="220"/>
    <line x1="150" y1="180" x2="130" y2="220"/>
    <line x1="250" y1="180" x2="270" y2="220"/>
    <line x1="350" y1="180" x2="380" y2="220"/>
  </g>
  <!-- 3x3 Grid -->
  <g stroke="#3d3875" stroke-width="5" stroke-linecap="round">
    <line x1="160" y1="35" x2="160" y2="175"/>
    <line x1="240" y1="35" x2="240" y2="175"/>
    <line x1="90" y1="80" x2="310" y2="80"/>
    <line x1="90" y1="130" x2="310" y2="130"/>
  </g>
  <!-- Glowing X's (Neon Pink) -->
  <g stroke="#ff007f" stroke-width="7" stroke-linecap="round" filter="url(#glow-pink)">
    <line x1="110" y1="45" x2="140" y2="70"/>
    <line x1="140" y1="45" x2="110" y2="70"/>
    <line x1="185" y1="95" x2="215" y2="120"/>
    <line x1="215" y1="95" x2="185" y2="120"/>
    <line x1="260" y1="140" x2="290" y2="165"/>
    <line x1="290" y1="140" x2="260" y2="165"/>
  </g>
  <!-- Winning Laser Line -->
  <line x1="95" y1="35" x2="305" y2="175" stroke="#ffe600" stroke-width="4" stroke-dasharray="8,4" filter="url(#glow-cyan)"/>
  <!-- Glowing O's (Neon Cyan) -->
  <g stroke="#00f0ff" stroke-width="6" fill="none" filter="url(#glow-cyan)">
    <circle cx="200" cy="57" r="15"/>
    <circle cx="125" cy="107" r="15"/>
    <circle cx="275" cy="107" r="15"/>
  </g>
  <text x="200" y="205" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#ffe600" letter-spacing="4">TIC-TAC-TOE NEON</text>
</svg>