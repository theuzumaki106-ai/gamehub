<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Candy Blast Saga</title>
<style>
:root{
  --red1:#ff9a9e;--red2:#f4436c;--red3:#a3122f;
  --orange1:#ffd59e;--orange2:#ff9a2e;--orange3:#b85e00;
  --yellow1:#fff6b0;--yellow2:#ffd60a;--yellow3:#b8860a;
  --green1:#c8f7c5;--green2:#4ad66d;--green3:#1e7a34;
  --blue1:#b3e5ff;--blue2:#2196f3;--blue3:#0d4f8b;
  --purple1:#e6c3ff;--purple2:#b34af0;--purple3:#5e1a8c;
  --ink:#4a2c5e;
  --panel:#fff8f2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;margin:0;}
body{
  font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.5), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(255,255,255,.4), transparent 35%),
    radial-gradient(circle at 50% 90%, rgba(255,255,255,.35), transparent 40%),
    linear-gradient(160deg,#ffd3e8 0%, #d6b6ff 45%, #a6d8ff 100%);
  min-height:100%;
  overflow-x:hidden;
  color:var(--ink);
}
.hidden{display:none !important;}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:20px;}

/* ---------- TOP BAR (shared) ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px;}
.pill{
  background:var(--panel);
  border-radius:999px;
  padding:6px 12px 6px 6px;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 3px 0 rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.8);
  font-weight:800;font-size:14px;
}
.pill .icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:17px;
  background:radial-gradient(circle at 35% 30%,#fff,#ffd54f 60%,#e8a300);border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.25);}
.pill.lives .icon{background:radial-gradient(circle at 35% 30%,#fff,#ff7a90 60%,#c8264a);}
.pill.coins .icon{background:radial-gradient(circle at 35% 30%,#fffce0,#ffd54f 55%,#c98a00);}
.title-badge{
  font-size:22px;font-weight:900;color:#fff;
  text-shadow:0 2px 0 #b34af0, 0 4px 6px rgba(0,0,0,.25);
  letter-spacing:.5px;
}
.small-timer{font-size:10px;font-weight:700;opacity:.7;margin-left:2px;}

/* ---------- MAP SCREEN ---------- */
#screen-map{padding:6px 18px 40px;}
.map-path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:20px 0 10px;position:relative;}
.map-path::before{
  content:'';position:absolute;left:50%;top:20px;bottom:20px;width:6px;
  background:repeating-linear-gradient(180deg,#fff 0 10px, transparent 10px 20px);
  opacity:.55;transform:translateX(-50%);border-radius:6px;z-index:0;
}
.level-node{
  position:relative;z-index:1;
  width:78px;height:78px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:26px;font-weight:900;color:#fff;
  background:radial-gradient(circle at 35% 28%, #ffd6ea, #ff6fa5 55%, #c22a6d);
  box-shadow:0 6px 0 #9c1e57, inset 0 2px 4px rgba(255,255,255,.6);
  border:4px solid #fff;
  cursor:pointer;transition:transform .15s;
}
.level-node.n1{align-self:flex-start;margin-left:14%;}
.level-node.n2{align-self:flex-end;margin-right:14%;}
.level-node:active{transform:scale(.92);}
.level-node.locked{
  background:radial-gradient(circle at 35% 28%, #e4e4e4, #b9b9c2 55%, #83838f);
  box-shadow:0 6px 0 #5f5f68, inset 0 2px 4px rgba(255,255,255,.4);
  cursor:default;
}
.level-node.current{animation:bob 1.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-node .stars{position:absolute;top:-14px;display:flex;gap:2px;}
.level-node .stars span{font-size:14px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
.level-node .lock-icon{font-size:26px;}
.level-node .lvname{position:absolute;bottom:-22px;font-size:11px;font-weight:800;color:#5e3a75;white-space:nowrap;background:#fff9;padding:1px 8px;border-radius:8px;}
.map-header{text-align:center;margin:6px 0 10px;}
.map-header h1{margin:0;font-size:28px;color:#fff;text-shadow:0 3px 0 #b34af0,0 6px 10px rgba(0,0,0,.25);}
.map-header p{margin:2px 0 0;font-size:12px;font-weight:700;color:#5e3a75;opacity:.8;}

/* ---------- GAME SCREEN ---------- */
#screen-game{padding:6px 10px 20px;}
.game-header{
  background:var(--panel);border-radius:18px;padding:10px 12px;
  box-shadow:0 4px 0 rgba(0,0,0,.12), inset 0 1px 0 #fff;
  display:flex;flex-direction:column;gap:8px;margin-bottom:10px;
}
.gh-row1{display:flex;align-items:center;justify-content:space-between;}
.back-btn{background:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;font-weight:900;box-shadow:0 3px 0 #d8d0e8;cursor:pointer;}
.level-title{font-weight:900;font-size:16px;}
.moves-badge{
  background:radial-gradient(circle at 35% 30%,#fff,#ffd54f 60%,#e8a300);
  border-radius:14px;padding:4px 14px;font-weight:900;font-size:20px;box-shadow:0 3px 0 #b8860a;
  min-width:46px;text-align:center;
}
.moves-badge.low{background:radial-gradient(circle at 35% 30%,#fff,#ff8a8a 60%,#c8264a);animation:shake .4s infinite;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.gh-row2{display:flex;align-items:center;gap:10px;}
.score-wrap{flex:1;}
.score-num{font-weight:900;font-size:18px;}
.score-bar{height:10px;border-radius:6px;background:#e9e0f5;overflow:hidden;margin-top:3px;position:relative;}
.score-bar-fill{height:100%;background:linear-gradient(90deg,#ffd54f,#ff8a2e);border-radius:6px;transition:width .3s;}
.objectives{display:flex;gap:8px;flex-wrap:wrap;}
.obj-chip{
  display:flex;align-items:center;gap:4px;background:#f0e8ff;border-radius:12px;padding:4px 8px;font-size:12px;font-weight:800;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
}
.obj-chip .oi{font-size:15px;}
.obj-chip.done{background:#dcf9e0;color:#1e7a34;text-decoration:line-through;opacity:.7;}

.board-frame{
  background:linear-gradient(160deg,#7a4fa3,#5a3080);
  border-radius:22px;padding:10px;
  box-shadow:0 10px 0 rgba(0,0,0,.15), inset 0 2px 6px rgba(255,255,255,.25);
  position:relative;
}
#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  gap:3px;
  aspect-ratio:1/1;
  background:rgba(0,0,0,.15);
  border-radius:14px;
  padding:4px;
  position:relative;
}
.cell-slot{
  position:relative;border-radius:9px;
  background:rgba(255,255,255,.10);
  overflow:visible;
}
.cell-slot:nth-child(odd){background:rgba(255,255,255,.16);}
.jelly-layer{position:absolute;inset:3px;border-radius:8px;background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);transition:opacity .2s;}
.jelly-layer.j2{background:rgba(120,200,255,.45);box-shadow:inset 0 0 0 4px rgba(255,255,255,.7);}
.choco-block{
  position:absolute;inset:2px;border-radius:8px;
  background:radial-gradient(circle at 35% 30%,#8a5a3a,#5c3a22 60%,#2e1c10);
  box-shadow:inset -3px -4px 5px rgba(0,0,0,.4), inset 2px 3px 4px rgba(255,255,255,.2), 0 2px 3px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.candy{
  position:absolute;inset:8%;border-radius:0;cursor:grab;
  display:flex;align-items:center;justify-content:center;
  will-change:transform;touch-action:none;
}
.candy-body{width:100%;height:100%;position:relative;background:radial-gradient(circle at 35% 28%, var(--c1), var(--c2) 55%, var(--c3) 100%);
  box-shadow:inset -3px -5px 6px rgba(0,0,0,.28), inset 2px 3px 5px rgba(255,255,255,.65), 0 3px 4px rgba(0,0,0,.3);}
.candy-body::after{content:'';position:absolute;top:14%;left:20%;width:34%;height:22%;background:rgba(255,255,255,.75);border-radius:50%;filter:blur(1px);transform:rotate(-20deg);}
.c0{--c1:var(--red1);--c2:var(--red2);--c3:var(--red3);}
.c1{--c1:var(--orange1);--c2:var(--orange2);--c3:var(--orange3);}
.c2{--c1:var(--yellow1);--c2:var(--yellow2);--c3:var(--yellow3);}
.c3{--c1:var(--green1);--c2:var(--green2);--c3:var(--green3);}
.c4{--c1:var(--blue1);--c2:var(--blue2);--c3:var(--blue3);}
.c5{--c1:var(--purple1);--c2:var(--purple2);--c3:var(--purple3);}
.s0 .candy-body{border-radius:50%;}
.s1 .candy-body{border-radius:26%;}
.s2 .candy-body{clip-path:polygon(50% 0%,63% 35%,100% 35%,72% 57%,82% 92%,50% 71%,18% 92%,28% 57%,0% 35%,37% 35%);}
.s3 .candy-body{clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0% 50%);}
.s4 .candy-body{border-radius:50% 50% 50% 4%;}
.s5 .candy-body{clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%);}
.cage{position:absolute;inset:-4%;border-radius:18%;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(90,60,30,.85) 0 4px, transparent 4px 10px),repeating-linear-gradient(-45deg,rgba(90,60,30,.85) 0 4px, transparent 4px 10px);
  box-shadow:inset 0 0 0 3px rgba(90,60,30,.9);}
.cage.cage-1{opacity:.5;}
.ingredient .candy-body{background:radial-gradient(circle at 35% 25%,#ff8fa3,#e21d4d 55%,#7a0d28);border-radius:50%;}
.ingredient .candy-body::before{content:'🍒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60%;}
.special-row .candy-body,.special-col .candy-body{box-shadow:0 0 10px 3px #fff, inset -3px -5px 6px rgba(0,0,0,.28), inset 2px 3px 5px rgba(255,255,255,.8);animation:pulseGlow 1s infinite;}
.special-row .candy-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 4px, transparent 4px 9px);border-radius:inherit;}
.special-col .candy-body::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.85) 0 4px, transparent 4px 9px);border-radius:inherit;}
.special-wrap .candy-body{box-shadow:0 0 12px 4px #ffd54f, inset -3px -5px 6px rgba(0,0,0,.28);animation:pulseGlow 1s infinite;}
.special-wrap .candy-body::before{content:'';position:absolute;inset:6%;border:3px solid rgba(255,255,255,.85);border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 3px, transparent 3px 8px);}
@keyframes pulseGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.special-bomb .candy-body{border-radius:50%;background:conic-gradient(from 0deg,#ff5e5e,#ffd54f,#4ad66d,#2196f3,#b34af0,#ff5e5e);animation:spin 2.2s linear infinite, pulseGlow .8s infinite;box-shadow:0 0 16px 5px rgba(255,255,255,.8);}
@keyframes spin{to{transform:rotate(360deg)}}
.candy.popping{animation:popOut .2s forwards;}
@keyframes popOut{to{transform:scale(0);opacity:0;}}
.candy.spawnin{animation:spawnIn .28s ease-out;}
@keyframes spawnIn{from{transform:translateY(-40px) scale(.4);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.candy.selected .candy-body{box-shadow:0 0 0 4px #fff, 0 0 14px 4px #ffd54f;transform:scale(1.08);}

.combo-banner{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);
  font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 #e6007a,0 6px 12px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;z-index:20;white-space:nowrap;
}
.combo-banner.show{animation:comboPop .8s ease-out forwards;}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg);}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}100%{opacity:0;transform:translate(-50%,-70%) scale(1) rotate(0);}}
.score-pop{position:absolute;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);pointer-events:none;z-index:19;animation:scoreFloat .7s ease-out forwards;}
@keyframes scoreFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-36px);}}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:18;}

.boosters{display:flex;gap:8px;margin-top:10px;justify-content:center;}
.booster-btn{
  flex:1;max-width:150px;background:var(--panel);border:none;border-radius:14px;padding:8px 6px;
  box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:800;font-size:11px;color:var(--ink);
}
.booster-btn .bi{font-size:20px;}
.booster-btn .cost{background:#ffd54f;border-radius:8px;padding:1px 6px;font-size:10px;}
.booster-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.booster-btn.armed{outline:3px solid #ff8a2e;}

/* ---------- MODALS ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(30,10,50,.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-card{
  background:linear-gradient(160deg,#fff8f2,#ffe9f5);border-radius:24px;padding:26px 22px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 14px 0 rgba(0,0,0,.2);position:relative;
}
.modal-card h2{margin:4px 0 6px;font-size:26px;color:#b34af0;text-shadow:0 2px 0 #fff;}
.modal-stars{display:flex;justify-content:center;gap:8px;margin:14px 0;}
.modal-stars span{font-size:38px;filter:grayscale(1) opacity(.35);transform:scale(0);}
.modal-stars span.won{filter:none;opacity:1;animation:starPop .5s forwards;}
@keyframes starPop{from{transform:scale(0) rotate(-40deg);}60%{transform:scale(1.3) rotate(10deg);}to{transform:scale(1) rotate(0);}}
.modal-btn{
  display:block;width:100%;margin-top:10px;padding:12px;border:none;border-radius:16px;font-weight:900;font-size:15px;cursor:pointer;
  background:linear-gradient(180deg,#ffe15c,#ff9a2e);box-shadow:0 5px 0 #b85e00;color:#5e2c00;
}
.modal-btn.secondary{background:linear-gradient(180deg,#fff,#e6d9ff);box-shadow:0 5px 0 #b8a8d8;color:var(--ink);}
.modal-btn:active{transform:translateY(3px);box-shadow:none;}
.modal-sub{font-size:13px;font-weight:700;opacity:.75;margin:6px 0;}

.confetti{position:fixed;top:-10px;width:10px;height:16px;z-index:200;pointer-events:none;border-radius:2px;}

footer.credits{text-align:center;font-size:11px;opacity:.55;font-weight:700;margin-top:8px;}
</style>
</head>
<body>
<div id="app">

  <!-- MAP SCREEN -->
  <div id="screen-map">
    <div class="topbar">
      <div class="pill lives" id="livesPill"><span class="icon">❤️</span><span id="livesText">5</span><span class="small-timer" id="livesTimer"></span></div>
      <div class="pill coins"><span class="icon">🪙</span><span id="coinsText">100</span></div>
    </div>
    <div class="map-header">
      <h1>🍬 Candy Blast Saga</h1>
      <p>Tap a level to play!</p>
    </div>
    <div class="map-path" id="mapPath"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="hidden">
    <div class="game-header">
      <div class="gh-row1">
        <button class="back-btn" id="backBtn">←</button>
        <div class="level-title" id="levelTitle">Level 1</div>
        <div class="moves-badge" id="movesBadge">20</div>
      </div>
      <div class="gh-row2">
        <div class="score-wrap">
          <div class="score-num"><span id="scoreNum">0</span> pts</div>
          <div class="score-bar"><div class="score-bar-fill" id="scoreBarFill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="objectives" id="objectivesRow"></div>
    </div>

    <div class="board-frame">
      <div id="board"></div>
      <div class="combo-banner" id="comboBanner"></div>
    </div>

    <div class="boosters">
      <button class="booster-btn" id="boosterMoves"><span class="bi">➕</span>+5 Moves<span class="cost">🪙50</span></button>
      <button class="booster-btn" id="boosterBomb"><span class="bi">💣</span>Color Bomb<span class="cost">🪙80</span></button>
      <button class="booster-btn" id="boosterHammer"><span class="bi">🔨</span>Hammer<span class="cost">🪙60</span></button>
    </div>
    <footer class="credits">Swipe or tap two candies to swap</footer>
  </div>

</div>

<!-- MODALS -->
<div id="modalWin" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>Level Complete!</h2>
    <div class="modal-stars" id="winStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="modal-sub" id="winScoreText">Score: 0</div>
    <div class="modal-sub" id="winCoinsText">+30 🪙</div>
    <button class="modal-btn" id="winContinueBtn">Continue</button>
  </div>
</div>

<div id="modalLose" class="modal-overlay hidden">
  <div class="modal-card">
    <h2 style="color:#e6437a">Out of Moves!</h2>
    <div style="font-size:44px;margin:10px 0;">😢</div>
    <div class="modal-sub">So close! Try again?</div>
    <button class="modal-btn" id="loseRetryBtn">Retry (❤️1)</button>
    <button class="modal-btn secondary" id="loseMapBtn">Back to Map</button>
  </div>
</div>

<div id="modalNoLives" class="modal-overlay hidden">
  <div class="modal-card">
    <h2 style="color:#e6437a">Out of Lives!</h2>
    <div style="font-size:44px;margin:10px 0;">⏳</div>
    <div class="modal-sub">Next life in <span id="noLivesTimer">--:--</span></div>
    <button class="modal-btn" id="watchAdBtn">🎬 Watch Ad for Free Life</button>
    <button class="modal-btn secondary" id="noLivesCloseBtn">Close</button>
  </div>
</div>

<script>
(function(){
'use strict';
const ROWS=8, COLS=8;
const REGEN_MS=45000; // demo-accelerated life regen (real game ~30 min)
const MAX_LIVES=5;
const MAX_CHOCO=11;
const SHAPE_NAMES=['circle','square','star','hex','drop','diamond'];

/* ================= LEVEL DEFINITIONS ================= */
const LEVELS=[
 {name:"Sweet Start", moves:20, colorCount:5, starTarget:3500,
  map:["........","........","........","........","........","........","........","........"],
  objectives:[{type:'score',target:3500}]},
 {name:"Jelly Fields", moves:20, colorCount:5, starTarget:2000,
  map:["jjjjjjjj","........","........","........","........","........","........","jjjjjjjj"],
  objectives:[{type:'jelly'}]},
 {name:"Cherry Falls", moves:20, colorCount:5, starTarget:1800,
  map:["..i..i..","........","........","........","........","........","........","........"],
  objectives:[{type:'ingredient',target:2}]},
 {name:"Choco Trouble", moves:22, colorCount:5, starTarget:2200,
  map:["........","...cc...","........","..c..c..","........","...cc...","........","........"],
  objectives:[{type:'blocker',target:10}]},
 {name:"Lock & Roll", moves:22, colorCount:5, starTarget:4500,
  map:["........","..l..l..","........","l......l","........","..l..l..","........","........"],
  objectives:[{type:'score',target:4500},{type:'lock'}]},
 {name:"Double Jelly", moves:24, colorCount:6, starTarget:5000,
  map:["........","..JJJJ..","..J..J..","..J..J..","..J..J..","..JJJJ..","........","........"],
  objectives:[{type:'jelly'},{type:'score',target:5000}]},
 {name:"Cherry & Choco", moves:23, colorCount:6, starTarget:3200,
  map:["..i..i..","........","..c..c..","........","........","..c..c..","........","........"],
  objectives:[{type:'ingredient',target:2},{type:'blocker',target:8}]},
 {name:"Grand Candy Boss", moves:26, colorCount:6, starTarget:6000,
  map:["jjjjjjjj","j.l..l.j","j......j","j.c..c.j","j......j","j.l..l.j","j......j","jjjjjjjj"],
  objectives:[{type:'jelly'},{type:'lock'},{type:'blocker',target:6},{type:'score',target:6000}]},
];

/* ================= GLOBAL STATE ================= */
let state={
  coins:100,
  lives:MAX_LIVES,
  nextLifeAt:null,
  levelStars:new Array(LEVELS.length).fill(0),
  unlockedCount:1,
};

let occGrid=[], jellyGrid=[];
let game=null; // runtime for current level
let busy=false;
let selected=null;
let pointerStart=null;

/* ================= AUDIO ================= */
let actx=null;
function ensureAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
document.addEventListener('pointerdown',()=>ensureAudio(),{once:true});
function playSound(type){
  if(!actx) return;
  try{
    const now=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const map={pop:[620,0.08],swap:[320,0.06],invalid:[150,0.14],win:[880,0.35],lose:[200,0.4],special:[950,0.18],combo:[700,0.15]};
    const [freq,dur]=map[type]||[400,0.1];
    o.type= type==='invalid'?'sawtooth':'sine';
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.16,now);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.start(now); o.stop(now+dur);
  }catch(e){}
}

/* ================= UTIL ================= */
function delay(ms){return new Promise(res=>setTimeout(res,ms));}
function isAdjacent(r1,c1,r2,c2){ return (Math.abs(r1-r2)+Math.abs(c1-c2))===1; }
function key(r,c){return r+','+c;}
function unkey(k){const p=k.split(',');return [parseInt(p[0]),parseInt(p[1])];}
function colorAt(r,c){
  if(r<0||c<0||r>=ROWS||c>=COLS) return null;
  const cell=occGrid[r][c];
  if(cell.kind!=='candy'||cell.ingredient) return null;
  return cell.color;
}
function cellSlot(r,c){ return document.querySelector('.cell-slot[data-r="'+r+'"][data-c="'+c+'"]'); }

/* ================= LEVEL BUILD ================= */
function buildLevelRuntime(idx){
  const lv=LEVELS[idx];
  occGrid=[]; jellyGrid=[];
  let jellyCells=0, lockCells=0;
  for(let r=0;r<ROWS;r++){
    occGrid.push([]); jellyGrid.push([]);
    for(let c=0;c<COLS;c++){
      const ch=lv.map[r][c];
      let cell={kind:'candy',color:null,special:null,cage:0,ingredient:false,el:null};
      let jelly=0;
      if(ch==='c'){ cell={kind:'chocolate',el:null}; }
      else{
        if(ch==='j'){ jelly=1; jellyCells++; }
        if(ch==='J'){ jelly=2; jellyCells++; }
        if(ch==='l'){ cell.cage=2; lockCells++; }
        if(ch==='i'){ cell.ingredient=true; }
      }
      occGrid[r].push(cell);
      jellyGrid[r].push(jelly);
    }
  }
  assignRandomColors(lv.colorCount);
  ensureSolvable(lv.colorCount);
  const objectives={};
  lv.objectives.forEach(o=>{
    if(o.type==='score') objectives.score={target:o.target};
    if(o.type==='jelly') objectives.jelly={target:jellyCells,remaining:jellyCells};
    if(o.type==='ingredient') objectives.ingredient={target:o.target,current:0};
    if(o.type==='blocker') objectives.blocker={target:o.target,current:0};
    if(o.type==='lock') objectives.lock={target:lockCells,remaining:lockCells};
  });
  return {idx, name:lv.name, movesLeft:lv.moves, score:0, objectives, colorCount:lv.colorCount, starTarget:lv.starTarget};
}
function assignRandomColors(colorCount){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=occGrid[r][c];
    if(cell.kind!=='candy') continue;
    let tries=0,color;
    do{ color=Math.floor(Math.random()*colorCount); tries++; }
    while(tries<25 && wouldMatch(r,c,color));
    cell.color=color;
  }
}
function wouldMatch(r,c,color){
  if(c>=2 && occGrid[r][c-1].kind==='candy' && !occGrid[r][c-1].ingredient && occGrid[r][c-1].color===color &&
     occGrid[r][c-2].kind==='candy' && !occGrid[r][c-2].ingredient && occGrid[r][c-2].color===color) return true;
  if(r>=2 && occGrid[r-1][c].kind==='candy' && !occGrid[r-1][c].ingredient && occGrid[r-1][c].color===color &&
     occGrid[r-2][c].kind==='candy' && !occGrid[r-2][c].ingredient && occGrid[r-2][c].color===color) return true;
  return false;
}
function isSwappableColorCell(r,c){ const cell=occGrid[r][c]; return cell.kind==='candy' && !cell.ingredient; }
function cellCreatesMatch(r,c){
  const color=colorAt(r,c); if(color==null) return false;
  let run=1,cc=c-1; while(cc>=0&&colorAt(r,cc)===color){run++;cc--;}
  cc=c+1; while(cc<COLS&&colorAt(r,cc)===color){run++;cc++;}
  if(run>=3) return true;
  run=1; let rr=r-1; while(rr>=0&&colorAt(rr,c)===color){run++;rr--;}
  rr=r+1; while(rr<ROWS&&colorAt(rr,c)===color){run++;rr++;}
  return run>=3;
}
function hasPossibleMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!isSwappableColorCell(r,c)) continue;
    const dirs=[[0,1],[1,0]];
    for(const [dr,dc] of dirs){
      const r2=r+dr,c2=c+dc;
      if(r2>=ROWS||c2>=COLS) continue;
      if(!isSwappableColorCell(r2,c2)) continue;
      const a=occGrid[r][c].color,b=occGrid[r2][c2].color;
      occGrid[r][c].color=b; occGrid[r2][c2].color=a;
      const m=cellCreatesMatch(r,c)||cellCreatesMatch(r2,c2);
      occGrid[r][c].color=a; occGrid[r2][c2].color=b;
      if(m) return true;
    }
  }
  return false;
}
function ensureSolvable(colorCount){
  let tries=0;
  while(!hasPossibleMove() && tries<800){
    const r1=Math.floor(Math.random()*ROWS), c1=Math.floor(Math.random()*COLS);
    const r2=Math.floor(Math.random()*ROWS), c2=Math.floor(Math.random()*COLS);
    if(isSwappableColorCell(r1,c1)&&isSwappableColorCell(r2,c2)){
      const t=occGrid[r1][c1].color; occGrid[r1][c1].color=occGrid[r2][c2].color; occGrid[r2][c2].color=t;
    }
    tries++;
  }
}
function reshuffleBoard(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(occGrid[r][c].kind==='candy' && !occGrid[r][c].ingredient){
      occGrid[r][c].color=Math.floor(Math.random()*game.colorCount);
    }
  }
  let g=0;
  while((findRuns().length>0 || !hasPossibleMove()) && g<300){
    assignRandomColors(game.colorCount);
    g++;
  }
  ensureSolvable(game.colorCount);
  const board=document.getElementById('board');
  board.querySelectorAll('.candy').forEach(el=>el.remove());
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(occGrid[r][c].kind==='candy'){ occGrid[r][c].el=null; createCandyEl(r,c,true); }
  }
}

/* ================= MATCH DETECTION ================= */
function findRuns(){
  const runs=[];
  for(let r=0;r<ROWS;r++){
    let c=0;
    while(c<COLS){
      const color=colorAt(r,c);
      if(color==null){c++;continue;}
      let end=c; while(end+1<COLS && colorAt(r,end+1)===color) end++;
      if(end-c+1>=3) runs.push({orientation:'h',row:r,colStart:c,colEnd:end,color});
      c=end+1;
    }
  }
  for(let c=0;c<COLS;c++){
    let r=0;
    while(r<ROWS){
      const color=colorAt(r,c);
      if(color==null){r++;continue;}
      let end=r; while(end+1<ROWS && colorAt(end+1,c)===color) end++;
      if(end-r+1>=3) runs.push({orientation:'v',col:c,rowStart:r,rowEnd:end,color});
      r=end+1;
    }
  }
  return runs;
}
function collectRunCells(run){
  const cells=[];
  if(run.orientation==='h'){ for(let c=run.colStart;c<=run.colEnd;c++) cells.push([run.row,c]); }
  else{ for(let r=run.rowStart;r<=run.rowEnd;r++) cells.push([r,run.col]); }
  return cells;
}
function processRuns(runs, swapHint){
  const used=new Set();
  const spawns=[];
  const allRunCells=new Set();
  const cellsCache=runs.map(collectRunCells);
  runs.forEach((run,i)=>cellsCache[i].forEach(([r,c])=>allRunCells.add(key(r,c))));

  for(let i=0;i<runs.length;i++){
    if(used.has(i) || runs[i].orientation!=='h') continue;
    for(let j=0;j<runs.length;j++){
      if(used.has(j) || runs[j].orientation!=='v') continue;
      const A=runs[i], B=runs[j];
      if(B.col>=A.colStart && B.col<=A.colEnd && A.row>=B.rowStart && A.row<=B.rowEnd){
        used.add(i); used.add(j);
        const spot=[A.row,B.col];
        const chosen = swapHint && spot[0]===swapHint[0] && spot[1]===swapHint[1] ? spot : spot;
        spawns.push({r:chosen[0],c:chosen[1],special:'wrap'});
        break;
      }
    }
  }
  runs.forEach((run,idx)=>{
    if(used.has(idx)) return;
    const cells=cellsCache[idx];
    const len=cells.length;
    if(len>=5){
      let spot=cells.find(([r,c])=>swapHint&&r===swapHint[0]&&c===swapHint[1]) || cells[Math.floor(len/2)];
      spawns.push({r:spot[0],c:spot[1],special:'bomb'});
    } else if(len===4){
      let spot=cells.find(([r,c])=>swapHint&&r===swapHint[0]&&c===swapHint[1]) || cells[Math.floor(len/2)];
      spawns.push({r:spot[0],c:spot[1],special: run.orientation==='h'?'row':'col'});
    }
  });
  const spawnKeys=new Set(spawns.map(s=>key(s.r,s.c)));
  const clears=new Set(Array.from(allRunCells).filter(k=>!spawnKeys.has(k)));
  return {clears,spawns};
}
function getSpecialEffectCells(r,c,special){
  const s=new Set();
  if(special==='row'){ for(let cc=0;cc<COLS;cc++) s.add(key(r,cc)); }
  else if(special==='col'){ for(let rr=0;rr<ROWS;rr++) s.add(key(rr,c)); }
  else if(special==='wrap'){ for(let rr=r-1;rr<=r+1;rr++)for(let cc=c-1;cc<=c+1;cc++) if(rr>=0&&cc>=0&&rr<ROWS&&cc<COLS) s.add(key(rr,cc)); }
  else if(special==='bomb'){ const col=mostCommonColor(); for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++) if(colorAt(rr,cc)===col) s.add(key(rr,cc)); }
  return s;
}
function mostCommonColor(){
  const counts={};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const col=colorAt(r,c); if(col!=null) counts[col]=(counts[col]||0)+1; }
  let best=0,bestCount=-1;
  for(const k in counts) if(counts[k]>bestCount){bestCount=counts[k];best=+k;}
  return best;
}
function computeSwapComboClears(r1,c1,r2,c2){
  const a=occGrid[r1][c1], b=occGrid[r2][c2];
  const isSpecial=cell=>cell.kind==='candy'&&cell.special;
  if(!isSpecial(a) && !isSpecial(b)) return null;
  const cells=new Set();
  if(a.special==='bomb' && b.special==='bomb'){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) cells.add(key(r,c));
  } else if(a.special==='bomb' || b.special==='bomb'){
    const bombPos = a.special==='bomb'?[r1,c1]:[r2,c2];
    const otherPos = a.special==='bomb'?[r2,c2]:[r1,c1];
    const other = occGrid[otherPos[0]][otherPos[1]];
    let targetColor = other.color;
    if(targetColor==null || other.special) targetColor=mostCommonColor();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(colorAt(r,c)===targetColor) cells.add(key(r,c));
    cells.add(key(bombPos[0],bombPos[1]));
    if(other.special) getSpecialEffectCells(otherPos[0],otherPos[1],other.special).forEach(k=>cells.add(k));
  } else {
    getSpecialEffectCells(r1,c1,a.special).forEach(k=>cells.add(k));
    getSpecialEffectCells(r2,c2,b.special).forEach(k=>cells.add(k));
  }
  return cells;
}
async function resolveBoard(initialClearKeys){
  const activated=new Set();
  let queue=Array.from(initialClearKeys);
  const allCleared=new Set(initialClearKeys);
  while(queue.length){
    const k=queue.pop();
    const [r,c]=unkey(k);
    const cell=occGrid[r][c];
    if(cell.kind==='candy' && cell.special && !activated.has(k)){
      activated.add(k);
      playSound('special');
      const extra=getSpecialEffectCells(r,c,cell.special);
      extra.forEach(ek=>{ if(!allCleared.has(ek)){ allCleared.add(ek); queue.push(ek); } });
    }
  }
  return allCleared;
}

/* ================= CLEAR / SCORE / OBJECTIVES ================= */
function pickHint(r1,c1,r2,c2,runs){
  const inRun=(r,c)=>runs.some(run=>collectRunCells(run).some(([rr,cc])=>rr===r&&cc===c));
  if(inRun(r1,c1)) return [r1,c1];
  if(inRun(r2,c2)) return [r2,c2];
  return null;
}
function applySpawns(spawns){
  spawns.forEach(s=>{
    const cell=occGrid[s.r][s.c];
    if(cell.kind!=='candy') return;
    cell.special=s.special;
    updateCandyVisual(s.r,s.c);
    if(cell.el) cell.el.classList.add('spawnin');
  });
}
async function performClearApplyEffects(clearSet, comboLevel){
  if(clearSet.size===0) return;
  const board=document.getElementById('board');
  const boardRect=board.getBoundingClientRect();
  // chocolate destruction: any chocolate orthogonally adjacent to a cleared cell
  const chocoToDestroy=new Set();
  clearSet.forEach(k=>{
    const [r,c]=unkey(k);
    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{
      if(rr>=0&&cc>=0&&rr<ROWS&&cc<COLS && occGrid[rr][cc].kind==='chocolate') chocoToDestroy.add(key(rr,cc));
    });
  });
  let gained=0;
  const toPop=[];
  clearSet.forEach(k=>{
    const [r,c]=unkey(k);
    const cell=occGrid[r][c];
    if(cell.kind!=='candy') return;
    if(cell.cage>0){
      cell.cage--; updateCandyVisual(r,c);
      if(cell.cage===0 && game.objectives.lock) game.objectives.lock.remaining--;
      return;
    }
    if(cell.ingredient) return; // ingredients immune to explosions, only fall
    if(jellyGrid[r][c]>0){
      jellyGrid[r][c]--;
      if(game.objectives.jelly) game.objectives.jelly.remaining--;
      const jl=cellSlot(r,c).querySelector('.jelly-layer');
      if(jl){ if(jellyGrid[r][c]<=0) jl.remove(); else jl.classList.remove('j2'); }
    }
    gained+=60*comboLevel;
    if(cell.el){ toPop.push(cell.el); spawnParticles(cell.el, boardRect); showScorePop(cell.el, boardRect, 60*comboLevel); }
    occGrid[r][c]={kind:'empty'};
  });
  chocoToDestroy.forEach(k=>{
    const [r,c]=unkey(k);
    occGrid[r][c]={kind:'empty'};
    if(game.objectives.blocker) game.objectives.blocker.current++;
    const cs=cellSlot(r,c); const cb=cs.querySelector('.choco-block'); if(cb) cb.remove();
    gained+=40;
  });
  game.score+=gained;
  updateHeaderScore();
  playSound('pop');
  toPop.forEach(el=>el.classList.add('popping'));
  await delay(190);
  toPop.forEach(el=>el.remove());
}
function spawnParticles(fromEl, boardRect){
  const r=fromEl.getBoundingClientRect();
  const cx=r.left-boardRect.left+r.width/2, cy=r.top-boardRect.top+r.height/2;
  const colorClass = fromEl.querySelector('.candy-body');
  let bg='#fff';
  if(colorClass){ bg=getComputedStyle(colorClass).getPropertyValue('background-color') || '#ffd54f'; }
  const board=document.getElementById('board');
  for(let i=0;i<5;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=cx+'px'; p.style.top=cy+'px';
    p.style.background='#fff';
    const ang=Math.random()*Math.PI*2, dist=18+Math.random()*22;
    p.style.transition='transform .45s ease-out, opacity .45s ease-out';
    board.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.transform=`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`;
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(),460);
  }
}
function showScorePop(fromEl, boardRect, amount){
  const r=fromEl.getBoundingClientRect();
  const cx=r.left-boardRect.left+r.width/2, cy=r.top-boardRect.top;
  const board=document.getElementById('board');
  const el=document.createElement('div');
  el.className='score-pop'; el.textContent='+'+amount;
  el.style.left=cx+'px'; el.style.top=cy+'px';
  board.appendChild(el);
  setTimeout(()=>el.remove(),720);
}
const COMBO_WORDS=['Sweet!','Tasty!','Delicious!','Divine!','Epic!','Legendary!'];
function showComboText(level){
  const banner=document.getElementById('comboBanner');
  const word=COMBO_WORDS[Math.min(level-2,COMBO_WORDS.length-1)];
  banner.textContent=word+(level>2?' x'+level:'');
  banner.classList.remove('show'); void banner.offsetWidth;
  banner.classList.add('show');
  playSound('combo');
}

/* ================= GRAVITY / REFILL ================= */
async function applyGravityAndRefill(){
  const moves=[]; const newSpawns=[];
  for(let c=0;c<COLS;c++){
    let segStart=0;
    for(let r=0;r<=ROWS;r++){
      const isChoco = r<ROWS && occGrid[r][c].kind==='chocolate';
      if(isChoco || r===ROWS){
        compactSegment(c, segStart, r-1, moves, newSpawns);
        segStart=r+1;
      }
    }
  }
  await syncCandyDom(moves, newSpawns);
  // collect ingredients that reached bottom row
  const targetIcon=document.querySelector('.obj-chip[data-type="ingredient"] .oi');
  for(let c=0;c<COLS;c++){
    const cell=occGrid[ROWS-1][c];
    if(cell.kind==='candy' && cell.ingredient){
      if(game.objectives.ingredient) game.objectives.ingredient.current++;
      const el=cell.el;
      if(el && targetIcon){
        const from=el.getBoundingClientRect(); const to=targetIcon.getBoundingClientRect();
        const clone=el.cloneNode(true);
        clone.style.position='fixed'; clone.style.left=from.left+'px'; clone.style.top=from.top+'px';
        clone.style.width=from.width+'px'; clone.style.height=from.height+'px'; clone.style.margin='0';
        clone.style.zIndex=300; clone.style.transition='all .5s ease-in';
        document.body.appendChild(clone);
        requestAnimationFrame(()=>{
          clone.style.left=to.left+'px'; clone.style.top=to.top+'px';
          clone.style.width='10px'; clone.style.height='10px'; clone.style.opacity='0.2';
        });
        setTimeout(()=>clone.remove(),520);
      }
      if(el) el.remove();
      occGrid[ROWS-1][c]={kind:'empty'};
    }
  }
  if(occGrid[ROWS-1].some(cell=>cell.kind==='empty')){
    await applyGravityAndRefillPlain();
  }
  updateObjectivesUI();
}
async function applyGravityAndRefillPlain(){
  const moves=[]; const newSpawns=[];
  for(let c=0;c<COLS;c++){
    let segStart=0;
    for(let r=0;r<=ROWS;r++){
      const isChoco = r<ROWS && occGrid[r][c].kind==='chocolate';
      if(isChoco || r===ROWS){
        compactSegment(c, segStart, r-1, moves, newSpawns);
        segStart=r+1;
      }
    }
  }
  await syncCandyDom(moves,newSpawns);
}
function compactSegment(c, top, bottom, moves, newSpawns){
  if(top>bottom) return;
  let writeRow=bottom;
  for(let r=bottom;r>=top;r--){
    if(occGrid[r][c].kind==='candy'){
      if(writeRow!==r){
        moves.push({fromR:r,fromC:c,toR:writeRow,toC:c});
        occGrid[writeRow][c]=occGrid[r][c];
        occGrid[r][c]={kind:'empty'};
      }
      writeRow--;
    }
  }
  for(let r=writeRow;r>=top;r--){
    const color=Math.floor(Math.random()*game.colorCount);
    occGrid[r][c]={kind:'candy',color,special:null,cage:0,ingredient:false,el:null};
    newSpawns.push([r,c]);
  }
}
async function syncCandyDom(moves,newSpawns){
  moves.forEach(m=>{
    const cell=occGrid[m.toR][m.toC];
    if(cell.el){ flipMoveElement(cell.el, m.toR, m.toC); }
  });
  newSpawns.forEach(([r,c])=>{ createCandyEl(r,c,false); });
  await delay(260);
}
function flipMoveElement(el,toR,toC){
  const target=cellSlot(toR,toC);
  const first=el.getBoundingClientRect();
  target.appendChild(el);
  const last=el.getBoundingClientRect();
  const dx=first.left-last.left, dy=first.top-last.top;
  el.style.transition='none';
  el.style.transform=`translate(${dx}px,${dy}px)`;
  void el.offsetWidth;
  requestAnimationFrame(()=>{
    el.style.transition='transform .28s cubic-bezier(.4,1.3,.6,1)';
    el.style.transform='translate(0,0)';
  });
}

/* ================= DOM CANDY RENDERING ================= */
function createCandyEl(r,c,instant){
  const cell=occGrid[r][c];
  const slot=cellSlot(r,c);
  const el=document.createElement('div');
  el.className='candy';
  el.dataset.r=r; el.dataset.c=c;
  const body=document.createElement('div');
  body.className='candy-body';
  el.appendChild(body);
  slot.appendChild(el);
  cell.el=el;
  updateCandyVisual(r,c);
  if(!instant) el.classList.add('spawnin');
  return el;
}
function updateCandyVisual(r,c){
  const cell=occGrid[r][c];
  if(cell.kind!=='candy'||!cell.el) return;
  const el=cell.el;
  el.className='candy';
  if(cell.ingredient){
    el.classList.add('ingredient');
  } else if(cell.special==='bomb'){
    el.classList.add('special-bomb');
  } else {
    el.classList.add('c'+cell.color, 's'+cell.color);
    if(cell.special) el.classList.add('special-'+cell.special);
  }
  let cage=el.querySelector('.cage');
  if(cell.cage>0){
    if(!cage){ cage=document.createElement('div'); cage.className='cage'; el.appendChild(cage); }
    cage.className='cage'+(cell.cage===1?' cage-1':'');
  } else if(cage){ cage.remove(); }
}
function buildBoardDom(){
  const board=document.getElementById('board');
  board.innerHTML='';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const slot=document.createElement('div');
      slot.className='cell-slot';
      slot.dataset.r=r; slot.dataset.c=c;
      if(jellyGrid[r][c]>0){
        const j=document.createElement('div');
        j.className='jelly-layer'+(jellyGrid[r][c]===2?' j2':'');
        slot.appendChild(j);
      }
      if(occGrid[r][c].kind==='chocolate'){
        const cb=document.createElement('div');
        cb.className='choco-block'; cb.textContent='🍫';
        slot.appendChild(cb);
      }
      board.appendChild(slot);
    }
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(occGrid[r][c].kind==='candy'){ occGrid[r][c].el=null; createCandyEl(r,c,true); }
  }
}

/* ================= INPUT ================= */
function setupInput(){
  const board=document.getElementById('board');
  board.addEventListener('pointerdown',e=>{
    const slot=e.target.closest('.cell-slot'); if(!slot) return;
    pointerStart={r:+slot.dataset.r,c:+slot.dataset.c,x:e.clientX,y:e.clientY,handled:false};
  });
  board.addEventListener('pointermove',e=>{
    if(!pointerStart||pointerStart.handled||busy) return;
    const dx=e.clientX-pointerStart.x, dy=e.clientY-pointerStart.y;
    const th=16;
    if(Math.abs(dx)<th && Math.abs(dy)<th) return;
    let dr=0,dc=0;
    if(Math.abs(dx)>Math.abs(dy)) dc=dx>0?1:-1; else dr=dy>0?1:-1;
    const r2=pointerStart.r+dr, c2=pointerStart.c+dc;
    pointerStart.handled=true;
    clearSelection();
    attemptSwap(pointerStart.r,pointerStart.c,r2,c2);
  });
  board.addEventListener('click',e=>{
    const slot=e.target.closest('.cell-slot'); if(!slot) return;
    const r=+slot.dataset.r, c=+slot.dataset.c;
    if(pointerStart && pointerStart.handled){ pointerStart=null; return; }
    if(busy) return;
    if(hammerArmed){ useHammerAt(r,c); return; }
    if(!selected){ selected=[r,c]; highlightSelected(); return; }
    const [sr,sc]=selected;
    if(sr===r&&sc===c){ clearSelection(); return; }
    if(isAdjacent(sr,sc,r,c)){ clearSelection(); attemptSwap(sr,sc,r,c); }
    else { clearSelection(); selected=[r,c]; highlightSelected(); }
  });
}
function highlightSelected(){
  document.querySelectorAll('.candy.selected').forEach(el=>el.classList.remove('selected'));
  if(selected){ const cell=occGrid[selected[0]][selected[1]]; if(cell.el) cell.el.classList.add('selected'); }
}
function clearSelection(){ selected=null; document.querySelectorAll('.candy.selected').forEach(el=>el.classList.remove('selected')); }

async function attemptSwap(r1,c1,r2,c2){
  if(busy) return;
  if(r2<0||c2<0||r2>=ROWS||c2>=COLS) return;
  if(!isAdjacent(r1,c1,r2,c2)) return;
  const cellA=occGrid[r1][c1], cellB=occGrid[r2][c2];
  if(cellA.kind!=='candy'||cellB.kind!=='candy') return;
  busy=true;
  playSound('swap');
  swapCells(r1,c1,r2,c2);
  await delay(230);

  const combo=computeSwapComboClears(r1,c1,r2,c2);
  const runs=combo?[]:findRuns();

  if(!combo && runs.length===0){
    playSound('invalid');
    swapCells(r1,c1,r2,c2);
    await delay(230);
    busy=false;
    return;
  }

  game.movesLeft--; updateHeaderMoves();
  let comboLevel=1;
  let finalClears;
  if(combo){
    finalClears=await resolveBoard(combo);
  } else {
    const hint=pickHint(r1,c1,r2,c2,runs);
    const {clears,spawns}=processRuns(runs,hint);
    applySpawns(spawns);
    finalClears=await resolveBoard(clears);
  }
  await performClearApplyEffects(finalClears, comboLevel);
  await cascadeLoop();
  spreadChocolateStep();
  checkWinLose();
  busy=false;
}
function swapCells(r1,c1,r2,c2){
  const a=occGrid[r1][c1], b=occGrid[r2][c2];
  occGrid[r1][c1]=b; occGrid[r2][c2]=a;
  if(a.el) flipMoveElement(a.el, r2, c2);
  if(b.el) flipMoveElement(b.el, r1, c1);
}
async function cascadeLoop(){
  let comboLevel=2;
  while(true){
    await applyGravityAndRefill();
    const runs=findRuns();
    if(runs.length===0) break;
    showComboText(comboLevel);
    const {clears,spawns}=processRuns(runs,null);
    applySpawns(spawns);
    const finalClears=await resolveBoard(clears);
    await performClearApplyEffects(finalClears, comboLevel);
    comboLevel++;
    await delay(80);
  }
}
function spreadChocolateStep(){
  const chocoCells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(occGrid[r][c].kind==='chocolate') chocoCells.push([r,c]);
  if(chocoCells.length===0 || chocoCells.length>=MAX_CHOCO) return;
  for(let i=chocoCells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [chocoCells[i],chocoCells[j]]=[chocoCells[j],chocoCells[i]]; }
  for(const [r,c] of chocoCells){
    const neighbors=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>rr>=0&&cc>=0&&rr<ROWS&&cc<COLS&&occGrid[rr][cc].kind==='candy'&&occGrid[rr][cc].cage===0&&!occGrid[rr][cc].ingredient);
    if(neighbors.length && Math.random()<0.35){
      const [nr,nc]=neighbors[Math.floor(Math.random()*neighbors.length)];
      if(occGrid[nr][nc].el) occGrid[nr][nc].el.remove();
      occGrid[nr][nc]={kind:'chocolate'};
      const slot=cellSlot(nr,nc);
      const cb=document.createElement('div'); cb.className='choco-block'; cb.textContent='🍫';
      slot.appendChild(cb);
      break;
    }
  }
}

/* ================= BOOSTERS ================= */
let hammerArmed=false;
function setupBoosters(){
  document.getElementById('boosterMoves').onclick=()=>{
    if(busy) return;
    if(state.coins<50){ flashCoinsShortage(); return; }
    state.coins-=50; updateCoinsUI();
    game.movesLeft+=5; updateHeaderMoves();
  };
  document.getElementById('boosterBomb').onclick=()=>{
    if(busy) return;
    if(state.coins<80){ flashCoinsShortage(); return; }
    const spots=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(occGrid[r][c].kind==='candy'&&!occGrid[r][c].special&&!occGrid[r][c].ingredient&&occGrid[r][c].cage===0) spots.push([r,c]);
    if(!spots.length) return;
    state.coins-=80; updateCoinsUI();
    const [r,c]=spots[Math.floor(Math.random()*spots.length)];
    occGrid[r][c].special='bomb';
    updateCandyVisual(r,c);
    if(occGrid[r][c].el) occGrid[r][c].el.classList.add('spawnin');
  };
  document.getElementById('boosterHammer').onclick=()=>{
    if(busy) return;
    if(!hammerArmed){
      if(state.coins<60){ flashCoinsShortage(); return; }
      hammerArmed=true;
      document.getElementById('boosterHammer').classList.add('armed');
    } else {
      hammerArmed=false;
      document.getElementById('boosterHammer').classList.remove('armed');
    }
  };
}
function flashCoinsShortage(){
  const pill=document.querySelector('#screen-game');
  const badge=document.getElementById('boosterMoves');
}
async function useHammerAt(r,c){
  const cell=occGrid[r][c];
  if(cell.kind!=='candy'){ hammerArmed=false; document.getElementById('boosterHammer').classList.remove('armed'); return; }
  state.coins-=60; updateCoinsUI();
  hammerArmed=false; document.getElementById('boosterHammer').classList.remove('armed');
  busy=true;
  const clears=new Set([key(r,c)]);
  await performClearApplyEffects(clears,1);
  await cascadeLoop();
  spreadChocolateStep();
  checkWinLose();
  busy=false;
}

/* ================= HEADER / OBJECTIVES UI ================= */
const OBJ_ICONS={score:'🏆',jelly:'🟦',ingredient:'🍒',blocker:'🍫',lock:'🔒'};
function updateHeaderMoves(){
  const badge=document.getElementById('movesBadge');
  badge.textContent=game.movesLeft;
  badge.classList.toggle('low', game.movesLeft<=5);
}
function updateHeaderScore(){
  document.getElementById('scoreNum').textContent=game.score;
  const pct=Math.min(100, Math.round(100*game.score/game.starTarget));
  document.getElementById('scoreBarFill').style.width=pct+'%';
}
function updateObjectivesUI(){
  const row=document.getElementById('objectivesRow');
  row.innerHTML='';
  const obj=game.objectives;
  const defs=[];
  if(obj.score) defs.push({type:'score',done:game.score>=obj.score.target,text:Math.min(game.score,obj.score.target)+'/'+obj.score.target});
  if(obj.jelly) defs.push({type:'jelly',done:obj.jelly.remaining<=0,text:Math.max(0,obj.jelly.remaining)+' left'});
  if(obj.ingredient) defs.push({type:'ingredient',done:obj.ingredient.current>=obj.ingredient.target,text:Math.min(obj.ingredient.current,obj.ingredient.target)+'/'+obj.ingredient.target});
  if(obj.blocker) defs.push({type:'blocker',done:obj.blocker.current>=obj.blocker.target,text:Math.min(obj.blocker.current,obj.blocker.target)+'/'+obj.blocker.target});
  if(obj.lock) defs.push({type:'lock',done:obj.lock.remaining<=0,text:Math.max(0,obj.lock.remaining)+' left'});
  defs.forEach(d=>{
    const chip=document.createElement('div');
    chip.className='obj-chip'+(d.done?' done':'');
    chip.dataset.type=d.type;
    chip.innerHTML='<span class="oi">'+OBJ_ICONS[d.type]+'</span><span>'+(d.done?'Done!':d.text)+'</span>';
    row.appendChild(chip);
  });
}

/* ================= WIN / LOSE ================= */
function checkWinLose(){
  const obj=game.objectives;
  let allDone=true;
  if(obj.score && game.score<obj.score.target) allDone=false;
  if(obj.jelly && obj.jelly.remaining>0) allDone=false;
  if(obj.ingredient && obj.ingredient.current<obj.ingredient.target) allDone=false;
  if(obj.blocker && obj.blocker.current<obj.blocker.target) allDone=false;
  if(obj.lock && obj.lock.remaining>0) allDone=false;
  updateObjectivesUI();
  if(allDone){ onLevelWin(); return; }
  if(game.movesLeft<=0){ onLevelLose(); return; }
  if(!hasPossibleMove()){ reshuffleBoard(); }
}
function onLevelWin(){
  playSound('win');
  game.score += game.movesLeft*150;
  updateHeaderScore();
  let stars=1;
  if(game.score>=game.starTarget*2) stars=3;
  else if(game.score>=game.starTarget*1.5) stars=2;
  state.levelStars[game.idx]=Math.max(state.levelStars[game.idx],stars);
  state.unlockedCount=Math.max(state.unlockedCount, game.idx+2);
  const coinsWon=30+stars*10;
  state.coins+=coinsWon;
  updateCoinsUI();
  document.getElementById('winScoreText').textContent='Score: '+game.score;
  document.getElementById('winCoinsText').textContent='+'+coinsWon+' 🪙';
  const starEls=document.querySelectorAll('#winStars span');
  starEls.forEach((el,i)=>{ el.classList.remove('won'); el.style.animationDelay=(i*0.15)+'s'; setTimeout(()=>{ if(i<stars) el.classList.add('won'); },50); });
  showConfetti();
  document.getElementById('modalWin').classList.remove('hidden');
}
function onLevelLose(){
  playSound('lose');
  document.getElementById('modalLose').classList.remove('hidden');
}
function showConfetti(){
  const colors=['#ff6b6b','#ffd54f','#4ad66d','#2196f3','#b34af0','#ff9a2e'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animation=`confettiFall ${1.2+Math.random()*1.2}s ease-in forwards`;
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2600);
  }
}
const styleSheet=document.createElement('style');
styleSheet.textContent='@keyframes confettiFall{to{transform:translateY(100vh) rotate(400deg);opacity:.2;}}';
document.head.appendChild(styleSheet);

/* ================= LIVES / COINS ================= */
function updateLivesUI(){
  document.getElementById('livesText').textContent=state.lives;
  const timerEl=document.getElementById('livesTimer');
  if(state.lives<MAX_LIVES && state.nextLifeAt){
    const remain=Math.max(0,state.nextLifeAt-Date.now());
    const m=Math.floor(remain/60000), s=Math.floor((remain%60000)/1000);
    timerEl.textContent=m+':'+String(s).padStart(2,'0');
  } else timerEl.textContent='';
}
function updateCoinsUI(){ document.getElementById('coinsText').textContent=state.coins; }
setInterval(()=>{
  if(state.lives<MAX_LIVES && state.nextLifeAt && Date.now()>=state.nextLifeAt){
    state.lives++;
    state.nextLifeAt = state.lives<MAX_LIVES ? Date.now()+REGEN_MS : null;
  }
  updateLivesUI();
  const t=document.getElementById('noLivesTimer');
  if(t && !document.getElementById('modalNoLives').classList.contains('hidden')){
    if(state.nextLifeAt){ const remain=Math.max(0,state.nextLifeAt-Date.now()); const m=Math.floor(remain/60000), s=Math.floor((remain%60000)/1000); t.textContent=m+':'+String(s).padStart(2,'0'); }
  }
},1000);

/* ================= SCREENS / MAP ================= */
function renderMap(){
  const pathEl=document.getElementById('mapPath');
  pathEl.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const node=document.createElement('div');
    const unlocked=i<state.unlockedCount;
    const isCurrent = i===state.unlockedCount-1;
    node.className='level-node '+(i%2===0?'n1':'n2')+(unlocked?'':' locked')+(isCurrent?' current':'');
    if(unlocked){
      node.innerHTML = (state.levelStars[i]>0
        ? '<div class="stars">'+'⭐'.repeat(state.levelStars[i])+'</div>' : '')
        + (i+1)
        + '<div class="lvname">'+lv.name+'</div>';
      node.onclick=()=>startLevel(i);
    } else {
      node.innerHTML='<span class="lock-icon">🔒</span><div class="lvname">'+lv.name+'</div>';
    }
    pathEl.appendChild(node);
  });
  updateLivesUI(); updateCoinsUI();
}
function startLevel(idx){
  if(state.lives<=0){
    document.getElementById('modalNoLives').classList.remove('hidden');
    return;
  }
  state.lives--;
  if(state.lives<MAX_LIVES && !state.nextLifeAt) state.nextLifeAt=Date.now()+REGEN_MS;
  updateLivesUI();
  game=buildLevelRuntime(idx);
  document.getElementById('screen-map').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  document.getElementById('levelTitle').textContent='Lv '+(idx+1)+' · '+game.name;
  buildBoardDom();
  updateHeaderMoves();
  updateHeaderScore();
  updateObjectivesUI();
  hammerArmed=false;
  const hb=document.getElementById('boosterHammer'); if(hb) hb.classList.remove('armed');
}
function backToMap(){
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-map').classList.remove('hidden');
  renderMap();
}

/* ================= WIRE UP ================= */
document.getElementById('backBtn').onclick=backToMap;
document.getElementById('winContinueBtn').onclick=()=>{ document.getElementById('modalWin').classList.add('hidden'); backToMap(); };
document.getElementById('loseRetryBtn').onclick=()=>{ document.getElementById('modalLose').classList.add('hidden'); startLevel(game.idx); };
document.getElementById('loseMapBtn').onclick=()=>{ document.getElementById('modalLose').classList.add('hidden'); backToMap(); };
document.getElementById('watchAdBtn').onclick=()=>{
  state.lives=Math.min(MAX_LIVES,state.lives+1);
  if(state.lives>=MAX_LIVES) state.nextLifeAt=null;
  updateLivesUI();
  document.getElementById('modalNoLives').classList.add('hidden');
};
document.getElementById('noLivesCloseBtn').onclick=()=>document.getElementById('modalNoLives').classList.add('hidden');

setupInput();
setupBoosters();
renderMap();
})();
</script>
</body>
