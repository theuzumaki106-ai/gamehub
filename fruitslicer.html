<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fruit Slicer</title>
<style>
  :root{
    --gold:#ffd23f;
    --red:#ff4d4d;
    --dark:#0c0f14;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    touch-action:none;
  }
  #wrap{
    position:relative;
    width:100vw;height:100vh;
    overflow:hidden;
  }
  canvas{
    position:absolute;
    top:0;left:0;
    display:block;
  }
  #fxCanvas{
    pointer-events:none;
  }
  #bgGradient{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 0%, #1a2438 0%, #0c0f14 55%, #05070a 100%);
    z-index:0;
  }
  #vignette{
    position:absolute;inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 18vw 4vw rgba(0,0,0,0.65);
    z-index:5;
  }

  /* HUD */
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 24px;
    z-index:10;
    pointer-events:none;
  }
  .hud-box{
    display:flex;flex-direction:column;
    align-items:flex-start;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
  }
  #scoreLabel{
    font-size:12px;letter-spacing:3px;color:rgba(255,255,255,0.55);
    font-weight:600;
  }
  #scoreVal{
    font-size:44px;font-weight:800;color:#fff;
    font-variant-numeric:tabular-nums;
    line-height:1;
    background:linear-gradient(180deg,#fff, #ffe9a8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  #combo{
    font-size:18px;font-weight:700;color:var(--gold);
    height:24px;
    opacity:0;
    transform:translateY(-4px) scale(0.9);
    transition:opacity .15s, transform .15s;
  }
  #combo.show{opacity:1;transform:translateY(0) scale(1);}

  #lives{
    display:flex;gap:8px;
  }
  .life{
    width:30px;height:30px;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.6));
    transition:transform .3s, opacity .3s;
  }
  .life.lost{
    opacity:0.15;
    transform:scale(0.7) rotate(20deg);
  }

  /* Screens */
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:50;
    background:radial-gradient(ellipse at 50% 40%, rgba(20,26,38,0.92), rgba(4,5,8,0.97));
    backdrop-filter:blur(2px);
    text-align:center;
    padding:20px;
  }
  .hidden{display:none !important;}

  .title{
    font-size:clamp(48px,10vw,88px);
    font-weight:900;
    letter-spacing:-2px;
    background:linear-gradient(180deg,#fff 10%, #ffd23f 60%, #ff7b3f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(255,120,50,0.35));
    margin-bottom:6px;
    transform:rotate(-2deg);
  }
  .subtitle{
    color:rgba(255,255,255,0.55);
    font-size:15px;
    letter-spacing:4px;
    font-weight:600;
    margin-bottom:44px;
    text-transform:uppercase;
  }
  .btn{
    position:relative;
    padding:18px 54px;
    font-size:20px;
    font-weight:800;
    letter-spacing:1px;
    color:#3a1a00;
    background:linear-gradient(180deg,#ffe27a, var(--gold) 55%, #ff9f3f);
    border:none;
    border-radius:100px;
    cursor:pointer;
    box-shadow:0 8px 0 #b5731f, 0 18px 30px rgba(0,0,0,0.45);
    transition:transform .08s, box-shadow .08s;
    pointer-events:all;
  }
  .btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #b5731f, 0 8px 18px rgba(0,0,0,0.4);
  }
  .btn.secondary{
    margin-top:16px;
    background:transparent;
    color:rgba(255,255,255,0.7);
    box-shadow:none;
    font-size:14px;
    letter-spacing:2px;
    text-decoration:underline;
    padding:8px;
  }
  .btn.secondary:active{transform:none;box-shadow:none;}

  .stat-row{
    display:flex;gap:40px;
    margin:28px 0 36px;
  }
  .stat{display:flex;flex-direction:column;align-items:center;}
  .stat-val{font-size:40px;font-weight:800;color:#fff;}
  .stat-label{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.45);margin-top:2px;text-transform:uppercase;}
  .newbest{
    color:var(--gold);
    font-size:13px;
    letter-spacing:2px;
    font-weight:700;
    margin-top:-20px;
    margin-bottom:24px;
    opacity:0;
    animation:pop-in .4s .3s forwards;
  }
  @keyframes pop-in{
    from{opacity:0;transform:scale(0.5);}
    to{opacity:1;transform:scale(1);}
  }

  .howto{
    display:flex;gap:28px;
    margin-bottom:10px;
    flex-wrap:wrap;justify-content:center;
    max-width:520px;
  }
  .howto div{
    color:rgba(255,255,255,0.6);
    font-size:13px;
    max-width:150px;
  }
  .howto b{display:block;color:#fff;font-size:15px;margin-bottom:4px;}

  #startFruitDeco{
    position:absolute;
    font-size:40px;
    opacity:0.85;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,0.5));
    pointer-events:none;
  }

  #pauseBtn{
    position:absolute;top:20px;right:24px;
    z-index:20;
    width:44px;height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    pointer-events:all;
    backdrop-filter:blur(6px);
  }
  #pauseBtn:active{background:rgba(255,255,255,0.18);}

  #flash{
    position:absolute;inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:40;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="bgGradient"></div>
  <canvas id="gameCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-box">
      <div id="scoreLabel">SCORE</div>
      <div id="scoreVal">0</div>
      <div id="combo">Combo x1</div>
    </div>
    <div class="hud-box" style="align-items:flex-end;">
      <div id="scoreLabel">LIVES</div>
      <div id="lives"></div>
    </div>
  </div>

  <button id="pauseBtn">❚❚</button>

  <!-- Start Screen -->
  <div id="startScreen" class="screen">
    <div class="title">FRUIT SLICER</div>
    <div class="subtitle">swipe · slice · survive</div>
    <div class="howto">
      <div><b>🖱️ Swipe</b>Drag across fruit to slice it in half</div>
      <div><b>💣 Avoid Bombs</b>Slicing a bomb ends your run</div>
      <div><b>🔥 Combo</b>Chain slices in one swipe for bonus points</div>
    </div>
    <button class="btn" id="startBtn">Start Game</button>
  </div>

  <!-- Pause Screen -->
  <div id="pauseScreen" class="screen hidden">
    <div class="title" style="font-size:clamp(36px,7vw,56px);">PAUSED</div>
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn secondary" id="restartFromPauseBtn">Restart</button>
  </div>

  <!-- Game Over Screen -->
  <div id="overScreen" class="screen hidden">
    <div class="title" style="font-size:clamp(40px,8vw,64px);">GAME OVER</div>
    <div id="newBestTag" class="newbest hidden">★ NEW BEST ★</div>
    <div class="stat-row">
      <div class="stat"><div class="stat-val" id="finalScore">0</div><div class="stat-label">Score</div></div>
      <div class="stat"><div class="stat-val" id="bestScore">0</div><div class="stat-label">Best</div></div>
      <div class="stat"><div class="stat-val" id="maxCombo">0</div><div class="stat-label">Max Combo</div></div>
    </div>
    <button class="btn" id="retryBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================= SETUP ============================= */
const gameCanvas = document.getElementById('gameCanvas');
const fxCanvas = document.getElementById('fxCanvas');
const gctx = gameCanvas.getContext('2d');
const fctx = fxCanvas.getContext('2d');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  [gameCanvas, fxCanvas].forEach(c=>{
    c.width = W*DPR; c.height = H*DPR;
    c.style.width = W+'px'; c.style.height = H+'px';
  });
  gctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ============================= AUDIO (WebAudio synthesized) ============================= */
let actx;
function ensureAudio(){
  if(!actx){
    actx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(actx.state === 'suspended') actx.resume();
}
function sfxSlice(pitch=1){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(1200*pitch, t);
  o.frequency.exponentialRampToValueAtTime(200*pitch, t+0.09);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.12);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t+0.13);

  // noise burst for "shhk"
  const bufferSize = actx.sampleRate*0.06;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufferSize);
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const ng = actx.createGain();
  ng.gain.value = 0.08;
  const hp = actx.createBiquadFilter();
  hp.type='highpass'; hp.frequency.value=1800;
  noise.connect(hp).connect(ng).connect(actx.destination);
  noise.start(t);
}
function sfxBomb(){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(30, t+0.5);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.55);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t+0.6);
}
function sfxMiss(){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(120, t+0.2);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.22);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t+0.25);
}
function sfxCombo(n){
  if(!actx) return;
  const t = actx.currentTime;
  [0,1,2].forEach((k,i)=>{
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type='sine';
    o.frequency.value = 440 * Math.pow(1.2, (n%6)+k);
    g.gain.setValueAtTime(0.001,t+i*0.04);
    g.gain.linearRampToValueAtTime(0.1, t+i*0.04+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t+i*0.04+0.18);
    o.connect(g).connect(actx.destination);
    o.start(t+i*0.04); o.stop(t+i*0.04+0.2);
  });
}

/* ============================= UTIL ============================= */
function rand(a,b){return a+Math.random()*(b-a);}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist2(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;}

/* ============================= FRUIT DEFINITIONS ============================= */
// Each fruit rendered procedurally on canvas for crisp, scalable "top graphics" without external assets.
const FRUIT_TYPES = [
  { name:'watermelon', r:52, points:10,
    skin:['#2f9e44','#37b24d'], rind:'#e9fac8', flesh:'#ff6b81', seedColor:'#1a1a1a',
    pattern:'stripes' },
  { name:'orange', r:40, points:10,
    skin:['#ff9f1c','#ff8500'], rind:'#ffe3a3', flesh:'#ffb347', seedColor:'#e8c27a',
    pattern:'dimple' },
  { name:'kiwi', r:34, points:15,
    skin:['#8a6d3b','#6f5527'], rind:'#d7ff8a', flesh:'#cdeb5c', seedColor:'#1a1a1a',
    pattern:'fuzz' },
  { name:'strawberry', r:36, points:15,
    skin:['#ff3b5c','#e8103a'], rind:'#ffd6df', flesh:'#ffb3c1', seedColor:'#ffe066',
    pattern:'seeds', shape:'heart' },
  { name:'plum', r:32, points:20,
    skin:['#8854d0','#5f3dc4'], rind:'#f3ecff', flesh:'#c9a6ff', seedColor:'#5f3dc4',
    pattern:'plain' },
  { name:'pineapple', r:46, points:25,
    skin:['#ffd43b','#fab005'], rind:'#fff3bf', flesh:'#ffe066', seedColor:'#e8a33d',
    pattern:'cross', shape:'oval' },
];
const BOMB = { name:'bomb', r:38, points:0 };

/* ============================= GAME OBJECTS ============================= */
let objects = [];      // flying fruit/bombs
let particles = [];    // juice splash + explosion particles
let slashTrail = [];   // trail points for the blade
let floatingTexts = [];

let score = 0, combo = 0, comboTimer = 0, maxCombo = 0, lives = 3;
let best = parseInt(localStorage.getItem('fruitSlicerBest')||'0',10);
let spawnTimer = 0, spawnInterval = 1.05;
let gameTime = 0;
let state = 'menu'; // menu, playing, paused, over
let lastTs = 0;
let shakeMag = 0;
let slowmoT = 0; // slow motion timer for big combos

const GRAVITY = 1500;

class GameObject{
  constructor(isBomb){
    this.isBomb = isBomb;
    this.type = isBomb ? BOMB : choice(FRUIT_TYPES);
    this.r = this.type.r * rand(0.9,1.15);
    const margin = this.r+20;
    this.x = rand(margin, W-margin);
    this.y = H + this.r + 30;
    // aim roughly toward upper-middle area with randomness
    const targetX = rand(W*0.2, W*0.8);
    const peakHeight = rand(H*0.35, H*0.78);
    const t = rand(0.85,1.15); // time to peak (s) — derive velocity
    this.vy = -Math.sqrt(2*GRAVITY*peakHeight);
    this.vx = (targetX - this.x)/ (2*Math.abs(this.vy)/GRAVITY);
    this.rot = rand(0, Math.PI*2);
    this.vrot = rand(-3.2,3.2);
    this.sliced = false;
    this.dead = false;
    this.spawnScale = 0;
    this.fuseFlicker = 0;
  }
  update(dt){
    this.spawnScale = Math.min(1, this.spawnScale + dt*6);
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    this.vy += GRAVITY*dt;
    this.rot += this.vrot*dt;
    this.fuseFlicker += dt;
    if(this.y - this.r > H+60) this.dead = true;
  }
  get scale(){ return this.spawnScale; }
}

/* ---------- particles ---------- */
class Particle{
  constructor(x,y,color,opts={}){
    this.x=x;this.y=y;
    this.vx = opts.vx ?? rand(-260,260);
    this.vy = opts.vy ?? rand(-380,-40);
    this.g = opts.g ?? 900;
    this.r = opts.r ?? rand(2,6);
    this.color = color;
    this.life = opts.life ?? rand(0.5,1.0);
    this.age = 0;
    this.shrink = opts.shrink ?? true;
    this.type = opts.type || 'drop';
    this.rot = rand(0,Math.PI*2);
    this.vrot = rand(-6,6);
  }
  update(dt){
    this.age += dt;
    this.vy += this.g*dt;
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    this.rot += this.vrot*dt;
  }
  get alive(){ return this.age < this.life; }
  get t(){ return this.age/this.life; }
}

function spawnJuice(x,y,colorArr,count){
  for(let i=0;i<count;i++){
    particles.push(new Particle(x,y, choice(colorArr), {
      vx: rand(-320,320), vy: rand(-420,-60), r: rand(3,8), life: rand(0.45,0.9), type:'drop'
    }));
  }
}
function spawnChunks(x,y,skinColor,fleshColor,n){
  for(let i=0;i<n;i++){
    particles.push(new Particle(x,y, i%2? skinColor:fleshColor, {
      vx: rand(-200,200), vy: rand(-350,-40), r: rand(6,13), life: rand(0.6,1.0), type:'chunk'
    }));
  }
}
function spawnSpark(x,y){
  for(let i=0;i<26;i++){
    const a = rand(0,Math.PI*2);
    const sp = rand(120,520);
    particles.push(new Particle(x,y, choice(['#ffcf4d','#ff8a3d','#ff4d4d','#fff']), {
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, g: 400, r: rand(2,5), life: rand(0.4,0.85), type:'spark'
    }));
  }
}
function spawnSmoke(x,y){
  for(let i=0;i<14;i++){
    particles.push(new Particle(x,y,'rgba(80,80,80,0.5)', {
      vx: rand(-80,80), vy: rand(-160,-20), g:-40, r: rand(14,30), life: rand(0.7,1.3), type:'smoke'
    }));
  }
}

class FloatingText{
  constructor(x,y,text,color,size=28){
    this.x=x;this.y=y;this.text=text;this.color=color;this.size=size;
    this.age=0;this.life=0.9;this.vy=-70;
  }
  update(dt){ this.age+=dt; this.y+=this.vy*dt; this.vy *= (1-dt*2); }
  get alive(){return this.age<this.life;}
}

/* ============================= INPUT / SLICING ============================= */
let pointerDown = false;
let lastPointer = null;

function getPos(e){
  const rect = gameCanvas.getBoundingClientRect();
  if(e.touches && e.touches.length){
    return {x:e.touches[0].clientX-rect.left, y:e.touches[0].clientY-rect.top};
  }
  return {x:e.clientX-rect.left, y:e.clientY-rect.top};
}

function onDown(e){
  ensureAudio();
  pointerDown = true;
  const p = getPos(e);
  lastPointer = p;
  slashTrail.push({x:p.x,y:p.y,t:performance.now()});
}
function onMove(e){
  if(!pointerDown || state!=='playing') return;
  const p = getPos(e);
  if(lastPointer){
    checkSlice(lastPointer, p);
  }
  lastPointer = p;
  slashTrail.push({x:p.x,y:p.y,t:performance.now()});
  if(slashTrail.length>22) slashTrail.shift();
}
function onUp(){
  pointerDown = false;
  lastPointer = null;
  comboResetSoon();
}

['mousedown','touchstart'].forEach(evt=>gameCanvas.addEventListener(evt, e=>{ if(state==='playing'){e.preventDefault(); onDown(e);} }, {passive:false}));
['mousemove','touchmove'].forEach(evt=>gameCanvas.addEventListener(evt, e=>{ if(state==='playing'){e.preventDefault(); onMove(e);} }, {passive:false}));
['mouseup','touchend','mouseleave','touchcancel'].forEach(evt=>gameCanvas.addEventListener(evt, onUp));

let sliceStreak = 0; // fruits sliced within current swipe gesture
let comboResetHandle = null;
function comboResetSoon(){
  clearTimeout(comboResetHandle);
  comboResetHandle = setTimeout(()=>{ sliceStreak = 0; }, 260);
}

function checkSlice(p1,p2){
  const segLen = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  if(segLen < 2) return;
  for(const obj of objects){
    if(obj.sliced || obj.dead) continue;
    if(obj.scale < 0.8) continue;
    // distance from point to segment
    const d = pointSegDist(obj.x,obj.y,p1.x,p1.y,p2.x,p2.y);
    if(d < obj.r*0.95){
      sliceObject(obj, p2.x-p1.x, p2.y-p1.y);
    }
  }
}
function pointSegDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const len2 = dx*dx+dy*dy;
  let t = len2===0?0:((px-x1)*dx+(py-y1)*dy)/len2;
  t = clamp(t,0,1);
  const cx = x1+t*dx, cy = y1+t*dy;
  return Math.hypot(px-cx, py-cy);
}

/* ============================= SLICE LOGIC ============================= */
function sliceObject(obj, dx, dy){
  obj.sliced = true;
  obj.dead = true;
  const angle = Math.atan2(dy,dx);

  if(obj.isBomb){
    triggerBombHit(obj);
    return;
  }

  sliceStreak++;
  combo = sliceStreak;
  comboTimer = 1.1;
  maxCombo = Math.max(maxCombo, combo);

  const base = obj.type.points;
  const bonus = combo>1 ? Math.round(base * (combo-1) * 0.5) : 0;
  const gained = base + bonus;
  score += gained;
  updateScoreUI();

  floatingTexts.push(new FloatingText(obj.x, obj.y-obj.r, '+'+gained, '#fff', 26));
  if(combo>1){
    showCombo(combo);
    sfxCombo(combo);
  }
  sfxSlice(rand(0.9,1.15));

  spawnJuice(obj.x,obj.y, [obj.type.flesh, obj.type.skin[0]], 20);
  spawnChunks(obj.x,obj.y, obj.type.skin[0], obj.type.flesh, 6);
  spawnSlashFlash(obj.x, obj.y, angle, obj.r*2.6);
  spawnRing(obj.x, obj.y, obj.type.flesh, obj.r*2.2);

  // record halves to render as flying sliced pieces
  slicedHalves.push(new SlicedHalf(obj, angle, -1));
  slicedHalves.push(new SlicedHalf(obj, angle, 1));

  shakeMag = Math.min(shakeMag+3, 11);
}

let slicedHalves = [];
class SlicedHalf{
  constructor(obj, angle, side){
    this.obj = obj;
    this.side = side;
    this.x = obj.x; this.y = obj.y;
    // separation kick perpendicular to the blade so the two halves visibly part
    const kickAngle = angle + Math.PI/2*side;
    const kick = rand(110,220);
    this.vx = obj.vx*0.55 + Math.cos(kickAngle)*kick;
    this.vy = obj.vy*0.55 + Math.sin(kickAngle)*kick - rand(50,110);
    this.rot = obj.rot;
    this.vrot = obj.vrot*0.75 + side*rand(3.5,7);
    this.life = 1.05;
    this.age = 0;
    // cut plane angle is fixed relative to the fruit's OWN rotation frame,
    // so it stays rigidly attached to the half as it spins (this was the bug).
    this.localCutAngle = angle - obj.rot;
    this.pop = 0; // squash-pop progress, 0..1
    // pre-rolled seed positions on the exposed cross-section so they don't flicker
    this.seedDots = [];
    const n = obj.type.pattern==='seeds' ? 9 : 5;
    for(let i=0;i<n;i++) this.seedDots.push(rand(-obj.r*0.75, obj.r*0.75));
  }
  update(dt){
    this.age += dt;
    this.pop = Math.min(1, this.pop + dt*9);
    this.vy += GRAVITY*0.9*dt;
    this.x += this.vx*dt;
    this.y += this.vy*dt;
    this.rot += this.vrot*dt;
  }
  get alive(){ return this.age < this.life && this.y - 150 < H; }
}

/* ---------- slice-moment flourishes: blade flash + shockwave ring ---------- */
let slashFlashes = [];
function spawnSlashFlash(x,y,angle,len){

}
let rings = [];
function spawnRing(x,y,color,maxR){

}

function lifeSVG(){

    <path d="M16 28c-6-4.5-12-9.6-12-16A7.5 7.5 0 0116 7a7.5 7.5 0 0112 5c0 6.4-6 11.5-12 16z" fill="#ff4d5e" stroke="#ffb3ba" stroke-width="1"/>

/* ============================= SCORE UI ============================= */

  document.getElementById('scoreVal').textContent = score;
}

/* ============================= SPAWNING ============================= */
function spawnWave(){
  const n = 1 + Math.floor(Math.min(gameTime/18, 3));
  const bombChance = clamp(0.08 + gameTime*0.002, 0.08, 0.22);
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      if(state!=='playing') return;
      const isBomb = Math.random() < bombChance;
      objects.push(new GameObject(isBomb));
    }, i*140);
  }
}

/* ============================= MAIN LOOP ============================= */
function update(dt){
  gameTime += dt;

  // difficulty ramp
  spawnInterval = clamp(1.05 - gameTime*0.01, 0.45, 1.05);
  spawnTimer -= dt;
  if(spawnTimer<=0){
    spawnWave();
    spawnTimer = spawnInterval;
  }

  // combo timer
  if(comboTimer>0){
    comboTimer -= dt;
    if(comboTimer<=0){
      combo=0;
      document.getElementById('combo').classList.remove('show');
    }
  }

  for(const obj of objects){
    obj.update(dt);
    if(obj.isBomb){
      // nothing extra
    }
    if(!obj.sliced && obj.dead && obj.y-obj.r>H+50){
      if(!obj.isBomb){
        loseLife(false);
        floatingTexts.push(new FloatingText(obj.x, H-140, 'Missed!', '#ff6b6b', 22));
      }
    }
  }
  objects = objects.filter(o=>!o.dead);

  for(const h of slicedHalves) h.update(dt);
  slicedHalves = slicedHalves.filter(h=>h.alive);

  for(const p of particles) p.update(dt);
  particles = particles.filter(p=>p.alive);

  for(const s of slashFlashes) s.age += dt;
  slashFlashes = slashFlashes.filter(s=>s.age < s.life);

  for(const r of rings) r.age += dt;
  rings = rings.filter(r=>r.age < r.life);

  for(const f of floatingTexts) f.update(dt);
  floatingTexts = floatingTexts.filter(f=>f.alive);

  shakeMag *= 0.9;
  if(shakeMag<0.05) shakeMag=0;
}

/* ---------- rendering ---------- */
function drawFruit(o){
  const s = o.scale;
  gctx.save();
  gctx.translate(o.x,o.y);
  gctx.rotate(o.rot);
  gctx.scale(s,s);
  renderFruitBody(gctx, o.type, o.r, 1);
  gctx.restore();
}

function renderFruitBody(ctx, type, r, alpha){
  ctx.globalAlpha = alpha;
  // shadow under fruit for depth
  const grd = ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.15, 0,0, r);
  grd.addColorStop(0, lighten(type.skin[0], 30));
  grd.addColorStop(0.55, type.skin[0]);
  grd.addColorStop(1, type.skin[1]);

  ctx.beginPath();
  if(type.shape==='heart'){
    drawStrawberryShape(ctx, r);
  } else if(type.shape==='oval'){
    ctx.ellipse(0,0,r*0.8,r*1.05,0,0,Math.PI*2);
  } else {
    ctx.arc(0,0,r,0,Math.PI*2);
  }
  ctx.fillStyle = grd;
  ctx.fill();

  // pattern overlays
  ctx.save();
  ctx.clip();
  if(type.pattern==='stripes'){
    ctx.strokeStyle='rgba(0,60,20,0.35)';
    ctx.lineWidth=r*0.16;
    for(let a=-1;a<=1;a++){
      ctx.beginPath();
      ctx.moveTo(-r*1.2, a*r*0.7 - r*0.3);
      ctx.quadraticCurveTo(0, a*r*0.7+r*0.5, r*1.2, a*r*0.7-r*0.3);
      ctx.stroke();
    }
  } else if(type.pattern==='dimple'){
    ctx.fillStyle='rgba(0,0,0,0.08)';
    for(let i=0;i<18;i++){
      const a = (i/18)*Math.PI*2;
      const rr = r*rand(0.3,0.85);
      ctx.beginPath();
      ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr, r*0.04, 0, Math.PI*2);
      ctx.fill();
    }
  } else if(type.pattern==='fuzz'){
    ctx.fillStyle='rgba(255,255,255,0.15)';
    for(let i=0;i<80;i++){
      const a = Math.random()*Math.PI*2;
      const rr = Math.random()*r;
      ctx.fillRect(Math.cos(a)*rr, Math.sin(a)*rr, 1.4,1.4);
    }
  } else if(type.pattern==='seeds'){
    ctx.fillStyle = type.seedColor;
    for(let i=0;i<24;i++){
      const a = Math.random()*Math.PI*2;
      const rr = Math.random()*r*0.85;
      ctx.save();
      ctx.translate(Math.cos(a)*rr, Math.sin(a)*rr);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0,0,r*0.045,r*0.09,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  } else if(type.pattern==='cross'){
    ctx.strokeStyle='rgba(120,80,10,0.35)';
    ctx.lineWidth = r*0.05;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(-r, i*r*0.35);
      ctx.lineTo(r, i*r*0.35+r*0.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-r, i*r*0.35+r*0.6);
      ctx.lineTo(r, i*r*0.35);
      ctx.stroke();
    }
  }
  ctx.restore();

  // top-light specular highlight
  ctx.beginPath();
  ctx.ellipse(-r*0.32,-r*0.38, r*0.32, r*0.18, -0.6, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fill();

  // stem/leaf for some
  if(type.name!=='watermelon' && type.name!=='pineapple'){
    ctx.beginPath();
    ctx.moveTo(-r*0.05,-r*0.95);
    ctx.quadraticCurveTo(r*0.25,-r*1.25, r*0.05,-r*1.35);
    ctx.strokeStyle='#5b8c2a';
    ctx.lineWidth=r*0.08;
    ctx.lineCap='round';
    ctx.stroke();
  }
  if(type.name==='pineapple'){
    ctx.fillStyle='#2f9e44';
    for(let i=-2;i<=2;i++){
      ctx.save();
      ctx.translate(i*r*0.12, -r*0.95);
      ctx.rotate(i*0.3);
      ctx.beginPath();
      ctx.moveTo(-r*0.08,0);
      ctx.lineTo(r*0.08,0);
      ctx.lineTo(0,-r*0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.globalAlpha=1;
}
function drawStrawberryShape(ctx,r){
  ctx.moveTo(0, r*0.9);
  ctx.bezierCurveTo(-r*1.1, r*0.2, -r*0.9, -r*0.9, 0, -r*0.6);
  ctx.bezierCurveTo(r*0.9, -r*0.9, r*1.1, r*0.2, 0, r*0.9);
}
function lighten(hex, amt){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r=(num>>16)+amt, g=((num>>8)&0xff)+amt, b=(num&0xff)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);
  return `rgb(${r},${g},${b})`;
}

function drawBomb(o){
  const s=o.scale;
  gctx.save();
  gctx.translate(o.x,o.y);
  gctx.rotate(o.rot);
  gctx.scale(s,s);

  // glow
  const glow = gctx.createRadialGradient(0,0,o.r*0.2,0,0,o.r*1.8);
  glow.addColorStop(0,'rgba(255,80,40,0.35)');
  glow.addColorStop(1,'rgba(255,80,40,0)');
  gctx.fillStyle=glow;
  gctx.beginPath(); gctx.arc(0,0,o.r*1.8,0,Math.PI*2); gctx.fill();

  const bg = gctx.createRadialGradient(-o.r*0.3,-o.r*0.3,o.r*0.1,0,0,o.r);
  bg.addColorStop(0,'#4a4a4a');
  bg.addColorStop(0.6,'#1c1c1c');
  bg.addColorStop(1,'#000');
  gctx.beginPath();
  gctx.arc(0,0,o.r,0,Math.PI*2);
  gctx.fillStyle=bg;
  gctx.fill();
  gctx.lineWidth=2;
  gctx.strokeStyle='rgba(255,255,255,0.15)';
  gctx.stroke();

  // highlight
  gctx.beginPath();
  gctx.ellipse(-o.r*0.3,-o.r*0.35,o.r*0.28,o.r*0.15,-0.6,0,Math.PI*2);
  gctx.fillStyle='rgba(255,255,255,0.25)';
  gctx.fill();

  // fuse
  gctx.beginPath();
  gctx.moveTo(o.r*0.15,-o.r*0.9);
  gctx.quadraticCurveTo(o.r*0.5,-o.r*1.3, o.r*0.25,-o.r*1.5);
  gctx.strokeStyle='#c98a4b';
  gctx.lineWidth=o.r*0.09;
  gctx.lineCap='round';
  gctx.stroke();

  // spark
  const flick = 0.6+0.4*Math.sin(o.fuseFlicker*30);
  gctx.beginPath();
  gctx.arc(o.r*0.25,-o.r*1.5, o.r*0.12*flick, 0, Math.PI*2);
  gctx.fillStyle = `rgba(255,${180+Math.floor(60*flick)},60,1)`;
  gctx.fill();

  // skull mark
  gctx.fillStyle='rgba(255,255,255,0.55)';
  gctx.font = `${o.r*0.75}px serif`;
  gctx.textAlign='center';
  gctx.textBaseline='middle';
  gctx.fillText('☠', 0, o.r*0.05);

  gctx.restore();
}

function drawSlicedHalf(h){
  const t = h.age/h.life;
  const alpha = t>0.65 ? clamp(1-(t-0.65)/0.35,0,1) : 1;
  // one quick juicy "pop" as the halves separate, then a gentle shrink as they fade
  const pop = 1 + Math.sin(clamp(h.pop,0,1)*Math.PI)*0.14;
  const shrink = t>0.75 ? 1-(t-0.75)/0.25*0.35 : 1;
  const s = pop*shrink;
  const r = h.obj.r;

  gctx.save();
  gctx.globalAlpha = alpha;
  gctx.translate(h.x, h.y);
  gctx.rotate(h.rot);
  gctx.scale(s,s);

  // --- clip to this half, rigidly attached to the fruit's own rotation frame ---
  gctx.save();
  gctx.rotate(h.localCutAngle);
  gctx.beginPath();
  const big = r*8;
  if(h.side>0) gctx.rect(0,-big,big,big*2);
  else gctx.rect(-big,-big,big,big*2);
  gctx.rotate(-h.localCutAngle);
  gctx.clip();
  renderFruitBody(gctx, h.obj.type, r, 1);
  gctx.restore();

  // --- exposed juicy cross-section right on the cut edge ---
  gctx.save();
  gctx.rotate(h.localCutAngle);
  const edgeX = h.side>0 ? r*0.05 : -r*0.05;
  const faceW = r*0.22;
  gctx.beginPath();
  gctx.ellipse(edgeX, 0, faceW, r*0.99, 0, 0, Math.PI*2);
  const fleshGrad = gctx.createLinearGradient(edgeX-faceW,0,edgeX+faceW,0);
  fleshGrad.addColorStop(0, 'rgba(0,0,0,0.28)');
  fleshGrad.addColorStop(0.5, h.obj.type.flesh);
  fleshGrad.addColorStop(1, 'rgba(255,255,255,0.4)');
  gctx.fillStyle = fleshGrad;
  gctx.fill();
  gctx.save();
  gctx.clip();
  gctx.fillStyle = h.obj.type.seedColor || 'rgba(60,20,10,0.35)';
  for(const sy of h.seedDots){
    gctx.beginPath();
    gctx.ellipse(edgeX, sy, r*0.045, r*0.085, 0, 0, Math.PI*2);
    gctx.fill();
  }
  gctx.restore();
  // rim highlight where flesh meets skin
  gctx.strokeStyle = 'rgba(255,255,255,0.5)';
  gctx.lineWidth = r*0.03;
  gctx.stroke();
  gctx.restore();

  gctx.restore();
}

function drawSlashFlashes(){
  for(const s of slashFlashes){
    const t = s.age/s.life;
    const alpha = 1-t;
    gctx.save();
    gctx.globalAlpha = alpha;
    gctx.translate(s.x, s.y);
    gctx.rotate(s.angle);
    const grad = gctx.createLinearGradient(-s.len/2,0,s.len/2,0);
    grad.addColorStop(0,'rgba(255,255,255,0)');
    grad.addColorStop(0.5,'rgba(255,255,255,0.95)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    gctx.strokeStyle = grad;
    gctx.lineWidth = 5*(1-t)+1.5;
    gctx.shadowColor='rgba(255,255,255,0.9)';
    gctx.shadowBlur = 16;
    gctx.beginPath();
    gctx.moveTo(-s.len/2,0);
    gctx.lineTo(s.len/2,0);
    gctx.stroke();
    gctx.restore();
  }
}

function drawRings(){
  for(const r of rings){
    const t = r.age/r.life;
    const eased = 1-Math.pow(1-t,3);
    const rad = r.maxR*eased;
    gctx.save();
    gctx.globalAlpha = (1-t)*0.55;
    gctx.strokeStyle = r.color;
    gctx.lineWidth = 4*(1-t)+1;
    gctx.beginPath();
    gctx.arc(r.x, r.y, rad, 0, Math.PI*2);
    gctx.stroke();
    gctx.restore();
  }
}

function drawParticle(p){
  const alpha = 1 - p.t;
  fctx.save();
  fctx.globalAlpha = clamp(alpha,0,1);
  fctx.translate(p.x,p.y);
  fctx.rotate(p.rot);
  if(p.type==='smoke'){
    fctx.beginPath();
    fctx.arc(0,0,p.r*(0.6+p.t*0.8),0,Math.PI*2);
    fctx.fillStyle = p.color;
    fctx.fill();
  } else if(p.type==='spark'){
    fctx.beginPath();
    fctx.arc(0,0,p.r*(1-p.t*0.6),0,Math.PI*2);
    fctx.fillStyle = p.color;
    fctx.shadowColor = p.color;
    fctx.shadowBlur = 8;
    fctx.fill();
  } else if(p.type==='chunk'){
    fctx.beginPath();
    fctx.arc(0,0,p.r*(1-p.t*0.3),0,Math.PI*2);
    fctx.fillStyle = p.color;
    fctx.fill();
  } else {
    fctx.beginPath();
    fctx.ellipse(0,0,p.r*(1-p.t*0.4),p.r*(1-p.t*0.4)*1.3,0,0,Math.PI*2);
    fctx.fillStyle = p.color;
    fctx.fill();
  }
  fctx.restore();
}

function drawTrail(){
  if(slashTrail.length<2) return;
  const now = performance.now();
  gctx.save();
  gctx.lineCap='round';
  gctx.lineJoin='round';
  for(let i=1;i<slashTrail.length;i++){
    const p0 = slashTrail[i-1], p1 = slashTrail[i];
    const age = (now-p1.t)/260;
    if(age>1) continue;
    const width = (1-age)*14+2;
    gctx.beginPath();
    gctx.moveTo(p0.x,p0.y);
    gctx.lineTo(p1.x,p1.y);
    const grad = gctx.createLinearGradient(p0.x,p0.y,p1.x,p1.y);
    grad.addColorStop(0,`rgba(255,255,255,${0.05})`);
    grad.addColorStop(1,`rgba(255,255,255,${(1-age)*0.9})`);
    gctx.strokeStyle = grad;
    gctx.lineWidth = width;
    gctx.shadowColor='rgba(255,255,255,0.6)';
    gctx.shadowBlur = 12;
    gctx.stroke();
  }
  gctx.restore();
  // trim old
  while(slashTrail.length && now-slashTrail[0].t>300) slashTrail.shift();
}

function drawFloatingTexts(){
  for(const f of floatingTexts){
    const alpha = 1-(f.age/f.life);
    gctx.save();
    gctx.globalAlpha = clamp(alpha,0,1);
    gctx.font = `800 ${f.size}px 'Segoe UI', sans-serif`;
    gctx.fillStyle = f.color;
    gctx.textAlign='center';
    gctx.strokeStyle='rgba(0,0,0,0.4)';
    gctx.lineWidth=4;
    gctx.strokeText(f.text, f.x, f.y);
    gctx.fillText(f.text, f.x, f.y);
    gctx.restore();
  }
}

function render(){
  gctx.clearRect(0,0,W,H);
  fctx.clearRect(0,0,W,H);

  // camera shake
  let ox=0,oy=0;
  if(shakeMag>0){
    ox = rand(-shakeMag,shakeMag);
    oy = rand(-shakeMag,shakeMag);
  }
  gctx.save();
  gctx.translate(ox,oy);

  for(const o of objects){
    if(o.sliced) continue;
    if(o.isBomb) drawBomb(o); else drawFruit(o);
  }
  drawRings();
  for(const h of slicedHalves) drawSlicedHalf(h);
  drawSlashFlashes();
  drawFloatingTexts();
  drawTrail();

  gctx.restore();

  for(const p of particles) drawParticle(p);
}

/* ============================= LOOP CONTROL ============================= */
function loop(ts){
  if(state==='playing'){
    const dt = Math.min((ts-lastTs)/1000, 0.033) || 0;
    lastTs = ts;
    update(dt);
    render();
  } else {
    lastTs = ts;
    render();
  }
  requestAnimationFrame(loop);
}

/* ============================= GAME FLOW ============================= */
function resetGame(){
  objects=[]; particles=[]; slicedHalves=[]; floatingTexts=[]; slashTrail=[]; slashFlashes=[]; rings=[];
  score=0; combo=0; comboTimer=0; maxCombo=0; lives=3;
  gameTime=0; spawnTimer=0.3;
  updateScoreUI();
  renderLives();
  document.getElementById('combo').classList.remove('show');
}

function startGame(){
  resetGame();
  state='playing';
  show('none');
}

function endGame(){
  state='over';
  const isBest = score>best;
  if(isBest){ best=score; localStorage.setItem('fruitSlicerBest', best); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent = best;
  document.getElementById('maxCombo').textContent = maxCombo;
  document.getElementById('newBestTag').classList.toggle('hidden', !isBest);
  show('over');
}

function show(which){
  document.getElementById('startScreen').classList.toggle('hidden', which!=='start');
  document.getElementById('pauseScreen').classList.toggle('hidden', which!=='pause');
  document.getElementById('overScreen').classList.toggle('hidden', which!=='over');
}
