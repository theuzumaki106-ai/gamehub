<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mic & Speaker Test</title>
<style>
:root{
  --bg:#0b0d12; --card:#12151c; --card2:#171b24; --line:#242a36;
  --text:#eef1f6; --sub:#8b93a3; --accent:#6ee7b7; --accent2:#60a5fa;
  --warn:#fbbf24; --danger:#f87171;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f8; --card:#ffffff; --card2:#f8f9fb; --line:#e5e7ee;
    --text:#12151c; --sub:#5c6472; --accent:#059669; --accent2:#2563eb;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; justify-content:center; padding:32px 16px;
}
.wrap{width:100%; max-width:480px;}
header{text-align:center; margin-bottom:24px;}
header h1{font-size:22px; margin:0 0 4px; letter-spacing:-0.02em;}
header p{color:var(--sub); font-size:14px; margin:0;}

.card{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line); border-radius:18px;
  padding:22px; margin-bottom:18px;
}
.card h2{
  font-size:14px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--sub); margin:0 0 16px; display:flex; align-items:center; gap:8px;
}
.card h2 .dot{width:8px; height:8px; border-radius:50%; background:var(--line);}
.card h2 .dot.on{background:var(--accent); box-shadow:0 0 8px var(--accent);}

/* Mic card */
.meter-outer{
  height:22px; border-radius:11px; background:var(--line); overflow:hidden;
  position:relative; margin-bottom:6px;
}
.meter-fill{
  height:100%; width:0%; border-radius:11px;
  background:linear-gradient(90deg,var(--accent2),var(--accent) 60%, var(--warn) 85%, var(--danger) 100%);
  transition:width 60ms linear;
}
.meter-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--sub); margin-bottom:18px;}

.wave{width:100%; height:70px; display:block; border-radius:10px; background:var(--line); margin-bottom:18px;}

.row{display:flex; gap:10px; flex-wrap:wrap;}
button{
  flex:1; min-width:120px; border:none; border-radius:12px; padding:13px 16px;
  font-size:14px; font-weight:600; cursor:pointer; transition:transform .08s ease, opacity .2s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
button:active{transform:scale(0.97);}
button:disabled{opacity:.45; cursor:not-allowed;}
.btn-primary{background:var(--accent); color:#06281c;}
.btn-secondary{background:var(--card2); color:var(--text); border:1px solid var(--line);}
.btn-danger{background:var(--danger); color:#2b0a08;}
.btn-secondary.active{background:var(--accent2); color:#08172d; border-color:var(--accent2);}

.status{font-size:13px; color:var(--sub); margin-top:12px; min-height:18px;}
.status.err{color:var(--danger);}
.status.ok{color:var(--accent);}

select{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--card2); color:var(--text); font-size:13px; margin-bottom:14px;
}

/* Speaker card */
.tone-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
.tone-btn{
  background:var(--card2); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:14px 8px; font-size:13px; font-weight:600; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; transition:all .15s;
}
.tone-btn span.freq{font-size:11px; color:var(--sub); font-weight:400;}
.tone-btn.active{background:var(--accent2); color:#08172d; border-color:var(--accent2);}

.slider-row{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.slider-row label{font-size:12px; color:var(--sub); width:60px;}
input[type=range]{
  flex:1; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--line); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:var(--accent2); cursor:pointer; border:2px solid var(--bg);
}

footer{text-align:center; font-size:11px; color:var(--sub); margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎙️ Mic & Speaker Test</h1>
    <p>Check your microphone input and speaker output</p>
  </header>

  <!-- MIC CARD -->
  <div class="card">
    <h2><span class="dot" id="micDot"></span>Microphone</h2>

    <select id="micSelect"><option>Default microphone</option></select>

    <canvas class="wave" id="wave"></canvas>

    <div class="meter-outer"><div class="meter-fill" id="meterFill"></div></div>
    <div class="meter-labels"><span>Silent</span><span id="dbLabel">-- dB</span><span>Peak</span></div>

    <div class="row">
      <button class="btn-primary" id="micStart">▶ Start Mic Test</button>
      <button class="btn-danger" id="micStop" disabled>■ Stop</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <button class="btn-secondary" id="listenToggle" disabled>🔊 Hear Yourself: Off</button>
    </div>
    <div class="slider-row" id="monitorVolRow" style="margin-top:12px; display:none;">
      <label>Playback</label>
      <input type="range" id="monitorVol" min="0" max="100" value="50">
      <span id="monitorVolVal" style="font-size:12px;color:var(--sub);width:32px;text-align:right">50%</span>
    </div>

    <div class="status" id="micStatus">Click "Start Mic Test" and allow microphone access.</div>
  </div>

  <!-- SPEAKER CARD -->
  <div class="card">
    <h2><span class="dot" id="spkDot"></span>Speakers</h2>

    <div class="tone-grid" id="toneGrid">
      <button class="tone-btn" data-freq="220">Low<span class="freq">220 Hz</span></button>
      <button class="tone-btn" data-freq="440">Mid<span class="freq">440 Hz</span></button>
      <button class="tone-btn" data-freq="1000">High<span class="freq">1 kHz</span></button>
    </div>

    <div class="slider-row">
      <label>Volume</label>
      <input type="range" id="volSlider" min="0" max="100" value="30">
      <span id="volVal" style="font-size:12px;color:var(--sub);width:32px;text-align:right">30%</span>
    </div>

    <div class="row" style="margin-top:14px;">
      <button class="btn-secondary" id="lrTest">L / R Channel Test</button>
      <button class="btn-danger" id="spkStop" disabled>■ Stop</button>
    </div>
    <div class="status" id="spkStatus">Pick a tone to test your speakers.</div>
  </div>

  <footer>Runs entirely in your browser — nothing is recorded or uploaded.</footer>
</div>

<script>
// ---------- Shared AudioContext ----------
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ---------- MIC TEST ----------
const micStart = document.getElementById('micStart');
const micStop = document.getElementById('micStop');
const micStatus = document.getElementById('micStatus');
const micDot = document.getElementById('micDot');
const meterFill = document.getElementById('meterFill');
const dbLabel = document.getElementById('dbLabel');
const micSelect = document.getElementById('micSelect');
const waveCanvas = document.getElementById('wave');
const waveCtx = waveCanvas.getContext('2d');

let micStream=null, micSource=null, analyser=null, rafId=null;
let monitorGain=null, isMonitoring=false;

const listenToggle = document.getElementById('listenToggle');
const monitorVolRow = document.getElementById('monitorVolRow');
const monitorVol = document.getElementById('monitorVol');
const monitorVolVal = document.getElementById('monitorVolVal');

monitorVol.addEventListener('input', ()=>{
  monitorVolVal.textContent = monitorVol.value+'%';
  if(monitorGain) monitorGain.gain.setTargetAtTime(monitorVol.value/100, getCtx().currentTime, 0.02);
});

listenToggle.addEventListener('click', ()=>{
  if(!micSource) return;
  const ctx = getCtx();
  if(!isMonitoring){
    monitorGain = ctx.createGain();
    monitorGain.gain.value = monitorVol.value/100;
    micSource.connect(monitorGain).connect(ctx.destination);
    isMonitoring = true;
    listenToggle.textContent = '🔊 Hear Yourself: On';
    listenToggle.classList.add('active');
    monitorVolRow.style.display = 'flex';
    micStatus.textContent = 'Live monitoring on — use headphones to avoid feedback/echo!';
    micStatus.className = 'status ok';
  }else{
    if(monitorGain){ monitorGain.disconnect(); monitorGain = null; }
    isMonitoring = false;
    listenToggle.textContent = '🔊 Hear Yourself: Off';
    listenToggle.classList.remove('active');
    monitorVolRow.style.display = 'none';
    micStatus.textContent = 'Listening… speak into your microphone.';
    micStatus.className = 'status ok';
  }
});

function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  waveCanvas.width = waveCanvas.clientWidth * dpr;
  waveCanvas.height = waveCanvas.clientHeight * dpr;
  waveCtx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);

async function listMics(){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d=>d.kind==='audioinput');
    if(mics.length){
      micSelect.innerHTML = mics.map((m,i)=>`<option value="${m.deviceId}">${m.label || 'Microphone '+(i+1)}</option>`).join('');
    }
  }catch(e){ /* labels may be empty before permission; fine */ }
}
listMics();

micStart.addEventListener('click', async ()=>{
  try{
    micStatus.textContent = 'Requesting microphone access…';
    micStatus.className = 'status';
    const deviceId = micSelect.value && micSelect.selectedOptions[0].value;
    const constraints = { audio: deviceId ? {deviceId:{exact:deviceId}} : true };
    micStream = await navigator.mediaDevices.getUserMedia(constraints);

    const ctx = getCtx();
    micSource = ctx.createMediaStreamSource(micStream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.6;
    micSource.connect(analyser);

    resizeCanvas();
    draw();

    micDot.classList.add('on');
    micStatus.textContent = 'Listening… speak into your microphone.';
    micStatus.classList.add('ok');
    micStart.disabled = true;
    micStop.disabled = false;
    listenToggle.disabled = false;
    listMics();
  }catch(err){
    micStatus.textContent = 'Microphone access denied or unavailable: ' + err.message;
    micStatus.classList.add('err');
  }
});

micStop.addEventListener('click', stopMic);
function stopMic(){
  if(rafId) cancelAnimationFrame(rafId);
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(monitorGain){ monitorGain.disconnect(); monitorGain = null; }
  isMonitoring = false;
  listenToggle.textContent = '🔊 Hear Yourself: Off';
  listenToggle.classList.remove('active');
  listenToggle.disabled = true;
  monitorVolRow.style.display = 'none';
  micStream = null; analyser = null; micSource = null;
  meterFill.style.width = '0%';
  dbLabel.textContent = '-- dB';
  waveCtx.clearRect(0,0,waveCanvas.width,waveCanvas.height);
  micDot.classList.remove('on');
  micStatus.textContent = 'Mic test stopped.';
  micStatus.className = 'status';
  micStart.disabled = false;
  micStop.disabled = true;
}

function draw(){
  if(!analyser) return;
  rafId = requestAnimationFrame(draw);

  const bufferLength = analyser.fftSize;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteTimeDomainData(dataArray);

  // RMS -> level
  let sum = 0;
  for(let i=0;i<bufferLength;i++){
    const v = (dataArray[i]-128)/128;
    sum += v*v;
  }
  const rms = Math.sqrt(sum/bufferLength);
  const level = Math.min(1, rms*3.2);
  meterFill.style.width = (level*100).toFixed(0)+'%';

  const db = rms>0 ? (20*Math.log10(rms)).toFixed(0) : '-∞';
  dbLabel.textContent = db + ' dB';

  // waveform
  const w = waveCanvas.clientWidth, h = waveCanvas.clientHeight;
  waveCtx.clearRect(0,0,w,h);
  waveCtx.lineWidth = 2;
  waveCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim();
  waveCtx.beginPath();
  const slice = w / bufferLength;
  let x = 0;
  for(let i=0;i<bufferLength;i++){
    const v = dataArray[i]/128.0;
    const y = v*h/2;
    if(i===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
    x += slice;
  }
  waveCtx.stroke();
}

// ---------- SPEAKER TEST ----------
const toneGrid = document.getElementById('toneGrid');
const spkStop = document.getElementById('spkStop');
const spkStatus = document.getElementById('spkStatus');
const spkDot = document.getElementById('spkDot');
const volSlider = document.getElementById('volSlider');
const volVal = document.getElementById('volVal');
const lrTest = document.getElementById('lrTest');

let oscNode=null, gainNode=null, pannerNode=null, activeBtn=null, lrTimer=null;

volSlider.addEventListener('input', ()=>{
  volVal.textContent = volSlider.value+'%';
  if(gainNode) gainNode.gain.setTargetAtTime(volSlider.value/100*0.3, getCtx().currentTime, 0.02);
});

function stopTone(){
  if(oscNode){ try{oscNode.stop();}catch(e){} oscNode.disconnect(); oscNode=null; }
  if(gainNode){ gainNode.disconnect(); gainNode=null; }
  if(pannerNode){ pannerNode.disconnect(); pannerNode=null; }
  if(lrTimer){ clearTimeout(lrTimer); lrTimer=null; }
  if(activeBtn){ activeBtn.classList.remove('active'); activeBtn=null; }
  spkDot.classList.remove('on');
  spkStop.disabled = true;
}

function playTone(freq, pan=0){
  stopTone();
  const ctx = getCtx();
  oscNode = ctx.createOscillator();
  gainNode = ctx.createGain();
  pannerNode = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

  oscNode.type = 'sine';
  oscNode.frequency.value = freq;
  gainNode.gain.value = volSlider.value/100*0.3;

  if(pannerNode){
    pannerNode.pan.value = pan;
    oscNode.connect(gainNode).connect(pannerNode).connect(ctx.destination);
  }else{
    oscNode.connect(gainNode).connect(ctx.destination);
  }
  oscNode.start();
  spkDot.classList.add('on');
  spkStop.disabled = false;
}

toneGrid.addEventListener('click', (e)=>{
  const btn = e.target.closest('.tone-btn');
  if(!btn) return;
  const freq = parseFloat(btn.dataset.freq);
  playTone(freq, 0);
  activeBtn = btn;
  btn.classList.add('active');
  spkStatus.textContent = 'Playing '+freq+' Hz tone — you should hear it evenly in both ears.';
  spkStatus.className = 'status ok';
});

lrTest.addEventListener('click', ()=>{
  spkStatus.textContent = 'Playing LEFT channel…';
  spkStatus.className = 'status ok';
  playTone(440, -1);
  lrTimer = setTimeout(()=>{
    spkStatus.textContent = 'Playing RIGHT channel…';
    playTone(440, 1);
    lrTimer = setTimeout(()=>{
      stopTone();
      spkStatus.textContent = 'Channel test complete.';
    }, 1600);
  }, 1600);
});

spkStop.addEventListener('click', ()=>{
  stopTone();
  spkStatus.textContent = 'Speaker test stopped.';
  spkStatus.className = 'status';
});

navigator.mediaDevices && navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener('devicechange', listMics);
</script>
</body>
</html>
