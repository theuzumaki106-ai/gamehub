<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<link rel="stylesheet" href="snake.css">
</head>
<body>
<div id="app">

  <div class="brand">
    <h1>Snake</h1>
    <span id="brandSub">setup</span>
  </div>

  <!-- STEP 1: BORDER -->
  <div class="screen active" id="screenBorder">
    <div class="panel">
      <p class="step-label">Step 1 of 2 — <b>Board edges</b></p>
      <div class="preview-wrap">
        <canvas id="previewCanvas1" width="400" height="260"></canvas>
      </div>
      <div class="opt-grid">
        <button class="opt-btn selected" id="borderOn" data-border="true">
          <span>🧱 With border</span>
          <span class="opt-sub">Hitting a wall ends the run</span>
        </button>
        <button class="opt-btn" id="borderOff" data-border="false">
          <span>🌀 No border</span>
          <span class="opt-sub">Snake wraps around the edge</span>
        </button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="toStep2">Next</button>
      </div>
    </div>
  </div>

  <!-- STEP 2: THEME + SPEED -->
  <div class="screen" id="screenSetup">
    <div class="panel">
      <p class="step-label">Step 2 of 2 — <b>Look &amp; feel</b></p>
      <div class="preview-wrap">
        <canvas id="previewCanvas2" width="400" height="260"></canvas>
      </div>

      <p class="step-label" style="margin-bottom:8px;">Theme</p>
      <div class="opt-grid themes" id="themeGrid"></div>

      <p class="step-label" style="margin:14px 0 8px 0;">Speed</p>
      <div class="opt-grid speeds" id="speedGrid"></div>

      <div class="legend">
        <span>🐀 +1</span>
        <span>🐹 +2</span>
        <span>🍀 -2</span>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="backToStep1">Back</button>
        <button class="btn btn-primary" id="startGame">Start game</button>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screenGame">
    <div class="hud">
      <div class="hud-stat">
        <span class="num" id="scoreNum">0</span>
        <span class="lbl">score</span>
      </div>
      <div class="hud-mid">
        <button class="hud-btn" id="pauseBtn" title="Pause">⏸</button>
        <button class="hud-btn" id="restartBtn" title="Restart">↺</button>
      </div>
      <div class="hud-stat" style="align-items:flex-end;">
        <span class="num" id="bestNum">0</span>
        <span class="lbl">best</span>
      </div>
    </div>

    <div id="gameStage">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div id="overlay">
        <h2 id="overlayTitle">Paused</h2>
        <p id="overlayText">Take your time.</p>
        <div class="btn-row">
          <button class="btn btn-primary" id="overlayPrimary">Resume</button>
          <button class="btn btn-ghost" id="overlaySecondary">Menu</button>
        </div>
      </div>
    </div>
    <p class="hint">Arrow keys or WASD also work · Tab away to auto-pause</p>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     THEMES — each grounded in a distinct little world
  ========================================================= */
  const THEMES = [
    {
      name:"Meadow",
      swatch:"#6FA85A",
      bgTop:"#EAF0DE", bgBottom:"#DCE8C8",
      board:"#E3ECD2",
      grid:"rgba(63,107,53,0.08)",
      border:"#3F6B35",
      snakeHead:"#3F6B35", snakeBody:"#6FA85A", snakeBodyAlt:"#89C46C",
      accent:"#E8B33D",
      danger:"#C1533F",
      text:"#2E4726",
      particle:"#E8B33D"
    },
    {
      name:"Blacklight",
      swatch:"#C6FF3D",
      bgTop:"#1B1035", bgBottom:"#120A24",
      board:"#180F2C",
      grid:"rgba(198,255,61,0.06)",
      border:"#FF3DA6",
      snakeHead:"#C6FF3D", snakeBody:"#8FE23D", snakeBodyAlt:"#5FBF3D",
      accent:"#FF3DA6",
      danger:"#FF3DA6",
      text:"#F2F0E9",
      particle:"#FF3DA6"
    },
    {
      name:"Terminal",
      swatch:"#39FF6A",
      bgTop:"#071B0F", bgBottom:"#04120A",
      board:"#0A2413",
      grid:"rgba(57,255,106,0.07)",
      border:"#FFB000",
      snakeHead:"#39FF6A", snakeBody:"#2ACB55", snakeBodyAlt:"#1FA045",
      accent:"#FFB000",
      danger:"#FF4E3A",
      text:"#D7FFE0",
      particle:"#FFB000"
    },
    {
      name:"Coral Reef",
      swatch:"#FF7A59",
      bgTop:"#04303F", bgBottom:"#02202B",
      board:"#053547",
      grid:"rgba(242,200,121,0.07)",
      border:"#F2C879",
      snakeHead:"#FF7A59", snakeBody:"#FF9B7A", snakeBodyAlt:"#FFBE9E",
      accent:"#F2C879",
      danger:"#FF4E6A",
      text:"#E7F6FA",
      particle:"#F2C879"
    },
    {
      name:"Dune",
      swatch:"#E8A650",
      bgTop:"#2B1B2E", bgBottom:"#3A2233",
      board:"#3A2436",
      grid:"rgba(232,166,80,0.07)",
      border:"#5B8C5A",
      snakeHead:"#E8A650", snakeBody:"#D4823A", snakeBodyAlt:"#C46B2E",
      accent:"#5B8C5A",
      danger:"#C4443A",
      text:"#F6E9D8",
      particle:"#5B8C5A"
    }
  ];

  const SPEEDS = [
    {name:"Chill", sub:"6 / sec", interval:165},
    {name:"Normal", sub:"9 / sec", interval:110},
    {name:"Turbo", sub:"14 / sec", interval:72}
  ];

  const FOOD_TYPES = {
    small:{emoji:"🐀", points:1, weight:60, growth:1},
    big:{emoji:"🐹", points:2, weight:25, growth:2},
    bad:{emoji:"🍀", points:-2, weight:15, growth:-2}
  };

  const COLS = 20, ROWS = 20;

  /* =========================================================
     STATE
  ========================================================= */
  const state = {
    border:true,
    themeIndex:0,
    speedIndex:1,
    running:false,
    paused:false,
    pausedByVisibility:false,
    score:0,
    best:0,
    snake:[],        // logical segments {x,y}
    prevSnake:[],     // previous tick positions for interpolation
    growPending:0,
    dir:{x:1,y:0},
    nextDir:{x:1,y:0},
    dirQueue:[],
    food:null,        // {x,y,type}
    ghosts:[],         // fading removed segments {x,y,born}
    particles:[],       // burst particles
    floaters:[],          // floating +1/-2 text
    shake:0,
    tickAcc:0,
    lastTs:0,
    gameOver:false
  };

  function theme(){ return THEMES[state.themeIndex]; }
  function speed(){ return SPEEDS[state.speedIndex]; }

  /* =========================================================
     PERSISTED BEST SCORE
  ========================================================= */
  async function loadBest(){
    try{
      const res = await window.storage.get('snake-best-score');
      if(res && res.value){ state.best = parseInt(res.value,10) || 0; }
    }catch(e){ /* no record yet */ }
    bestNum.textContent = state.best;
  }
  async function saveBest(){
    try{ await window.storage.set('snake-best-score', String(state.best)); }
    catch(e){ /* storage unavailable, ignore */ }
  }

  /* =========================================================
     DOM
  ========================================================= */
  const screenBorder = document.getElementById('screenBorder');
  const screenSetup = document.getElementById('screenSetup');
  const screenGame = document.getElementById('screenGame');
  const brandSub = document.getElementById('brandSub');

  const previewCanvas1 = document.getElementById('previewCanvas1');
  const previewCanvas2 = document.getElementById('previewCanvas2');
  const gameCanvas = document.getElementById('gameCanvas');
  const ctx1 = previewCanvas1.getContext('2d');
  const ctx2 = previewCanvas2.getContext('2d');
  const gctx = gameCanvas.getContext('2d');

  const borderOn = document.getElementById('borderOn');
  const borderOff = document.getElementById('borderOff');
  const toStep2 = document.getElementById('toStep2');
  const backToStep1 = document.getElementById('backToStep1');
  const startGame = document.getElementById('startGame');
  const themeGrid = document.getElementById('themeGrid');
  const speedGrid = document.getElementById('speedGrid');

  const scoreNum = document.getElementById('scoreNum');
  const bestNum = document.getElementById('bestNum');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayPrimary = document.getElementById('overlayPrimary');
  const overlaySecondary = document.getElementById('overlaySecondary');

  function showScreen(id){
    [screenBorder,screenSetup,screenGame].forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    brandSub.textContent = id==='screenBorder' ? 'setup · 1 of 2'
      : id==='screenSetup' ? 'setup · 2 of 2' : 'playing';
  }

  /* =========================================================
     BUILD OPTION GRIDS
  ========================================================= */
  THEMES.forEach((t,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (i===0?' selected':'');
    b.innerHTML = `<span class="swatch" style="background:${t.swatch}"></span><span>${t.name}</span>`;
    b.addEventListener('click', ()=>{
      state.themeIndex = i;
      [...themeGrid.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
    });
    themeGrid.appendChild(b);
  });

  SPEEDS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (i===1?' selected':'');
    b.innerHTML = `<span>${s.name}</span><span class="opt-sub">${s.sub}</span>`;
    b.addEventListener('click', ()=>{
      state.speedIndex = i;
      [...speedGrid.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
    });
    speedGrid.appendChild(b);
  });

  borderOn.addEventListener('click', ()=>{
    state.border = true;
    borderOn.classList.add('selected'); borderOff.classList.remove('selected');
  });
  borderOff.addEventListener('click', ()=>{
    state.border = false;
    borderOff.classList.add('selected'); borderOn.classList.remove('selected');
  });

  toStep2.addEventListener('click', ()=> showScreen('screenSetup'));
  backToStep1.addEventListener('click', ()=> showScreen('screenBorder'));
  startGame.addEventListener('click', ()=>{
    showScreen('screenGame');
    initGame();
  });

  /* =========================================================
     PREVIEW ANIMATION (setup screens) — idle looping demo
  ========================================================= */
  function drawBackdrop(ctx,w,h,t){
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,t.bgTop);
    g.addColorStop(1,t.bgBottom);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
  }

  function roundedRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  let previewT = 0;
  const previewPath = [];
  (function buildLoopPath(){
    // a simple rectangular loop path in a small 8x5 sub-grid for the preview
    const w=9,h=6, ox=1, oy=1;
    for(let x=0;x<w;x++) previewPath.push({x:ox+x,y:oy});
    for(let y=1;y<h;y++) previewPath.push({x:ox+w-1,y:oy+y});
    for(let x=w-2;x>=0;x--) previewPath.push({x:ox+x,y:oy+h-1});
    for(let y=h-2;y>0;y--) previewPath.push({x:ox,y:oy+y});
  })();

  function renderPreview(ctx, w, h, showBorder){
    const t = theme();
    drawBackdrop(ctx,w,h,t);
    const cell = 22;
    const gx = 12, gy = 10;
    const cols = 11, rows = 8;

    // board
    ctx.fillStyle = t.board;
    roundedRect(ctx, gx, gy, cols*cell, rows*cell, 10);
    ctx.fill();

    if(showBorder){
      ctx.strokeStyle = t.border;
      ctx.lineWidth = 3;
      roundedRect(ctx, gx+1.5, gy+1.5, cols*cell-3, rows*cell-3, 9);
      ctx.stroke();
    } else {
      ctx.setLineDash([6,6]);
      ctx.strokeStyle = t.grid.replace(/[\d.]+\)$/,'0.35)');
      ctx.lineWidth = 2;
      roundedRect(ctx, gx+1.5, gy+1.5, cols*cell-3, rows*cell-3, 9);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // moving snake along loop path
    const speedFactor = 0.09;
    previewT += speedFactor;
    const len = previewPath.length;
    const segCount = 7;
    ctx.save();
    ctx.beginPath();
    roundedRect(ctx, gx, gy, cols*cell, rows*cell, 10);
    ctx.clip();

    for(let i=segCount-1;i>=0;i--){
      const idx = (Math.floor(previewT) - i + len*100) % len;
      const p = previewPath[idx];
      const cx = gx + p.x*cell + cell/2;
      const cy = gy + p.y*cell + cell/2;
      const isHead = i===0;
      ctx.fillStyle = isHead ? t.snakeHead : (i%2===0? t.snakeBody : t.snakeBodyAlt);
      ctx.beginPath();
      ctx.arc(cx, cy, cell*0.38, 0, Math.PI*2);
      ctx.fill();
      if(isHead){
        ctx.fillStyle = t.board;
        ctx.beginPath(); ctx.arc(cx+4,cy-3,1.6,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+4,cy+3,1.6,0,Math.PI*2); ctx.fill();
      }
    }
    // little food
    const foodIdx = Math.floor(len*0.55);
    const fp = previewPath[foodIdx];
    ctx.font = (cell*0.7)+"px sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("🐀", gx+fp.x*cell+cell/2, gy+fp.y*cell+cell/2+1);
    ctx.restore();
  }

  function previewLoop(){
    if(screenBorder.classList.contains('active')){
      renderPreview(ctx1, previewCanvas1.width, previewCanvas1.height, state.border);
    } else if(screenSetup.classList.contains('active')){
      renderPreview(ctx2, previewCanvas2.width, previewCanvas2.height, state.border);
    }
    requestAnimationFrame(previewLoop);
  }
  requestAnimationFrame(previewLoop);

  /* =========================================================
     GAME LOGIC
  ========================================================= */
  function spawnFood(){
    let x,y,collides;
    do{
      x = Math.floor(Math.random()*COLS);
      y = Math.floor(Math.random()*ROWS);
      collides = state.snake.some(s=>s.x===x&&s.y===y);
    } while(collides);

    const roll = Math.random()*100;
    let type = 'small';
    if(roll < FOOD_TYPES.bad.weight) type='bad';
    else if(roll < FOOD_TYPES.bad.weight + FOOD_TYPES.big.weight) type='big';
    else type='small';

    state.food = {x,y,type,born:performance.now(),pulse:0};
  }

  function initGame(){
    const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    state.snake = [ {x:cx-1,y:cy}, {x:cx-2,y:cy}, {x:cx-3,y:cy} ];
    state.prevSnake = state.snake.map(s=>({...s}));
    state.dir = {x:1,y:0};
    state.nextDir = {x:1,y:0};
    state.dirQueue = [];
    state.growPending = 0;
    state.score = 0;
    state.ghosts = [];
    state.particles = [];
    state.floaters = [];
    state.shake = 0;
    state.gameOver = false;
    state.paused = false;
    state.running = true;
    state.tickAcc = 0;
    state.lastTs = performance.now();
    scoreNum.textContent = 0;
    overlay.classList.remove('show');
    pauseBtn.textContent = '⏸';
    spawnFood();
    requestAnimationFrame(gameLoop);
  }

  function endGame(){
    state.running = false;
    state.gameOver = true;
    if(state.score > state.best){
      state.best = state.score;
      bestNum.textContent = state.best;
      saveBest();
    }
    overlayTitle.textContent = 'Game over';
    overlayText.textContent = `You scored ${state.score}. Best is ${state.best}.`;
    overlayPrimary.textContent = 'Play again';
    overlaySecondary.textContent = 'Menu';
    overlay.classList.add('show');
  }

  function pauseGame(silent){
    if(!state.running || state.paused) return;
    state.paused = true;
    if(!silent){
      overlayTitle.textContent = 'Paused';
      overlayText.textContent = 'Take your time.';
      overlayPrimary.textContent = 'Resume';
      overlaySecondary.textContent = 'Menu';
    }
    overlay.classList.add('show');
    pauseBtn.textContent = '▶';
  }
  function resumeGame(){
    if(!state.running) return;
    state.paused = false;
    state.pausedByVisibility = false;
    overlay.classList.remove('show');
    pauseBtn.textContent = '⏸';
    state.lastTs = performance.now();
  }

  function setDirection(nx,ny){
    // prevent instant reverse using the last queued direction
    const last = state.dirQueue.length ? state.dirQueue[state.dirQueue.length-1] : state.dir;
    if(nx === -last.x && ny === -last.y) return;
    if(nx === last.x && ny === last.y) return;
    if(state.dirQueue.length < 2) state.dirQueue.push({x:nx,y:ny});
  }

  function tick(){
    if(state.dirQueue.length){
      state.dir = state.dirQueue.shift();
    }

    state.prevSnake = state.snake.map(s=>({...s}));

    const head = state.snake[0];
    let nx = head.x + state.dir.x;
    let ny = head.y + state.dir.y;

    if(state.border){
      if(nx<0 || nx>=COLS || ny<0 || ny>=ROWS){
        triggerDeath(); return;
      }
    } else {
      nx = (nx+COLS)%COLS;
      ny = (ny+ROWS)%ROWS;
    }

    // self collision (ignore the very tail cell if not growing this tick, since it will move away)
    const willGrow = state.growPending !== 0;
    const bodyToCheck = willGrow ? state.snake : state.snake.slice(0,-1);
    if(bodyToCheck.some(s=>s.x===nx && s.y===ny)){
      triggerDeath(); return;
    }

    state.snake.unshift({x:nx,y:ny,born:performance.now()});

    // food check
    if(state.food && state.food.x===nx && state.food.y===ny){
      handleEat(state.food);
      spawnFood();
    }

    if(state.growPending > 0){
      state.growPending--;
    } else if(state.growPending < 0){
      // shrink: remove tail extra + this normal step already "moves" it
      const removed = state.snake.pop();
      if(removed) addGhost(removed);
      state.growPending++;
    } else {
      const removed = state.snake.pop();
      if(removed) addGhost(removed);
    }

    // enforce minimum length of 3
    while(state.snake.length < 3){
      const tail = state.snake[state.snake.length-1];
      state.snake.push({x:tail.x,y:tail.y,born:performance.now()});
    }
  }

  function addGhost(seg){
    state.ghosts.push({x:seg.x,y:seg.y,born:performance.now(),dur:180});
  }

  function handleEat(food){
    const info = FOOD_TYPES[food.type];
    state.score = Math.max(0, state.score + info.points);
    scoreNum.textContent = state.score;
    state.growPending += info.growth;

    spawnParticles(food.x, food.y, info.points >= 0 ? theme().particle : theme().danger, info.points>=0?10:14);
    state.floaters.push({
      x:food.x, y:food.y,
      text:(info.points>0?'+':'')+info.points,
      born:performance.now(),
      color: info.points>=0? theme().accent : theme().danger
    });
    if(info.points < 0){ state.shake = 10; }
  }

  function spawnParticles(gx,gy,color,count){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 0.6 + Math.random()*1.6;
      state.particles.push({
        x:gx+0.5, y:gy+0.5,
        vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
        born:performance.now(), life:450+Math.random()*250,
        color
      });
    }
  }

  function triggerDeath(){
    spawnParticles(state.snake[0].x, state.snake[0].y, theme().danger, 22);
    state.shake = 16;
    endGame();
  }

  /* =========================================================
     RENDER
  ========================================================= */
  function cellSize(){ return gameCanvas.width / COLS; }

  function render(alpha){
    const t = theme();
    const w = gameCanvas.width, h = gameCanvas.height;
    const cs = cellSize();

    gctx.save();
    if(state.shake > 0.5){
      const dx = (Math.random()-0.5)*state.shake;
      const dy = (Math.random()-0.5)*state.shake;
      gctx.translate(dx,dy);
      state.shake *= 0.85;
    } else { state.shake = 0; }

    // backdrop
    const g = gctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,t.bgTop); g.addColorStop(1,t.bgBottom);
    gctx.fillStyle = g;
    gctx.fillRect(-20,-20,w+40,h+40);

    // board
    gctx.fillStyle = t.board;
    gctx.fillRect(0,0,w,h);

    // grid
    gctx.strokeStyle = t.grid;
    gctx.lineWidth = 1;
    for(let x=1;x<COLS;x++){
      gctx.beginPath(); gctx.moveTo(x*cs,0); gctx.lineTo(x*cs,h); gctx.stroke();
    }
    for(let y=1;y<ROWS;y++){
      gctx.beginPath(); gctx.moveTo(0,y*cs); gctx.lineTo(w,y*cs); gctx.stroke();
    }

    if(state.border){
      gctx.strokeStyle = t.border;
      gctx.lineWidth = 4;
      gctx.strokeRect(2,2,w-4,h-4);
    }

    // ghosts (shrink fade)
    const now = performance.now();
    state.ghosts = state.ghosts.filter(gh => now-gh.born < gh.dur);
    state.ghosts.forEach(gh=>{
      const p = 1 - (now-gh.born)/gh.dur;
      gctx.globalAlpha = p*0.8;
      gctx.fillStyle = t.danger;
      const cx = gh.x*cs+cs/2, cy = gh.y*cs+cs/2;
      gctx.beginPath(); gctx.arc(cx,cy,cs*0.4*p,0,Math.PI*2); gctx.fill();
      gctx.globalAlpha = 1;
    });

    // food
    if(state.food){
      const f = state.food;
      const info = FOOD_TYPES[f.type];
      const pulse = 1 + Math.sin(now/180)*0.08;
      const cx = f.x*cs+cs/2, cy = f.y*cs+cs/2;
      if(f.type==='bad'){
        gctx.beginPath();
        gctx.fillStyle = 'rgba(224,90,90,0.18)';
        gctx.arc(cx,cy,cs*0.62*pulse,0,Math.PI*2);
        gctx.fill();
      }
      gctx.font = (cs*0.82*pulse)+"px sans-serif";
      gctx.textAlign='center'; gctx.textBaseline='middle';
      gctx.fillText(info.emoji, cx, cy+1);
    }

    // snake — interpolate between prevSnake and snake using alpha
    const segs = state.snake;
    const prev = state.prevSnake;
    const n = segs.length;

    function interp(i){
      const cur = segs[i];
      const pv = prev[i] || prev[prev.length-1] || cur;
      // handle wrap-around interpolation gracefully by skipping large jumps
      let dx = cur.x - pv.x, dy = cur.y - pv.y;
      if(Math.abs(dx) > 1) dx = 0;
      if(Math.abs(dy) > 1) dy = 0;
      const ix = pv.x + dx*alpha;
      const iy = pv.y + dy*alpha;
      return {x:ix*cs+cs/2, y:iy*cs+cs/2};
    }

    // body first (draw tail to head so head sits on top)
    for(let i=n-1;i>=0;i--){
      const pos = interp(i);
      const isHead = i===0;
      const isTail = i===n-1;
      let scale = 1;
      const seg = segs[i];
      if(seg.born && now - seg.born < 140){
        scale = 0.4 + 0.6*((now-seg.born)/140);
      }
      const radius = cs*0.46*scale;

      if(isHead){
        gctx.fillStyle = t.snakeHead;
      } else {
        gctx.fillStyle = i%2===0 ? t.snakeBody : t.snakeBodyAlt;
      }
      gctx.beginPath();
      roundedRect(gctx, pos.x-radius, pos.y-radius, radius*2, radius*2, radius*0.6);
      gctx.fill();

      if(isHead){
        // eyes oriented with direction
        const dirx = state.dir.x, diry = state.dir.y;
        const ex = dirx*cs*0.16, ey = diry*cs*0.16;
        const perpx = -diry*cs*0.14, perpy = dirx*cs*0.14;
        gctx.fillStyle = t.board;
        [[-1,1]].forEach(()=>{});
        [1,-1].forEach(s=>{
          gctx.beginPath();
          gctx.arc(pos.x+ex+perpx*s, pos.y+ey+perpy*s, cs*0.09, 0, Math.PI*2);
          gctx.fill();
        });
      }
    }

    // particles
    state.particles = state.particles.filter(p => now-p.born < p.life);
    state.particles.forEach(p=>{
      const life = (now-p.born)/p.life;
      const px = (p.x + p.vx*life*3)*cs;
      const py = (p.y + p.vy*life*3)*cs;
      gctx.globalAlpha = 1-life;
      gctx.fillStyle = p.color;
      gctx.beginPath();
      gctx.arc(px,py,3*(1-life)+1.5,0,Math.PI*2);
      gctx.fill();
      gctx.globalAlpha = 1;
    });

    // floaters
    state.floaters = state.floaters.filter(f => now-f.born < 700);
    state.floaters.forEach(f=>{
      const life = (now-f.born)/700;
      gctx.globalAlpha = 1-life;
      gctx.fillStyle = f.color;
      gctx.font = "bold 16px sans-serif";
      gctx.textAlign='center';
      gctx.fillText(f.text, f.x*cs+cs/2, f.y*cs - life*26);
      gctx.globalAlpha = 1;
    });

    gctx.restore();
  }

  /* =========================================================
     MAIN LOOP
  ========================================================= */
  function gameLoop(ts){
    if(!screenGame.classList.contains('active')) return;
    requestAnimationFrame(gameLoop);

    if(!state.running || state.paused){
      render(1);
      return;
    }

    let dt = ts - state.lastTs;
    state.lastTs = ts;
    if(dt > 250) dt = 250; // clamp big jumps (tab switches)
    state.tickAcc += dt;

    const interval = speed().interval;
    let safety = 0;
    while(state.tickAcc >= interval && state.running && !state.paused && safety < 5){
      tick();
      state.tickAcc -= interval;
      safety++;
      if(!state.running) break;
    }

    render(state.running ? Math.min(1, state.tickAcc/interval) : 1);
  }

  /* =========================================================
     CONTROLS
  ========================================================= */
  window.addEventListener('keydown', (e)=>{
    if(!screenGame.classList.contains('active')) return;
    const k = e.key.toLowerCase();
    const map = {
      arrowup:[0,-1], w:[0,-1],
      arrowdown:[0,1], s:[0,1],
      arrowleft:[-1,0], a:[-1,0],
      arrowright:[1,0], d:[1,0]
    };
    if(map[k]){
      e.preventDefault();
      if(state.paused && state.running){ resumeGame(); }
      setDirection(map[k][0], map[k][1]);
    } else if(k===' '){
      e.preventDefault();
      if(state.running){ state.paused ? resumeGame() : pauseGame(); }
    }
  }, {passive:false});

  document.querySelectorAll('.dpad button[data-dir]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = btn.dataset.dir;
      const map = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
      if(state.paused && state.running){ resumeGame(); }
      setDirection(map[d][0], map[d][1]);
    });
  });

  pauseBtn.addEventListener('click', ()=>{
    if(!state.running) return;
    state.paused ? resumeGame() : pauseGame();
  });
  restartBtn.addEventListener('click', initGame);

  overlayPrimary.addEventListener('click', ()=>{
    if(state.gameOver){ initGame(); }
    else { resumeGame(); }
  });
  overlaySecondary.addEventListener('click', ()=>{
    state.running = false;
    overlay.classList.remove('show');
    showScreen('screenBorder');
  });

  // auto-pause on tab/window blur
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && state.running && !state.paused){
      state.pausedByVisibility = true;
      pauseGame(true);
      overlayTitle.textContent = 'Auto-paused';
      overlayText.textContent = 'You switched away — resume when ready.';
      overlayPrimary.textContent = 'Resume';
      overlaySecondary.textContent = 'Menu';
    }
  });
  window.addEventListener('blur', ()=>{
    if(state.running && !state.paused){
      state.pausedByVisibility = true;
      pauseGame(true);
      overlayTitle.textContent = 'Auto-paused';
      overlayText.textContent = 'You switched away — resume when ready.';
      overlayPrimary.textContent = 'Resume';
      overlaySecondary.textContent = 'Menu';
    }
  });

  loadBest();
})();
</script>
</body>
</html>
