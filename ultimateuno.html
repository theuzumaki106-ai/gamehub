<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate UNO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ultimate.css">
</head>
<body>
<div class="felt-noise"></div>

<!-- ===================== LANDING ===================== -->
<section id="landing" class="screen active">
  <div class="landing-inner">
    <div class="fan-cards">
      <div class="mini-card mc1"></div>
      <div class="mini-card mc2"></div>
      <div class="mini-card mc3"></div>
      <div class="mini-card mc4"></div>
    </div>
    <h1 class="logo font-display">ULTIMATE<br><span class="accent">UNO</span></h1>
    <div class="logo-dashes"><span></span><span></span><span></span><span></span></div>
    <p class="tagline">Slam it, skip it, reverse it. Four ways to play — one card left before someone yells across the table.</p>
    <button class="btn-play" id="btnGoSetup">Deal Me In</button>
  </div>
</section>

<!-- ===================== SETUP ===================== -->
<section id="setup" class="screen">
  <div class="setup-head">
    <h2 class="font-display">Set The Table</h2>
    <p>Pick your opponents and house rules.</p>
  </div>
  <div class="setup-wrap">
    <button class="btn-back" id="btnBackLanding">← Back</button>
    <div class="name-row">
      <div class="field">
        <label id="nameLabel">Your name</label>
        <input id="nameInput" type="text" maxlength="14" placeholder="e.g. Vishwajeet">
      </div>
      <div class="field hidden" id="opponentNameField">
        <label>Player 2 name</label>
        <input id="opponentNameInput" type="text" maxlength="14" placeholder="e.g. Player 2">
      </div>
    </div>

    <div class="setup-cols">
      <div>
        <p class="col-title">Choose your table</p>
        <div class="mode-grid" id="modeGrid"></div>
      </div>
      <div>
        <p class="col-title">Game mode</p>
        <div class="variant-grid" id="variantGrid"></div>
      </div>
    </div>

    <div class="setup-footer">
      <button class="btn-start" id="btnStart" disabled>Start Game</button>
    </div>
  </div>
</section>

<!-- ===================== GAME ===================== -->
<section id="game" class="screen">
  <div class="table-wrap">
    <div class="topbar">
      <span class="rule-chip" id="ruleChip">Original UNO</span>
      <button class="btn-quit" id="btnQuit">Leave Table</button>
    </div>
    <div class="table" id="table">
      <div class="opponents-row" id="opponentsRow"></div>

      <div class="center-area" id="centerArea">
        <div class="pile-stack" id="drawPile">
          <span class="pile-label">Draw</span>
          <div class="card card-back-face"><div class="back-oval"></div><span class="back-text">UNO</span></div>
          <div class="card card-back-face"><div class="back-oval"></div><span class="back-text">UNO</span></div>
        </div>
        <div class="center-info">
          <div class="direction-ind" id="directionInd">➤</div>
          <div class="color-dot" id="colorDot" style="background:var(--c-red);color:var(--c-red);"></div>
          <div class="turn-label" id="turnLabel">Your turn</div>
        </div>
        <div id="discardPile"><span class="pile-label">Discard</span></div>
      </div>

      <div class="player-zone">
        <div class="player-info">
          <div class="opp-avatar" id="playerAvatar">Y</div>
          <span class="opp-name" id="playerNameLabel">You</span>
        </div>
        <div class="hand" id="playerHand"></div>
      </div>
    </div>
  </div>
</section>

<div id="animLayer"></div>
<div id="bannerLayer"></div>

<footer style="text-align: center; padding: 20px; font-family: sans-serif; color: #ffffff;">
  <p style="margin: 0; font-size: 14px;">
    This code created by © <span style="color: #007bff;">Viswajeet Studio</span> ©
  </p>
</footer>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS
============================================================ */
const LIGHT_COLORS = ['red','yellow','green','blue'];
const DARK_COLORS  = ['pink','orange','purple','teal']; // paired index-wise with LIGHT_COLORS
const DOS_COLORS   = ['red','yellow','green','blue'];

const AI_NAMES = ['Kabir','Zara','Milo','Priya','Otto','Nina','Ravi','Suki','Bruno','Leah'];

const MODES = [
  {id:'p1v1',   label:'1 v 1',   sub:'Pass & play — a friend on this device', players:2, human2:true},
  {id:'p1vbot', label:'1 v Bot', sub:'You against a single AI opponent',       players:2, human2:false},
  {id:'p1v2',   label:'1 v 2',   sub:'You against two AI opponents',          players:3, human2:false},
  {id:'p1v3',   label:'1 v 3',   sub:'Full table — you against three AIs',    players:4, human2:false},
];

const VARIANTS = [
  {id:'original', label:'Original UNO', colors:['red','yellow','green','blue'],
    desc:'The classic. Numbers, Skip, Reverse, Draw Two, and Wilds.'},
  {id:'flip', label:'UNO Flip', colors:['red','yellow','green','blue'],
    desc:'Every card has a dark side. Play a Flip card and the whole table turns over.'},
  {id:'nomercy', label:"Show 'Em No Mercy", colors:['red','yellow','green','blue'],
    desc:'Draw cards stack, 7 swaps hands, 0 rotates every hand at the table. No mercy.'},
  {id:'dos', label:'UNO Dos', colors:['red','yellow','green','blue'],
    desc:'Two discard piles. Match by color or number to either one — dump twins together.'},
];

/* ============================================================
   APP / SETUP STATE
============================================================ */
const app = { mode:null, variant:null, playerName:'You', opponentName:'Player 2' };

function renderModeGrid(){
  const el = document.getElementById('modeGrid');
  el.innerHTML = '';
  MODES.forEach(m=>{
    const div = document.createElement('button');
    div.type='button';
    div.className='mode-card';
    div.dataset.id=m.id;
    div.innerHTML = `<div class="mode-icon">${m.players}p</div>
      <div><p class="mode-name">${m.label}</p><p class="mode-desc">${m.sub}</p></div>`;
    div.addEventListener('click',()=>{
      document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
      div.classList.add('selected');
      app.mode = m;
      document.getElementById('opponentNameField').classList.toggle('hidden', !m.human2);
      document.getElementById('nameLabel').textContent = m.human2 ? 'Player 1 name' : 'Your name';
      validateStart();
    });
    el.appendChild(div);
  });
}

function renderVariantGrid(){
  const el = document.getElementById('variantGrid');
  el.innerHTML = '';
  VARIANTS.forEach(v=>{
    const div = document.createElement('button');
    div.type='button';
    div.className='variant-card';
    div.dataset.id=v.id;
    const swatch = v.colors.map(c=>`<i style="background:var(--c-${c})"></i>`).join('');
    div.innerHTML = `<p class="variant-name">${v.label} <span class="variant-swatch">${swatch}</span></p>
      <p class="variant-desc">${v.desc}</p>`;
    div.addEventListener('click',()=>{
      document.querySelectorAll('.variant-card').forEach(c=>c.classList.remove('selected'));
      div.classList.add('selected');
      app.variant = v.id;
      validateStart();
    });
    el.appendChild(div);
  });
}

function validateStart(){
  const nameOk = document.getElementById('nameInput').value.trim().length>0;
  const opp2Ok = !app.mode || !app.mode.human2 || document.getElementById('opponentNameInput').value.trim().length>0;
  document.getElementById('btnStart').disabled = !(app.mode && app.variant && nameOk && opp2Ok);
}

document.getElementById('nameInput').addEventListener('input', validateStart);
document.getElementById('opponentNameInput').addEventListener('input', validateStart);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('btnGoSetup').addEventListener('click',()=>{
  renderModeGrid(); renderVariantGrid();
  showScreen('setup');
});
document.getElementById('btnBackLanding').addEventListener('click',()=>showScreen('landing'));

document.getElementById('btnStart').addEventListener('click',()=>{
  app.playerName = document.getElementById('nameInput').value.trim() || 'You';
  app.opponentName = document.getElementById('opponentNameInput').value.trim() || 'Player 2';
  startGame(app.mode, app.variant, app.playerName, app.opponentName);
  showScreen('game');
});

document.getElementById('btnQuit').addEventListener('click',()=>{
  if(confirm('Leave the table? Your game will be lost.')) showScreen('landing');
});

/* ============================================================
   CARD / DECK BUILDERS
============================================================ */
let uid = 0;
function nextId(){ return 'c'+(uid++); }

function buildStandardDeck(){
  const deck=[];
  LIGHT_COLORS.forEach(color=>{
    deck.push({id:nextId(),color,value:'0'});
    for(let n=1;n<=9;n++){deck.push({id:nextId(),color,value:String(n)});deck.push({id:nextId(),color,value:String(n)});}
    for(let i=0;i<2;i++){
      deck.push({id:nextId(),color,value:'skip'});
      deck.push({id:nextId(),color,value:'reverse'});
      deck.push({id:nextId(),color,value:'draw2'});
    }
  });
  for(let i=0;i<4;i++){
    deck.push({id:nextId(),color:'wild',value:'wild'});
    deck.push({id:nextId(),color:'wild',value:'wild4'});
  }
  return deck;
}

function buildFlipDeck(){
  const deck=[];
  LIGHT_COLORS.forEach((lc,idx)=>{
    const dc = DARK_COLORS[idx];
    const mk=(lv,dv)=>({id:nextId(), light:{color:lc,value:lv}, dark:{color:dc,value:dv}});
    deck.push(mk('0','0'));
    for(let n=1;n<=9;n++){deck.push(mk(String(n),String(n)));deck.push(mk(String(n),String(n)));}
    for(let i=0;i<2;i++){
      deck.push(mk('skip','skipAll'));
      deck.push(mk('reverse','reverse'));
      deck.push(mk('draw1','draw5'));
    }
  });
  for(let i=0;i<4;i++){
    deck.push({id:nextId(), light:{color:'wild',value:'wild'}, dark:{color:'wild',value:'wild'}});
    deck.push({id:nextId(), light:{color:'wild',value:'wildDraw2'}, dark:{color:'wild',value:'wildColor'}});
  }
  for(let i=0;i<4;i++){
    deck.push({id:nextId(), light:{color:'flip',value:'flip'}, dark:{color:'flip',value:'flip'}});
  }
  return deck;
}

function buildDosDeck(){
  const deck=[];
  DOS_COLORS.forEach(color=>{
    for(let n=1;n<=9;n++){deck.push({id:nextId(),color,value:String(n)});deck.push({id:nextId(),color,value:String(n)});}
    for(let i=0;i<2;i++){
      deck.push({id:nextId(),color,value:'skip'});
      deck.push({id:nextId(),color,value:'reverse'});
      deck.push({id:nextId(),color,value:'draw2'});
      deck.push({id:nextId(),color,value:'roll'});
    }
  });
  return deck;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ============================================================
   GAME STATE
============================================================ */
let G = null; // active game state

function startGame(mode, variantId, name1, name2){
  const n = mode.players;
  const players = [];
  players.push({id:0,name:name1,isBot:false,hand:[]});
  if(mode.human2){
    players.push({id:1,name:name2,isBot:false,hand:[]});
  } else {
    const shuffledNames = shuffle(AI_NAMES.slice());
    for(let i=1;i<n;i++) players.push({id:i,name:shuffledNames[i-1],isBot:true,hand:[]});
  }

  let deck;
  if(variantId==='flip') deck = buildFlipDeck();
  else if(variantId==='dos') deck = buildDosDeck();
  else deck = buildStandardDeck();
  shuffle(deck);

  G = {
    variant: variantId,
    players,
    deck,
    discard: [],
    direction: 1,
    currentIndex: 0,
    currentColor: null,
    currentSide: 'light', // flip only
    pendingDraw: 0,       // nomercy stacking
    pendingType: null,
    piles: variantId==='dos' ? [[],[]] : null,
    over: false,
    passOverlayShown: false,
  };

  // deal 7 each
  players.forEach(p=>{ for(let i=0;i<7;i++) p.hand.push(drawFromDeck()); });

  // flip first non-wild-ish/non-actionish card to start (keep simple: first card, resolve basic effects if needed)
  let starter = G.deck.pop();
  // avoid starting on a wild4/wildColor/roll-ish weirdness: reshuffle if problematic value
  let guard=0;
  while(guard<40 && isProblematicStarter(starter)){
    G.deck.unshift(starter);
    starter = G.deck.pop();
    guard++;
  }
  G.discard.push(starter);
  const face = getFace(starter);
  G.currentColor = face.color==='wild' ? LIGHT_COLORS[Math.floor(Math.random()*4)] : face.color;

  document.getElementById('ruleChip').textContent = VARIANTS.find(v=>v.id===variantId).label;
  document.getElementById('playerNameLabel').textContent = name1;
  document.getElementById('playerAvatar').textContent = name1[0].toUpperCase();

  removeEndOverlay();
  renderAll();
  maybeBotTurn();
}

function isProblematicStarter(card){
  const f = getFace(card);
  return ['wild4','wildColor','draw5','roll','wild','wildDraw2'].includes(f.value);
}

function drawFromDeck(){
  if(G.deck.length===0) reshuffleDiscardIntoDeck();
  return G.deck.pop();
}
function reshuffleDiscardIntoDeck(){
  if(G.discard.length<=1) { G.deck.push({id:nextId(),color:LIGHT_COLORS[0],value:'1'}); return; }
  const top = G.discard.pop();
  G.deck = shuffle(G.discard);
  G.discard = [top];
}

function getFace(card){
  if(G.variant==='flip') return card[G.currentSide];
  return card;
}
function topDiscard(pileIdx){
  if(G.variant==='dos') return G.piles[pileIdx][G.piles[pileIdx].length-1];
  return G.discard[G.discard.length-1];
}

/* ============================================================
   PLAYABILITY
============================================================ */
function isPlayable(card){
  if(G.variant==='dos'){
    return isPlayableDos(card,0) || isPlayableDos(card,1);
  }
  if(G.variant==='nomercy' && G.pendingDraw>0){
    const f = getFace(card);
    return ['draw2','wild4','wildDraw2','wildColor','draw5'].includes(f.value) && sameCategory(f.value,G.pendingType);
  }
  const top = topDiscard();
  const topFace = getFace(top);
  const f = getFace(card);
  if(f.color==='wild') return true;
  if(f.color==='flip') return true;
  if(f.color===G.currentColor) return true;
  if(f.value===topFace.value) return true;
  return false;
}
function sameCategory(a,b){
  const grp = v => (v==='draw2'||v==='wildDraw2') ? 'd2' : (v==='wild4'||v==='wildColor') ? 'd4' : v;
  return grp(a)===grp(b);
}
function isPlayableDos(card,pileIdx){
  const pile = G.piles[pileIdx];
  if(pile.length===0) return true;
  const top = pile[pile.length-1];
  return card.color===top.color || card.value===top.value;
}

/* ============================================================
   RENDERING
============================================================ */
const colorVar = c => `var(--c-${c==='wild'||c==='flip'?'red':c})`;

function cardSymbol(face){
  switch(face.value){
    case 'skip': return '🚫';
    case 'skipAll': return '🚫🚫';
    case 'reverse': return '⇄';
    case 'draw2': return '+2';
    case 'draw1': return '+1';
    case 'draw5': return '+5';
    case 'wild': return '★';
    case 'wild4': return '+4';
    case 'wildDraw2': return '+2';
    case 'wildColor': return '+4';
    case 'flip': return '⟲';
    case 'roll': return '⟲';
    default: return face.value;
  }
}

function makeCardEl(card, opts){
  opts = opts||{};
  const face = getFace(card);
  const el = document.createElement('div');
  const isWildish = face.color==='wild' || face.color==='flip';
  const colorClass = isWildish ? 'c-wild' : `c-${face.color}`;
  el.className = 'card '+colorClass;
  if(G.variant==='flip' && G.currentSide==='dark') el.classList.add('dark');
  el.dataset.id = card.id;
  const sym = cardSymbol(face);
  const wide = ['skipAll'].includes(face.value);

  if(isWildish){
    el.innerHTML = `
      <span class="corner tl">${sym}</span>
      <div class="card-circle"></div>
      <span class="card-symbol wild-symbol${wide?' small':''}">${sym}</span>
      <span class="corner br">${sym}</span>`;
  } else {
    el.innerHTML = `
      <span class="corner tl">${sym}</span>
      <div class="card-oval"></div>
      <span class="card-symbol${wide?' small':''}" style="color:${colorCss(face.color)}">${sym}</span>
      <span class="corner br">${sym}</span>`;
  }
  if(G.variant==='flip'){
    const icon = document.createElement('span');
    icon.className='side-icon';
    icon.textContent = G.currentSide==='light' ? '☀' : '🌙';
    el.appendChild(icon);
  }
  if(opts.faceDown){
    el.className = 'card card-back-face';
    el.innerHTML='<div class="back-oval"></div><span class="back-text">UNO</span>';
  }
  return el;
}

function renderAll(){
  renderOpponents();
  renderCenter();
  renderPlayerHand();
  renderTurnLabel();
}

function renderOpponents(){
  const row = document.getElementById('opponentsRow');
  row.innerHTML='';
  const others = G.players.filter(p=>p.id!==0);
  others.forEach(p=>{
    const div = document.createElement('div');
    div.className='opponent';
    div.id = 'opp-'+p.id;
    if(G.currentIndex===p.id && !G.over) div.classList.add('active-turn');
    const backs = Array.from({length:Math.min(p.hand.length,8)}).map(()=>'<div class="card-back"></div>').join('');
    div.innerHTML = `
      <div class="opp-avatar">${p.name[0].toUpperCase()}<span class="badge">${p.hand.length}</span></div>
      <div class="opp-name">${p.name}${p.isBot?' 🤖':''}</div>
      <div class="opp-hand">${backs}</div>
    `;
    row.appendChild(div);
  });
}

function renderCenter(){
  document.getElementById('directionInd').style.transform = G.direction===1 ? 'rotate(0deg)' : 'rotate(180deg)';
  const dot = document.getElementById('colorDot');

  if(G.variant==='dos'){
    document.getElementById('discardPile').innerHTML = '<span class="pile-label">Piles</span><div class="dos-piles" id="dosPiles"></div>';
    const wrap = document.getElementById('dosPiles');
    [0,1].forEach(i=>{
      const slot = document.createElement('div');
      slot.className='pile-stack dos-pile-slot';
      slot.dataset.pile=i;
      const top = G.piles[i][G.piles[i].length-1];
      if(top){ slot.appendChild(makeCardEl(top)); }
      else { slot.style.border='2px dashed rgba(255,255,255,0.2)'; slot.style.borderRadius='11px'; }
      wrap.appendChild(slot);
    });
    dot.style.display='none';
  } else {
    const holder = document.getElementById('discardPile');
    holder.innerHTML = '<span class="pile-label">Discard</span><div class="discard-slot" id="discardSlot"></div>';
    const top = topDiscard();
    if(top) document.getElementById('discardSlot').appendChild(makeCardEl(top));
    dot.style.display='block';
    const c = G.currentColor;
    const mapVar = {red:'var(--c-red)',yellow:'var(--c-yellow)',green:'var(--c-green)',blue:'var(--c-blue)',
      pink:'var(--f-pink)',orange:'var(--f-orange)',purple:'var(--f-purple)',teal:'var(--f-teal)'};
    dot.style.background = mapVar[c] || '#888';
    dot.style.color = mapVar[c] || '#888';
  }

  const draw = document.getElementById('drawPile');
  draw.classList.toggle('disabled', G.over);
}

function renderPlayerHand(){
  const hand = document.getElementById('playerHand');
  hand.innerHTML='';
  const me = G.players[0];
  me.hand.forEach(card=>{
    const el = makeCardEl(card);
    const playable = G.variant==='dos' ? (isPlayableDos(card,0)||isPlayableDos(card,1)) : isPlayable(card);
    if(!playable || G.over || G.currentIndex!==0) el.classList.add('unplayable');
    el.addEventListener('click',()=>onPlayerCardClick(card));
    hand.appendChild(el);
  });
}

function renderTurnLabel(){
  const label = document.getElementById('turnLabel');
  if(G.over){ label.textContent='Round over'; return; }
  const cur = G.players[G.currentIndex];
  label.textContent = cur.id===0 ? 'Your turn' : cur.name+"'s turn";
}

/* ============================================================
   BANNERS / FX
============================================================ */
function showBanner(text, cls){
  const layer = document.getElementById('bannerLayer');
  const b = document.createElement('div');
  b.className = 'banner '+cls;
  b.textContent = text;
  layer.appendChild(b);
  setTimeout(()=>b.remove(),1150);
}
function burstAt(x,y,text){
  const el = document.createElement('div');
  el.className='burst-label';
  el.style.left=(x-20)+'px';
  el.style.top=(y-20)+'px';
  el.textContent=text;
  document.getElementById('bannerLayer').appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function flashShake(playerId){
  const el = document.getElementById('opp-'+playerId);
  if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),450); }
}
function flipTableAnim(){
  const t = document.getElementById('table');
  t.classList.add('flipping');
  setTimeout(()=>t.classList.remove('flipping'),700);
}
function spinDirection(){
  const el = document.getElementById('directionInd');
  el.classList.add('spin');
  setTimeout(()=>el.classList.remove('spin'),500);
}

function throwCardAnimation(cardEl, fromRect, toRect, cb){
  const layer = document.getElementById('animLayer');
  const clone = cardEl.cloneNode(true);
  clone.style.position='absolute';
  clone.style.left=fromRect.left+'px';
  clone.style.top=fromRect.top+'px';
  clone.style.width=fromRect.width+'px';
  clone.style.height=fromRect.height+'px';
  clone.style.margin='0';
  layer.appendChild(clone);
  requestAnimationFrame(()=>{
    const dx = toRect.left - fromRect.left;
    const dy = toRect.top - fromRect.top;
    const rot = (Math.random()*30-15).toFixed(1);
    clone.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`;
  });
  setTimeout(()=>{ clone.remove(); if(cb) cb(); }, 520);
}

/* ============================================================
   TURN HELPERS
============================================================ */
function n(){ return G.players.length; }
function advance(steps){
  G.currentIndex = ((G.currentIndex + G.direction*steps) % n() + n()) % n();
}
function nextIdx(from,steps){
  steps = steps||1;
  return ((from + G.direction*steps) % n() + n()) % n();
}

function checkWin(player){
  if(player.hand.length===0){
    G.over = true;
    setTimeout(()=>showEndOverlay(player),650);
    return true;
  }
  return false;
}

function afterMoveContinue(){
  renderAll();
  if(!G.over) maybeBotTurn();
}

/* ============================================================
   PLAYING A CARD (standard / flip / nomercy)
============================================================ */
function onPlayerCardClick(card){
  if(G.over || G.currentIndex!==0) return;
  if(G.variant==='dos'){ handleDosCardClick(card); return; }
  if(!isPlayable(card)) return;
  const face = getFace(card);
  if(face.color==='wild'){
    openColorPicker(color=>{
      playCardCommon(0, card, color, document.querySelector(`.hand .card[data-id="${card.id}"]`));
    });
  } else {
    playCardCommon(0, card, null, document.querySelector(`.hand .card[data-id="${card.id}"]`));
  }
}

function playCardCommon(playerIdx, card, chosenColor, sourceEl){
  const player = G.players[playerIdx];
  const idxInHand = player.hand.findIndex(c=>c.id===card.id);
  if(idxInHand===-1) return;

  // animate throw if we have a source element
  const discardHolder = document.getElementById('discardPile');
  if(sourceEl){
    const fromRect = sourceEl.getBoundingClientRect();
    const toRect = discardHolder.getBoundingClientRect();
    throwCardAnimation(sourceEl, fromRect, toRect);
  }

  player.hand.splice(idxInHand,1);
  G.discard.push(card);
  const face = getFace(card);
  G.currentColor = face.color==='wild' ? chosenColor : (face.color==='flip' ? G.currentColor : face.color);

  setTimeout(()=>{
    resolveEffect(playerIdx, card, face, chosenColor);
  }, sourceEl?260:0);
}

function resolveEffect(playerIdx, card, face, chosenColor){
  if(checkWin(G.players[playerIdx])) { renderAll(); return; }
  if(G.players[playerIdx].hand.length===1) showBanner((playerIdx===0?app.playerName: G.players[playerIdx].name)+' — UNO!','uno');

  const target = nextIdx(playerIdx,1);
  const nomercy = G.variant==='nomercy';

  switch(face.value){
    case 'skip':
      showBanner('SKIP!','skip'); flashShake(G.players[target].id);
      G.currentIndex = nextIdx(playerIdx,2);
      break;
    case 'skipAll':
      showBanner('SKIP ALL!','skip');
      G.players.forEach(p=>{ if(p.id!==playerIdx) flashShake(p.id); });
      G.currentIndex = playerIdx; // same player goes again
      break;
    case 'reverse':
      G.direction *= -1; spinDirection(); showBanner('REVERSE!','reverse');
      G.currentIndex = n()===2 ? nextIdx(playerIdx,2) : nextIdx(playerIdx,1);
      break;
    case 'draw2':
    case 'wild4':
    case 'wildDraw2':
    case 'wildColor':
    case 'draw5': {
      const amount = face.value==='draw2'||face.value==='wildDraw2' ? 2 : (face.value==='draw5' ? 5 : 4);
      if(nomercy){
        G.pendingDraw += amount;
        G.pendingType = face.value;
        showBanner('+'+amount,'draw');
        G.currentIndex = target;
      } else {
        const t = G.players[target];
        for(let i=0;i<amount;i++) t.hand.push(drawFromDeck());
        showBanner('+'+amount,'draw');
        flashShake(t.id);
        G.currentIndex = nextIdx(playerIdx,2);
      }
      break;
    }
    case 'flip':
      G.currentSide = G.currentSide==='light' ? 'dark' : 'light';
      flipTableAnim(); showBanner('FLIP!','flip');
      G.currentIndex = target;
      break;
    case '7':
      if(nomercy){ promptSwap(playerIdx); return; }
      G.currentIndex = target;
      break;
    case '0':
      if(nomercy){ rotateHands(); }
      G.currentIndex = target;
      break;
    default:
      G.currentIndex = target;
  }
  afterMoveContinue();
}

function rotateHands(){
  showBanner('ROTATE!','flip');
  const hands = G.players.map(p=>p.hand);
  for(let i=0;i<n();i++){
    const fromIdx = ((i - G.direction) % n() + n()) % n();
    G.players[i].hand = hands[fromIdx];
  }
}

function promptSwap(playerIdx){
  // player 0 chooses an opponent to swap with; bots auto-pick the player with fewest cards
  if(playerIdx===0){
    const others = G.players.filter(p=>p.id!==0);
    const layer = document.getElementById('bannerLayer');
    const overlay = document.createElement('div');
    overlay.className='modal-overlay';
    overlay.innerHTML = `<div class="color-picker"><h3>Swap hands with…</h3><div class="swatches" id="swapChoices"></div></div>`;
    document.body.appendChild(overlay);
    const box = overlay.querySelector('#swapChoices');
    others.forEach(o=>{
      const b = document.createElement('button');
      b.className='btn-secondary';
      b.textContent = o.name+' ('+o.hand.length+')';
      b.addEventListener('click',()=>{
        const tmp = G.players[0].hand; G.players[0].hand = o.hand; o.hand = tmp;
        overlay.remove();
        showBanner('SWAPPED!','flip');
        G.currentIndex = nextIdx(playerIdx,1);
        afterMoveContinue();
      });
      box.appendChild(b);
    });
  } else {
    let target = G.players.filter(p=>p.id!==playerIdx).sort((a,b)=>a.hand.length-b.hand.length)[0];
    const tmp = G.players[playerIdx].hand; G.players[playerIdx].hand = target.hand; target.hand = tmp;
    showBanner('SWAPPED!','flip');
    G.currentIndex = nextIdx(playerIdx,1);
    afterMoveContinue();
  }
}

/* ---------- color picker ---------- */
function openColorPicker(cb){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  const colors = G.variant==='flip' && G.currentSide==='dark' ? DARK_COLORS : LIGHT_COLORS;
  overlay.innerHTML = `<div class="color-picker"><h3>Choose a color</h3><div class="swatches">
    ${colors.map(c=>`<button class="swatch" data-c="${c}" style="background:${colorCss(c)}"></button>`).join('')}
  </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click',()=>{ overlay.remove(); cb(sw.dataset.c); });
  });
}
function colorCss(c){
  const map = {red:'#ED1C24',yellow:'#FFD500',green:'#00A651',blue:'#0072BC',
    pink:'#E4007C',orange:'#F7941D',purple:'#92278F',teal:'#00A99D'};
  return map[c]||'#888';
}

/* ============================================================
   DRAW CARD (manual)
============================================================ */
document.getElementById('drawPile').addEventListener('click',()=>{
  if(G.over || G.currentIndex!==0) return;
  if(G.variant==='dos'){ dosDrawForCurrent(0); return; }
  handleDrawForPlayer(0);
});

function handleDrawForPlayer(playerIdx){
  const player = G.players[playerIdx];
  if(G.pendingDraw>0){
    for(let i=0;i<G.pendingDraw;i++) player.hand.push(drawFromDeck());
    burstAt(window.innerWidth/2, window.innerHeight/2, '+'+G.pendingDraw);
    G.pendingDraw = 0; G.pendingType=null;
    G.currentIndex = nextIdx(playerIdx,1);
    afterMoveContinue();
    return;
  }
  const card = drawFromDeck();
  player.hand.push(card);
  if(isPlayableForVariant(card)){
    // let them decide to play it (only for human); bots auto-handled elsewhere
    renderAll();
    return;
  }
  G.currentIndex = nextIdx(playerIdx,1);
  afterMoveContinue();
}
function isPlayableForVariant(card){
  return G.variant==='dos' ? (isPlayableDos(card,0)||isPlayableDos(card,1)) : isPlayable(card);
}

/* ============================================================
   DOS MODE HANDLERS
============================================================ */
let dosSelectedCard = null;
function handleDosCardClick(card){
  const p0 = document.querySelector('.dos-pile-slot[data-pile="0"]');
  const p1 = document.querySelector('.dos-pile-slot[data-pile="1"]');
  document.querySelectorAll('.pile-target').forEach(e=>e.classList.remove('pile-target'));
  const okA = isPlayableDos(card,0), okB = isPlayableDos(card,1);
  if(!okA && !okB) return;
  if(okA && !okB){ playDosCard(0, card, 0); return; }
  if(okB && !okA){ playDosCard(0, card, 1); return; }
  // both valid -> ask which pile
  dosSelectedCard = card;
  if(p0) p0.classList.add('pile-target');
  if(p1) p1.classList.add('pile-target');
  const handler = (pileIdx)=>{
    document.querySelectorAll('.pile-target').forEach(e=>e.classList.remove('pile-target'));
    playDosCard(0, card, pileIdx);
    p0 && p0.removeEventListener('click',h0);
    p1 && p1.removeEventListener('click',h1);
  };
  const h0=()=>handler(0), h1=()=>handler(1);
  p0 && p0.addEventListener('click',h0,{once:true});
  p1 && p1.addEventListener('click',h1,{once:true});
}

function playDosCard(playerIdx, card, pileIdx){
  const player = G.players[playerIdx];
  const idx = player.hand.findIndex(c=>c.id===card.id);
  if(idx===-1) return;
  const sourceEl = document.querySelector(`.hand .card[data-id="${card.id}"]`) || document.querySelector(`[data-id="${card.id}"]`);
  const pileEl = document.querySelector(`.dos-pile-slot[data-pile="${pileIdx}"]`);
  if(sourceEl && pileEl){
    throwCardAnimation(sourceEl, sourceEl.getBoundingClientRect(), pileEl.getBoundingClientRect());
  }
  player.hand.splice(idx,1);
  G.piles[pileIdx].push(card);

  // auto-dump exact duplicates left in hand (Dos combo flavor)
  let twins = player.hand.filter(c=>c.value===card.value);
  twins.forEach(t=>{
    const ti = player.hand.findIndex(c=>c.id===t.id);
    if(ti>-1){ player.hand.splice(ti,1); G.piles[pileIdx].push(t); }
  });
  if(twins.length) showBanner('COMBO x'+(twins.length+1),'flip');

  setTimeout(()=>{
    if(checkWin(player)){ renderAll(); return; }
    if(player.hand.length===1) showBanner((playerIdx===0?app.playerName:player.name)+' — DOS!','uno');
    const target = nextIdx(playerIdx,1);
    switch(card.value){
      case 'skip':
        showBanner('SKIP!','skip'); flashShake(G.players[target].id);
        G.currentIndex = nextIdx(playerIdx,2);
        break;
      case 'reverse':
        G.direction*=-1; spinDirection(); showBanner('REVERSE!','reverse');
        G.currentIndex = n()===2 ? nextIdx(playerIdx,2) : nextIdx(playerIdx,1);
        break;
      case 'draw2': {
        const t = G.players[target];
        for(let i=0;i<2;i++) t.hand.push(drawFromDeck());
        showBanner('+2','draw'); flashShake(t.id);
        G.currentIndex = nextIdx(playerIdx,2);
        break;
      }
      case 'roll': {
        let opp;
        if(playerIdx===0){
          opp = G.players.filter(p=>p.id!==0).sort((a,b)=>b.hand.length-a.hand.length)[0];
        } else {
          opp = G.players[0];
        }
        const tmp = player.hand; player.hand = opp.hand; opp.hand = tmp;
        showBanner('ROLL!','flip');
        G.currentIndex = target;
        break;
      }
      default:
        G.currentIndex = target;
    }
    afterMoveContinue();
  }, sourceEl?280:0);
}

function dosDrawForCurrent(playerIdx){
  const player = G.players[playerIdx];
  const card = drawFromDeck();
  player.hand.push(card);
  if(isPlayableDos(card,0)||isPlayableDos(card,1)){ renderAll(); return; }
  G.currentIndex = nextIdx(playerIdx,1);
  afterMoveContinue();
}

/* ============================================================
   BOT LOGIC
============================================================ */
function maybeBotTurn(){
  if(G.over) return;
  const cur = G.players[G.currentIndex];
  if(!cur.isBot) {
    // nomercy pending draw auto-handling banner cue for human handled via draw pile click
    renderAll();
    return;
  }
  renderAll();
  setTimeout(()=>runBotTurn(cur.id), 850);
}

function runBotTurn(playerIdx){
  if(G.over) return;
  const player = G.players[playerIdx];

  if(G.variant==='dos'){
    botDosTurn(playerIdx);
    return;
  }

  if(G.variant==='nomercy' && G.pendingDraw>0){
    const stackCard = player.hand.find(c=>{
      const f=getFace(c);
      return ['draw2','wild4','wildDraw2','wildColor','draw5'].includes(f.value) &&
             (f.value===G.pendingType || sameCategory(f.value,G.pendingType));
    });
    if(stackCard){
      const f = getFace(stackCard);
      const color = f.color==='wild' ? pickBotColor(player) : null;
      playCardCommon(playerIdx, stackCard, color, findOpponentBackEl(playerIdx));
      return;
    } else {
      for(let i=0;i<G.pendingDraw;i++) player.hand.push(drawFromDeck());
      burstAtOpponent(playerIdx, '+'+G.pendingDraw);
      G.pendingDraw=0; G.pendingType=null;
      G.currentIndex = nextIdx(playerIdx,1);
      afterMoveContinue();
      return;
    }
  }

  const playable = player.hand.filter(c=>isPlayable(c));
  if(playable.length===0){
    const card = drawFromDeck();
    player.hand.push(card);
    if(isPlayable(card)){
      setTimeout(()=>{
        const f=getFace(card);
        const color = f.color==='wild' ? pickBotColor(player) : null;
        playCardCommon(playerIdx, card, color, findOpponentBackEl(playerIdx));
      },500);
    } else {
      G.currentIndex = nextIdx(playerIdx,1);
      afterMoveContinue();
    }
    return;
  }
  // prefer non-wild matches, save wilds
  playable.sort((a,b)=>{
    const fa=getFace(a), fb=getFace(b);
    const aw = fa.color==='wild'?1:0, bw = fb.color==='wild'?1:0;
    return aw-bw;
  });
  const chosen = playable[0];
  const f = getFace(chosen);
  const color = f.color==='wild' ? pickBotColor(player) : null;
  playCardCommon(playerIdx, chosen, color, findOpponentBackEl(playerIdx));
}

function pickBotColor(player){
  const counts = {};
  const cols = G.variant==='flip' ? (G.currentSide==='light'?LIGHT_COLORS:DARK_COLORS) : LIGHT_COLORS;
  cols.forEach(c=>counts[c]=0);
  player.hand.forEach(c=>{ const f=getFace(c); if(cols.includes(f.color)) counts[f.color]++; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

function findOpponentBackEl(playerIdx){
  const el = document.getElementById('opp-'+playerIdx);
  return el ? el.querySelector('.card-back') || el.querySelector('.opp-avatar') : null;
}
function burstAtOpponent(playerIdx, text){
  const el = document.getElementById('opp-'+playerIdx);
  if(el){ const r = el.getBoundingClientRect(); burstAt(r.left+r.width/2, r.top, text); }
}

function botDosTurn(playerIdx){
  const player = G.players[playerIdx];
  let played = false;
  for(const c of player.hand){
    if(isPlayableDos(c,0)){ playDosCard(playerIdx,c,0); played=true; break; }
    if(isPlayableDos(c,1)){ playDosCard(playerIdx,c,1); played=true; break; }
  }
  if(!played){ dosDrawForCurrent(playerIdx); }
}

/* ============================================================
   END OF ROUND
============================================================ */
function showEndOverlay(winner){
  showBanner((winner.id===0?app.playerName:winner.name)+' WINS!','win');
  const overlay = document.createElement('div');
  overlay.className='end-overlay';
  overlay.id='endOverlay';
  overlay.innerHTML = `
    <h2 class="font-display">${winner.id===0?app.playerName:winner.name} wins the round!</h2>
    <p>Great table — run it back or head to the menu.</p>
    <div class="end-buttons">
      <button class="btn-start" id="btnRematch">Rematch</button>
      <button class="btn-secondary" id="btnMenu">Main Menu</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('btnRematch').addEventListener('click',()=>{
    startGame(app.mode, app.variant, app.playerName, app.opponentName);
  });
  document.getElementById('btnMenu').addEventListener('click',()=>{
    removeEndOverlay();
    showScreen('landing');
  });
}
function removeEndOverlay(){
  const e = document.getElementById('endOverlay');
  if(e) e.remove();
}

})();
</script>
